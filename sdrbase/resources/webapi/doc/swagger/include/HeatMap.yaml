HeatMapSettings:
  description: HeatMap
  properties:
    inputFrequencyOffset:
      type: integer
      format: int64
      description: "Channel frequency offset from the device center frequency in Hz."
    rfBandwidth:
      description: channel RF bandwidth in Hz
      type: number
      format: float
    minPower:
      type: number
      format: float
      description: "Min power setting for Heat map."
    maxPower:
      type: number
      format: float
      description: "Max power setting for Heat map."
    colorMapName:
      type: string
      description: "Color map name setting for Heat map."
    mode:
      description: "(0 - None, 1 - Average, 2 - Max, 3 - Min, 4 - Pulse Average)"
      type: integer
      minimum: 0
      maximum: 4
    pulseThreshold:
      type: number
      format: float
      description: "Pulse threshold setting for Heat map."
    averagePeriodUS:
      description: "Averaging period in microseconds"
      type: integer
    sampleRate:
      type: integer 
      description: "Sample rate in samples per second."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    scopeConfig:
      $ref: "/doc/swagger/include/GLScope.yaml#/GLScope"
      description: "Oscilloscope-display configuration."
    channelMarker:
      $ref: "/doc/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

HeatMapReport:
  description: HeatMap
  properties:
    channelPowerDB:
      description: power received in channel (dB)
      type: number
      format: float
    channelSampleRate:
      type: integer
      description: "Effective sample rate delivered to the channel in samples per second."
