AFCSettings:
  description: "AFC settings"
  properties:
    title:
      type: string
      description: "User-visible title."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    trackerDeviceSetIndex:
      description: index of the device set of frequency tracker being used
      type: integer
    trackedDeviceSetIndex:
      description: index of the device set being tracked (channels and possibly device)
      type: integer
    hasTargetFrequency:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Adjust device frequency to match tracker frequency
          * 0 - disabled
          * 1 - enabled
    transverterTarget:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Use transverter or device frequency for tracker frequency adjustment
          * 0 - device
          * 1 - transverter
    targetFrequency:
      description: "Frequency the tracker should settle on, in Hz."
      type: integer
      format: int64
    freqTolerance:
      description: "Frequency error in Hz that is tolerated before the tracker frequency is adjusted again."
      type: integer
    trackerAdjustPeriod:
      description: Tracker channel frequency adjustment period in seconds
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIFeatureSetIndex:
      type: integer
      description: "Feature-set index used by the reverse API peer."
    reverseAPIFeatureIndex:
      type: integer
      description: "Feature index used by the reverse API peer."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

AFCReport:
  description: "AFC report"
  properties:
    runningState:
      type: integer
      minimum: 0
      maximum: 3
      description: >
        Running state
          * 0 - not started
          * 1 - idle
          * 2 - running
          * 3 - error
    trackerChannelIndex:
      description: Tracker index in device set
      type: integer
    trackerDeviceFrequency:
      description: "Centre frequency of the tracking device, in Hz."
      type: integer
      format: int64
    trackerChannelOffset:
      description: "Tracker channel offset from the device centre frequency, in Hz."
      type: integer

AFCActions:
  description: "AFC actions"
  properties:
    run:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Set the plugin running state
          * 0 - idle
          * 1 - run
    deviceTrack:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        (Re)initialize tracker target frequency adjustment
          * 0 - release
          * 1 - engage
    devicesApply:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        (Re)initialize device sets tracking
          * 0 - release
          * 1 - engage
