PacketDemodSettings:
  description: PacketDemod
  properties:
    inputFrequencyOffset:
      type: integer
      format: int64
      description: "Channel frequency offset from the device center frequency in Hz."
    mode:
      type: integer
      description: >
        Transmission mode
          * 0 - 1200 AFSK
    rfBandwidth:
      type: number
      format: float
      description: "RF bandwidth in Hz."
    chase:
      description: "Chase decoding depth. On CRC failure, retry inverting the n least confident symbols. 0 disables"
      type: integer
    mlse:
      description: "Whether to detect on the complex baseband with maximum likelihood sequence estimation instead of an FM discriminator. Worth about 9 dB. 1 by default"
      type: integer
    udpEnabled:
      description: "Whether to forward received packets to specified UDP port"
      type: integer
      minimum: 0
      maximum: 1
    udpAddress:
      description: "UDP address to forward received packets to"
      type: string
    udpPort:
      description: "UDP port to forward received packets to"
      type: integer
      minimum: 1
      maximum: 65535
    logFilename:
      type: string
      description: "Log file name or path."
    logEnabled:
      type: integer
      description: "Enable logging to the configured file (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    useFileTime:
      type: integer
      description: "Enable file time (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    channelMarker:
      $ref: "/doc/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

PacketDemodReport:
  description: PacketDemod
  properties:
    channelPowerDB:
      description: power received in channel (dB)
      type: number
      format: float
    channelSampleRate:
      type: integer
      description: "Effective sample rate delivered to the channel in samples per second."
