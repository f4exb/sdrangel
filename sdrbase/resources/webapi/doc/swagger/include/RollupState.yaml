RollupChildState:
  description: "Rollup widget child state"
  properties:
    objectName:
      type: string
      description: "Object name for Rollup child state."
    isHidden:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Boolean - child hidden state
          * 0 - visible
          * 1 - hidden

RollupState:
  description: "Rollup widget state"
  properties:
    version:
      type: integer
      description: "Version for Rollup state."
    childrenStates:
      type: array
      description: "List of children states."
      items:
        $ref: "/doc/swagger/include/RollupState.yaml#/RollupChildState"
