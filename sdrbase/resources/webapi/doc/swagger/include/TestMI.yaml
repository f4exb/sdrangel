TestMISettings:
  description: TestMISettings
  properties:
    title:
      type: string
      description: "User-visible title."
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    streams:
      description: Settings for each of the streams
      type: array
      items:
        $ref: "#/definitions/TestMiStreamSettings"

definitions:
  TestMiStreamSettings:
    description: TestMiStreamSettings
    properties:
      streamIndex:
        description: Index of the stream to which the settings apply
        type: integer
      centerFrequency:
        type: integer
        format: int64
        description: "Device center frequency in Hz."
      frequencyShift:
        type: integer
        description: "Frequency shift in Hz."
      sampleRate:
        type: integer
        description: "Sample rate in samples per second."
      log2Decim:
        type: integer
        description: "Base-2 exponent of the software decimation factor; the output sample rate is divided by 2^log2Decim."
      fcPos:
        type: integer
        description: "Position of the decimated passband relative to the device center frequency."
      sampleSizeIndex:
        type: integer
        description: "Selected sample size index."
      amplitudeBits:
        type: integer
        description: "Amplitude bits for Definitions."
      autoCorrOptions:
        type: integer
        description: "Auto corr options for Definitions."
      modulation:
        type: integer
        description: "Modulation for Definitions."
      modulationTone:
        type: integer
        description: "Modulation tone for Definitions."
      amModulation:
        type: integer
        description: "Am modulation for Definitions."
      fmDeviation:
        type: integer
        description: "FM frequency deviation in Hz."
      dcFactor:
        type: number
        format: float
        description: "Dc factor for Definitions."
      iFactor:
        type: number
        format: float
        description: "I factor for Definitions."
      qFactor:
        type: number
        format: float
        description: "Q factor for Definitions."
      phaseImbalance:
        type: number
        format: float
        description: "Phase imbalance for Definitions."
