FileOutputSettings:
    description: FileInput
    properties:
      title:
        type: string
        description: "User-visible title."
      fileName:
        description: The name (path) of the file being read
        type: string
      centerFrequency:
        type: integer
        format: int64
        description: "Device center frequency in Hz."
      sampleRate:
        type: integer
        format: int64
        description: "Sample rate in samples per second."
      log2Interp:
        type: integer
        description: "Base-2 exponent of the software interpolation factor; the output sample rate is multiplied by 2^log2Interp."
      useReverseAPI:
        description: Synchronize with reverse API (1 for yes, 0 for no)
        type: integer
        minimum: 0
        maximum: 1
      reverseAPIAddress:
        type: string
        description: "IPv4 address or host name of the reverse API peer."
      reverseAPIPort:
        type: integer
        description: "TCP port of the reverse API peer."
        minimum: 1
        maximum: 65535
      reverseAPIDeviceIndex:
        type: integer
        description: "Device-set index used by the reverse API peer."
