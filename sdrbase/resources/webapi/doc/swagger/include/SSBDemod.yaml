SSBDemodSettings:
  description: SSBDemod
  properties:
    inputFrequencyOffset:
      type: integer
      format: int64
      description: "Channel frequency offset from the device center frequency in Hz."
    filterIndex:
      type: integer
      description: "Selected filter index."
    spanLog2:
      type: integer
      description: "Base-2 exponent controlling the displayed or processed frequency span."
    rfBandwidth:
      type: number
      format: float
      description: "RF bandwidth in Hz."
    lowCutoff:
      type: number
      format: float
      description: "Lower filter cutoff frequency in Hz."
    fftWindow:
      type: integer
      minimum: 0
      maximum: 8
      description: >
        FFT Window index (FFTWindow::Function):
          * 0 - Bartlett
          * 1 - Blackman-Harris 4 term
          * 2 - Flattop
          * 3 - Hamming
          * 4 - Hanning
          * 5 - Rectangle
          * 6 - Kaiser
          * 7 - Blackman 3 term
          * 8 - Blackman-Harris 7 term
    volume:
      type: number
      format: float
      description: "Audio volume multiplier."
    audioBinaural:
      description: Audio binaural mode (1 if active else 0)
      type: integer
    audioFlipChannels:
      description: Flip audio channels (1 if flipped else 0)
      type: integer
    dsb:
      description: Double sidebands mode (1 if DSB else 0)
      type: integer
    audioMute:
      description: Mute audio (1 if muted else 0)
      type: integer
      minimum: 0
      maximum: 1
    agc:
      description: AGC (1 if AGC active else 0)
      type: integer
      minimum: 0
      maximum: 1
    agcClamping:
      description: AGC clamping (1 if AGC clampingactive else 0)
      type: integer
    agcTimeLog2:
      description: AGC averaging time log2 in milliseconds
      type: integer
    agcPowerThreshold:
      description: Audio open RF threshold (dB)
      type: integer
    agcThresholdGate:
      description: Audio squelch gate in ms
      type: integer
    dnr:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Toggle noise reduction:
          * 0 - Noise reduction off
          * 1 - Noise reduction on
    dnrScheme:
      type: integer
      minimum: 0
      maximum: 2
      description: >
        Noise reduction scheme:
          * 0 - Average of magnitudes
          * 1 - Average and standard deviation of magnitudes
          * 2 - Magnitude maxima (peaks)
    dnrAboveAvgFactor:
      type: number
      format: float
      description: Multiplier of the average to determine magnitude threshold in average scheme
    dnrSigmaFactor:
      type: number
      format: float
      description: Standard deviation (sigma) multiplier to determine magnitude threshold in average and standard deviation scheme
    dnrNbPeaks:
      type: integer
      description: Number of magnitude peak maxima selected in peaks scheme
    dnrAlpha:
      type: number
      format: float
      description: Smoothing constant (alpha) of the exponential smoothing filter. Must be between  0 and 1.
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    audioDeviceName:
      type: string
      description: "Name of the audio device to use."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    spectrumConfig:
      $ref: "/doc/swagger/include/GLSpectrum.yaml#/GLSpectrum"
      description: "Spectrum-display configuration."
    channelMarker:
      $ref: "/doc/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

SSBDemodReport:
  description: SSBDemod
  properties:
    channelPowerDB:
      description: power received in channel (dB)
      type: number
      format: float
    squelch:
      description: Audio squelch status (1 if open else 0)
      type: integer
    audioSampleRate:
      type: integer
      description: "Audio sample rate in samples per second."
    channelSampleRate:
      type: integer
      description: "Effective sample rate delivered to the channel in samples per second."
