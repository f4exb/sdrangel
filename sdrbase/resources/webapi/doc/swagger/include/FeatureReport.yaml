      $ref: "/doc/swagger/include/AMBE.yaml#/AMBEReport"
      description: "Ambe report data for Feature."
    FreqDisplayReport:
      $ref: "/doc/swagger/include/FreqDisplay.yaml#/FreqDisplayReport"
      description: "Freq display report data for Feature."
    GS232ControllerReport:
      $ref: "/doc/swagger/include/GS232Controller.yaml#/GS232ControllerReport"
