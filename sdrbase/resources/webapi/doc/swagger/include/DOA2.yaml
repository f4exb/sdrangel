DOA2Settings:
  description: DOA2
  properties:
    correlationType:
      description: see DOA2Settings::CorrelationType
      type: integer
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    log2Decim:
      type: integer
      description: "Base-2 exponent of the software decimation factor; the output sample rate is divided by 2^log2Decim."
    filterChainHash:
      type: integer
      description: "Identifier of the selected half-band filter chain."
    phase:
      type: integer
      description: Phase difference correction in degrees from -180 to +180
    antennaAz:
      type: integer
      description: Antennas azimuth from antenna 1 to antenna 2 in degrees from 0 to 359
    basebandDistance:
      type: integer
      description: Antennas baseline distance in millimeters from 1 to 99999
    squelchdB:
      type: integer
      description: Processing squared magnitude threshold (squelch) in dB from -140 t0 0
    fftAveragingValue:
      type: integer
      description: Number of FFTs to average over. Use 1, 2, 5 or 10 times 10^0 to 10^5 (1 to 1M)
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    scopeConfig:
      $ref: "/doc/swagger/include/GLScope.yaml#/GLScope"
      description: "Oscilloscope-display configuration."
    channelMarker:
      $ref: "/doc/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

DOA2Report:
  description: DOA2
  properties:
    phi:
      type: integer
      description: Raw phase difference in degrees from 0 to 180
    posAz:
      type: integer
      description: Calculated port side (positive) arrival angle in degrees from 0 to 180
    negAz:
      type: integer
      description: Calculated starboard side (negative) arrival angle in degrees from 0 to 180
    blindAngle:
      type: integer
      description: Blind angle (half sector)
    fftSize:
      type: integer
      description: Size of FFT used in correlation
    channelSampleRate:
      type: integer
      description: Channel sample rate (then used in FFT) in S/s
