ChannelMarker:
  description: ChannelMarker settings
  properties:
    centerFrequency:
      type: integer
      description: "Device center frequency in Hz."
    color:
      type: integer
      description: RGB color
    title:
      type: string
      description: "User-visible title."
    frequencyScaleDisplayType:
      type: integer
      minimum: 0
      maximum: 4
      description: >
        What is written against the channel on the frequency scale
          * 0 - the frequency
          * 1 - the channel title
          * 2 - the send address
          * 3 - the receive address
          * 4 - nothing
