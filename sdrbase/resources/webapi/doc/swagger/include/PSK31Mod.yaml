PSK31ModSettings:
  description: PSK31Mod
  properties:
    inputFrequencyOffset:
      type: integer
      format: int64
      description: "Channel frequency offset from the device center frequency in Hz."
    rfBandwidth:
      type: integer
      description: "RF bandwidth in Hz."
    gain:
      type: number
      format: float
      description: "Gain setting; units and available values depend on the device or plugin."
    channelMute:
      type: integer
      description: "Mute the channel output (1 muted, 0 unmuted)."
      minimum: 0
      maximum: 1
    repeat:
      type: integer
      description: "Repeat transmission or playback (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    repeatCount:
      type: integer
      description: "Number of repetitions."
    lpfTaps:
      type: integer
      description: "Number of low-pass FIR filter taps."
    rfNoise:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Boolean
          * 0 - off
          * 1 - on
    text:
      type: string
      description: Text to transmit
    pulseShaping:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Boolean
          * 0 - off
          * 1 - on
    beta:
      type: number
      format: float
      description: "Beta setting for Psk31 mod."
    symbolSpan:
      type: integer
      description: "Symbol span setting for Psk31 mod."
    prefixCRLF:
      type: integer
      description: "Enable prefix crlf (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    postfixCRLF:
      type: integer
      description: "Enable postfix crlf (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    udpEnabled:
      description: "Whether to receive text to transmit on specified UDP port"
      type: integer
      minimum: 0
      maximum: 1
    udpAddress:
      description: "UDP address to receive text to transmit via"
      type: string
    udpPort:
      description: "UDP port to receive text to transmit via"
      type: integer
      minimum: 1
      maximum: 65535
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    channelMarker:
      $ref: "/doc/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

PSK31ModReport:
  description: PSK31Mod
  properties:
    channelPowerDB:
      description: power transmitted in channel (dB)
      type: number
      format: float
    channelSampleRate:
      type: integer
      description: "Effective sample rate delivered to the channel in samples per second."

PSK31ModActions:
  description: PSK31Mod
  properties:
    tx:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Transmit current text
          * 0 - Do nothing
          * 1 - Transmit
    payload:
      type: object
      description: "Payload data."
      properties:
        text:
          description: PSK31 content to transmit
          type: string
