RadiosondeSettings:
  description: "Radiosonde settings"
  properties:
    title:
      type: string
      description: "User-visible title."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIFeatureSetIndex:
      type: integer
      description: "Feature-set index used by the reverse API peer."
    reverseAPIFeatureIndex:
      type: integer
      description: "Feature index used by the reverse API peer."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."
    radiosondesColumnIndexes:
      type: array
      description: "List of radiosondes column indexes."
      items:
        type: integer
    radiosondesColumnSizes:
      type: array
      description: "List of radiosondes column sizes."
      items:
        type: integer

RadiosondeReport:
  description: >
    Radiosondes heard by the Radiosonde feature, which collects the decoded frames of every
    radiosonde demodulator in the instance. A field is present only once a frame carrying it has
    been received.
  properties:
    reportDateTime:
      type: string
      description: "When this snapshot was taken, ISO 8601."
    radiosondeCount:
      type: integer
      description: "Number of radiosondes currently held."
    radiosondes:
      type: array
      description: "The radiosondes heard."
      items:
        $ref: "/doc/swagger/include/Radiosonde.yaml#/Radiosonde"

Radiosonde:
  description: Radiosonde heard by the Radiosonde feature
  properties:
    serial:
      type: string
      description: "Serial number, which identifies the sonde across a flight."
    type:
      type: string
      description: "Sonde model, such as RS41."
    latitude:
      type: number
      format: float
      minimum: -90
      maximum: 90
      description: "Latitude in decimal degrees, north positive."
    longitude:
      type: number
      format: float
      minimum: -180
      maximum: 180
      description: "Longitude in decimal degrees, east positive."
    altitude:
      type: number
      format: float
      description: "Altitude in metres above mean sea level."
    altitudeMax:
      type: number
      format: float
      description: "Greatest altitude seen this flight in metres, which indicates the burst altitude."
    speed:
      type: number
      format: float
      description: "Ground speed in km/h."
    verticalRate:
      type: number
      format: float
      description: "Ascent rate in m/s. Negative after burst."
    heading:
      type: number
      format: float
      description: "Direction of travel in degrees true."
    status:
      type: string
      description: "Status as reported by the sonde."
    pressure:
      type: number
      format: float
      description: "Atmospheric pressure in hPa."
    temperature:
      type: number
      format: float
      description: "Air temperature in degrees Celsius."
    humidity:
      type: number
      format: float
      description: "Relative humidity as a percentage."
    frequency:
      type: integer
      format: int64
      description: "Transmit frequency in Hz."
    burstKillStatus:
      type: string
      description: "Whether the burst-kill timer is armed."
    burstKillTimer:
      type: string
      description: "Time remaining on the burst-kill timer."
    lastUpdate:
      type: string
      description: "When any field was last updated, ISO 8601."
    messages:
      type: integer
      description: "Frames received from this radiosonde."
