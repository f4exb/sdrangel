FCDProSettings:
  description: FCDPro
  properties:
    title:
      type: string
      description: "User-visible title."
    centerFrequency:
      type: integer
      format: int64
      description: "Device center frequency in Hz."
    LOppmTenths:
      type: integer
      description: "Local-oscillator correction in tenths of a part per million."
    lnaGainIndex:
      type: integer
      description: "Selected lna gain index."
    rfFilterIndex:
      type: integer
      description: "Selected rf filter index."
    lnaEnhanceIndex:
      type: integer
      description: "Selected lna enhance index."
    bandIndex:
      type: integer
      description: "Selected band index."
    mixerGainIndex:
      type: integer
      description: "Selected mixer gain index."
    mixerFilterIndex:
      type: integer
      description: "Selected mixer filter index."
    biasCurrentIndex:
      type: integer
      description: "Selected bias current index."
    modeIndex:
      type: integer
      description: "Selected mode index."
    gain1Index:
      type: integer
      description: "Selected gain1 index."
    rcFilterIndex:
      type: integer
      description: "Selected rc filter index."
    gain2Index:
      type: integer
      description: "Selected gain2 index."
    gain3Index:
      type: integer
      description: "Selected gain3 index."
    gain4Index:
      type: integer
      description: "Selected gain4 index."
    ifFilterIndex:
      type: integer
      description: "Selected if filter index."
    gain5Index:
      type: integer
      description: "Selected gain5 index."
    gain6Index:
      type: integer
      description: "Selected gain6 index."
    log2Decim:
      type: integer
      description: "Base-2 exponent of the software decimation factor; the output sample rate is divided by 2^log2Decim."
    fcPos:
      type: integer
      description: "Position of the decimated passband relative to the device center frequency."
    dcBlock:
      type: integer
      description: "Enable DSP DC-offset correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    iqCorrection:
      type: integer
      description: "Enable I/Q imbalance correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    transverterMode:
      type: integer
      description: "Enable transverter frequency translation (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    transverterDeltaFrequency:
      type: integer
      format: int64
      description: "Frequency translation applied in transverter mode in Hz."
    iqOrder:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        IQ samples order
          * 0 - Q then I (swapped)
          * 1 - I then Q (straight)
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
