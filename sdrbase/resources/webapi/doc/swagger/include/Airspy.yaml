AirspySettings:
  description: Airspy
  properties:
    title:
      type: string
      description: "User-visible title."
    centerFrequency:
      type: integer
      format: int64
      description: "Device center frequency in Hz."
    LOppmTenths:
      type: integer
      description: "Local-oscillator correction in tenths of a part per million."
    devSampleRateIndex:
      type: integer
      description: "Selected dev sample rate index."
    lnaGain:
      type: integer
      minimum: 0
      maximum: 14
      description: "Low noise amplifier gain as a step index, not a dB value. Ignored when lnaAGC is enabled."
    mixerGain:
      type: integer
      minimum: 0
      maximum: 15
      description: "Mixer gain as a step index, not a dB value. Ignored when mixerAGC is enabled."
    vgaGain:
      type: integer
      minimum: 0
      maximum: 15
      description: "Variable gain amplifier (IF) gain as a step index, not a dB value."
    lnaAGC:
      description: LNA AGC (1 if active else 0)
      type: integer
    mixerAGC:
      description: Mixer AGC (1 if active else 0)
      type: integer
    log2Decim:
      type: integer
      minimum: 0
      maximum: 6
      description: "Base-2 exponent of the software decimation factor; the output sample rate is divided by 2^log2Decim."
    fcPos:
      description: 0=Infra 1=Supra 2=Center
      type: integer
      minimum: 0
      maximum: 2
    biasT:
      description: Bias tee (1 if active else 0)
      type: integer
      minimum: 0
      maximum: 1
    dcBlock:
      type: integer
      description: "Enable DSP DC-offset correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    iqCorrection:
      type: integer
      description: "Enable I/Q imbalance correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    transverterMode:
      type: integer
      description: "Enable transverter frequency translation (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    transverterDeltaFrequency:
      type: integer
      format: int64
      description: "Frequency translation applied in transverter mode in Hz."
    iqOrder:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        IQ samples order
          * 0 - Q then I (swapped)
          * 1 - I then Q (straight)
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."

AirspyReport:
  description: Airspy
  properties:
    sampleRates:
      type: array
      description: "Supported sample rates in samples per second."
      items:
        $ref: "/doc/swagger/include/Structs.yaml#/SampleRate"
