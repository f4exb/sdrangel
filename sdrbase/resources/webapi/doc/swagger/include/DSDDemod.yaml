DSDDemodSettings:
  description: DSDDemod
  properties:
    inputFrequencyOffset:
      type: integer
      format: int64
      description: "Channel frequency offset from the device center frequency in Hz."
    rfBandwidth:
      type: number
      format: float
      description: "RF bandwidth in Hz."
    fmDeviation:
      type: number
      format: float
      description: "FM frequency deviation in Hz."
    demodGain:
      type: number
      format: float
      description: "Demod gain setting for Dsd demod."
    volume:
      type: number
      format: float
      description: "Audio volume multiplier."
    baudRate:
      type: integer
      description: "Serial-port baud rate in bits per second."
    squelchGate:
      type: integer
      description: "Squelch gate duration."
    squelch:
      type: number
      format: float
      description: "Squelch threshold in dB."
    audioMute:
      type: integer
      description: "Mute audio output (1 muted, 0 unmuted)."
      minimum: 0
      maximum: 1
    enableCosineFiltering:
      type: integer
      description: "Enable cosine filtering (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    syncOrConstellation:
      type: integer
      description: "Sync or constellation setting for Dsd demod."
    slot1On:
      type: integer
      description: "Slot1 on setting for Dsd demod."
    slot2On:
      type: integer
      description: "Slot2 on setting for Dsd demod."
    tdmaStereo:
      type: integer
      description: "Tdma stereo setting for Dsd demod."
    pllLock:
      type: integer
      description: "Pll lock setting for Dsd demod."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    audioDeviceName:
      type: string
      description: "Name of the audio device to use."
    highPassFilter:
      type: integer
      description: "High pass filter setting for Dsd demod."
    traceLengthMutliplier:
      description: multiply by 50ms
      type: integer
    traceStroke:
      description: 0 to 255
      type: integer
    traceDecay:
      description: 0 to 255
      type: integer
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    channelMarker:
      $ref: "/doc/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."
    ambeFeatureIndex:
      type: integer
      description: index of AMBE controller feature to be used for AMBE frames decoding
    connectAMBE:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Decode frames with AMBE feature
          * 0 - Do not decode frames with AMBE feature
          * 1 - Decode frames with AMBE feature
DSDDemodReport:
  description: DSDDemod
  properties:
    channelPowerDB:
      description: power transmitted in channel (dB)
      type: number
      format: float
    audioSampleRate:
      type: integer
      description: "Audio sample rate in samples per second."
    channelSampleRate:
      type: integer
      description: "Effective sample rate delivered to the channel in samples per second."
    squelch:
      description: squelch status (1 if open else 0)
      type: integer
    pllLocked:
      description: symbol PLL status (1 if locked else 0)
      type: integer
    slot1On:
      description: slot 1 status (1 if voice active else 0)
      type: integer
    slot2On:
      description: slot 2 status (1 if voice active else 0)
      type: integer
    syncType:
      description: type of frame synchronized
      type: string
    inLevel:
      description: decoder input level after discriminator. Percent of mid scale (aim 100).
      type: integer
    carierPosition:
      description: position of carrier relative to discriminator center. Percent of scale (aim 0).
      type: integer
    zeroCrossingPosition:
      description: position of symbol synchronizer zero crossing in number of samples (aim 0).
      type: integer
    syncRate:
      description: successful synchronization rate. Percent of expected symbols (aim 100).
      type: integer
    statusText:
      description: mode dependent status messages (ref UI documentation)
      type: string

