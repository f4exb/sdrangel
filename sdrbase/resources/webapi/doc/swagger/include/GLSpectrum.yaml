SpectrumHistogramMarker:
  description: Spectrum histogram marker settings
  properties:
    frequency:
      type: number
      format: float
      description: "Frequency in Hz."
    power:
      type: number
      format: float
      description: Fixed power mark
    markerType:
      type: integer
      minimum: 0
      maximum: 2
      description: >
        Marker type
          * 0 - Fixed power
          * 1 - Current power
          * 2 - Max power
    markerColor:
      type: integer
      description: Color in 8 bit BGR series
    show:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Boolean - Marker display state
          * 0 - Hidden
          * 1 - Visible

SpectrumWaterfallMarker:
  description: Spectrum waterfall marker settings
  properties:
    frequency:
      type: number
      format: float
      description: "Frequency in Hz."
    time:
      type: number
      format: float
      description: Time shift in seconds
    markerColor:
      type: integer
      description: Color in 8 bit BGR series
    show:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Boolean - Marker display state
          * 0 - Hidden
          * 1 - Visible

SpectrumAnnotationMarker:
  description: Spectrum annotation marker settings
  properties:
    startFrequency:
      type: integer
      format: int64
      description: "Start frequency in Hz."
    bandwidth:
      type: integer
      description: "Bandwidth in Hz."
    markerColor:
      type: integer
      description: Color in 8 bit BGR series
    show:
      type: integer
      minimum: 0
      maximum: 2
      description: >
        SpectrumAnnotationMarker::ShowState - Marker display state
          * 0 - Hidden
          * 1 - Only top marker visible
          * 2 - Fully visible with text and full sized limits

SpectrumCalibrationPoint:
  description: Spectrum calibration point settings
  properties:
    frequency:
      type: integer
      format: int64
      description: "Frequency in Hz."
    powerRelativeReference:
      type: number
      format: float
      description: "Power relative reference for Spectrum calibration point."
    powerAbsoluteReference:
      type: number
      format: float
      description: "Power absolute reference for Spectrum calibration point."

GLSpectrum:
  description: GLSpectrumGUI settings
  properties:
    fftSize:
      type: integer
      description: "FFT size in samples."
    fftOverlap:
      type: integer
      description: "FFT overlap for Gl spectrum."
    fftWindow:
      type: integer
      minimum: 0
      maximum: 8
      description: >
        FFT Window index (FFTWindow::Function):
          * 0 - Bartlett
          * 1 - Blackman-Harris 4 term
          * 2 - Flattop
          * 3 - Hamming
          * 4 - Hanning
          * 5 - Rectangle
          * 6 - Kaiser
          * 7 - Blackman 3 term
          * 8 - Blackman-Harris 7 term
    refLevel:
      type: number
      format: float
      description: "Ref level for Gl spectrum."
    powerRange:
      type: number
      format: float
      description: "Power range for Gl spectrum."
    fpsPeriodMs:
      type: integer
      description: FPS capping period in milliseconds. 0 for no limit.
    displayWaterfall:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
    invertedWaterfall:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
    displayMaxHold:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
    displayHistogram:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
    decay:
      type: integer
      description: "Decay for Gl spectrum."
    displayGrid:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
    displayGridIntensity:
      type: integer
      description: "Display grid intensity for Gl spectrum."
    decayDivisor:
      type: integer
      description: "Decay divisor for Gl spectrum."
    histogramStroke:
      type: integer
      description: "Histogram stroke for Gl spectrum."
    displayCurrent:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
    displayTraceIntensity:
      type: integer
      description: "Display trace intensity for Gl spectrum."
    waterfallShare:
      type: number
      format: float
      description: "Waterfall share for Gl spectrum."
    averagingMode:
      description: See GLSpectrumGUI::AveragingMode
      type: integer
    averagingValue:
      type: integer
      description: "Averaging value for Gl spectrum."
    linear:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
    ssb:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
    usb:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
    wsSpectrum:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Boolean - Start or stop websocket server
          * 0 - Stop server
          * 1 - Start server
    wsSpectrumAddress:
      description: IPv4 address of interface the websocket server is listening to
      type: string
    wsSpectrumPort:
      description: port on which the websocket server is listening
      type: integer
    markersDisplay:
      type: integer
      minimum: 0
      maximum: 2
      description: >
        Display markers (SpectrumSettings::MarkersDisplay)
          * 0 - Mome
          * 1 - Spectrum markers (histogram and waterfall)
          * 2 - Spectrum annotation markers
    useCalibration:
      type: integer
      minimum: 0
      maximum: 1
      description: boolean
    calibrationInterpMode:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Interpolation scheme between points SpectrumSettings::CalibrationInterpolationMode
          * 0 - Linear
          * 1 - Log (dB linear)
    histogramMarkers:
      type: array
      description: "List of histogram markers."
      items:
        $ref: "/doc/swagger/include/GLSpectrum.yaml#/SpectrumHistogramMarker"
    waterfallMarkers:
      type: array
      description: "List of waterfall markers."
      items:
        $ref: "/doc/swagger/include/GLSpectrum.yaml#/SpectrumWaterfallMarker"
    annotationMarkers:
      type: array
      description: "List of annotation markers."
      items:
        $ref: "/doc/swagger/include/GLSpectrum.yaml#/SpectrumAnnotationMarker"
    calibrationPoints:
      type: array
      description: "List of calibration points."
      items:
        $ref: "/doc/swagger/include/GLSpectrum.yaml#/SpectrumCalibrationPoint"
