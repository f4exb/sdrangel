APRSSettings:
  description: "APRS settings"
  properties:
    igateServer:
      type: string
      description: "Igate server setting for Aprs."
    igatePort:
      type: integer
      description: "Igate port."
      minimum: 1
      maximum: 65535
    igateCallsign:
      type: string
      description: "Igate callsign setting for Aprs."
    igatePasscode:
      type: string
      description: "Igate passcode setting for Aprs."
    igateFilter:
      type: string
      description: "Igate filter setting for Aprs."
    igateEnabled:
      type: integer
      description: "Enable igate (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    title:
      type: string
      description: "User-visible title."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIFeatureSetIndex:
      type: integer
      description: "Feature-set index used by the reverse API peer."
    reverseAPIFeatureIndex:
      type: integer
      description: "Feature index used by the reverse API peer."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."
    packetsTableColumnIndexes:
      type: array
      description: "List of packets table column indexes."
      items:
        type: integer
    packetsTableColumnSizes:
      type: array
      description: "List of packets table column sizes."
      items:
        type: integer
    weatherTableColumnIndexes:
      type: array
      description: "List of weather table column indexes."
      items:
        type: integer
    weatherTableColumnSizes:
      type: array
      description: "List of weather table column sizes."
      items:
        type: integer
    statusTableColumnIndexes:
      type: array
      description: "List of status table column indexes."
      items:
        type: integer
    statusTableColumnSizes:
      type: array
      description: "List of status table column sizes."
      items:
        type: integer
    messagesTableColumnIndexes:
      type: array
      description: "List of messages table column indexes."
      items:
        type: integer
    messagesTableColumnSizes:
      type: array
      description: "List of messages table column sizes."
      items:
        type: integer
    telemetryTableColumnIndexes:
      type: array
      description: "List of telemetry table column indexes."
      items:
        type: integer
    telemetryTableColumnSizes:
      type: array
      description: "List of telemetry table column sizes."
      items:
        type: integer
    motionTableColumnIndexes:
      type: array
      description: "List of motion table column indexes."
      items:
        type: integer
    motionTableColumnSizes:
      type: array
      description: "List of motion table column sizes."
      items:
        type: integer
