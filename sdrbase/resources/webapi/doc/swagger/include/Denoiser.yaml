DenoiserSettings:
  description: Denoiser
  properties:
    denoiserType:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Denoiser type
          * 0 - none
          * 1 - RNnoise
    enableDenoiser:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Enable denoiser
          * 1 - enable
          * 0 - disable
    volumeTenths:
      type: integer
      description: >
        Output volume in tenths (e.g., 10 = 1.0)
    audioDeviceName:
      type: string
      description: Audio output device name
    audioMute:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Audio mute
          * 1 - mute
          * 0 - unmute
    title:
      type: string
      description: "User-visible title."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    fileRecordName:
      type: string
      description: Output wave file name
    recordToFile:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Recording status
          * 1 - recording
          * 0 - not recording
    useReverseAPI:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Synchronize with reverse API
          * 1 - yes
          * 0 - no
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIFeatureSetIndex:
      type: integer
      description: "Feature-set index used by the reverse API peer."
    reverseAPIFeatureIndex:
      type: integer
      description: "Feature index used by the reverse API peer."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

DenoiserActions:
  description: "Denoiser actions"
  required:
  - deviceId
  - channelId
  properties:
    deviceId:
      type: integer
      description: "Set source device Id/Number that channel belongs to"
    channelId:
      type: integer
      description: "Set source channel Id/Number of the channel within the device"
