DABDemodSettings:
  description: DABDemod
  properties:
    inputFrequencyOffset:
      type: integer
      format: int64
      description: "Channel frequency offset from the device center frequency in Hz."
    rfBandwidth:
      type: number
      format: float
      description: "RF bandwidth in Hz."
    program:
      type: string
      description: "Program setting for Dab demod."
    volume:
      type: number
      format: float
      description: "Audio volume multiplier."
    audioMute:
      type: integer
      description: "Mute audio output (1 muted, 0 unmuted)."
      minimum: 0
      maximum: 1
    audioDeviceName:
      type: string
      description: "Name of the audio device to use."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    coherent:
      type: integer
      description: "Detection: 1 coherent (decoder aided; about 1 dB more sensitive, using about twice the CPU and with 0.4 s more delay), 0 three-symbol differential."
      minimum: 0
      maximum: 1
    announcementTypes:
      type: integer
      description: "Announcement types the audio switches to while they last, one bit per type (TS 101 756 table 14): 1 road traffic, 2 transport, 3 warning, 4 news, 5 weather, 6 event, 7 special event, 8 programme information, 9 sport, 10 financial. Alarms (bit 0) are always followed. 0 for none."
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    channelMarker:
      $ref: "/doc/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

DABProgram:
  description: "A programme service discovered in the currently tuned DAB ensemble."
  properties:
    name:
      type: string
      description: "Exact transmitted service label. Use this value for the program setting."
    id:
      type: integer
      description: "DAB service identifier."

DABDemodReport:
  description: >
    Live DAB demodulator, ensemble and selected-programme status. Synchronization,
    discovered programmes and active audio do not by themselves prove clean reception;
    check SNR after selecting a programme and after every receiver gain change.
  properties:
    channelPowerDB:
      type: number
      format: float
      description: "Average power in the demodulator channel in dB."
    channelSampleRate:
      type: integer
      description: "Effective complex channel sample rate in samples per second. DAB requires 2048000."
    audioSampleRate:
      type: integer
      description: "Audio output sample rate in samples per second."
    sync:
      type: integer
      minimum: 0
      maximum: 1
      description: "DAB synchronization state (1 synchronized, 0 not synchronized)."
    snr:
      type: integer
      description: >
        DAB decoder signal-to-noise ratio in dB. A value of 0 dB or less after
        synchronization and audio become active is not a healthy result and can indicate
        receiver overload. With an RTL-SDR, reduce tuner gain through its supported values,
        wait briefly after each change, and re-read this report. Select the gain that gives
        the best positive SNR rather than assuming that higher gain is better.
    frequencyOffset:
      type: integer
      description: "Frequency offset estimated by the DAB decoder in Hz."
    ensembleName:
      type: string
      description: "Label of the currently decoded ensemble."
    ensembleId:
      type: integer
      description: "Identifier of the currently decoded ensemble."
    programs:
      type: array
      description: "Programme services discovered in the currently tuned ensemble."
      items:
        $ref: "/doc/swagger/include/DABDemod.yaml#/DABProgram"
    selectedProgram:
      type: string
      description: "Exact service label currently requested by the program setting."
    audioActive:
      type: integer
      minimum: 0
      maximum: 1
      description: "Whether programme audio metadata has been received and audio decoding is active."
    bitrate:
      type: integer
      description: "Selected programme audio bitrate in kbit/s."
    audio:
      type: string
      description: "Selected programme audio codec and channel-mode description."
    language:
      type: string
      description: "Selected programme language."
    programType:
      type: string
      description: "Selected programme type, such as News or Pop Music."
    frameQuality:
      type: integer
      minimum: 0
      maximum: 100
      description: "Percentage of valid audio frames over the last status interval: for DAB+, superframes whose Fire code checks; for DAB, frames whose CRC checks."
    reedSolomonQuality:
      type: integer
      minimum: -1
      maximum: 100
      description: "For DAB+, percentage of Reed-Solomon codewords corrected over the last status interval. -1 for DAB."
    aacQuality:
      type: integer
      minimum: -1
      maximum: 100
      description: "For DAB+, percentage of AAC access units whose CRC checks over the last status interval. -1 for DAB."
    fibQuality:
      type: integer
      minimum: 0
      maximum: 100
      description: "Fast Information Block decode quality as a percentage."
    tii:
      type: integer
      description: "Transmitter Identification Information of the strongest transmitter: main ID << 8 | sub ID. -1 when none has been found: not yet, or (after a few seconds synchronized) the ensemble sends none."
    data:
      type: string
      description: "Latest dynamic text/data associated with the selected programme."
    cn:
      type: number
      format: float
      description: "Carrier to noise ratio in dB, from the null symbol (median carrier)."
    nullDepth:
      type: number
      format: float
      description: "Null symbol power relative to the other symbols in dB."
    mscBER:
      type: number
      format: float
      description: "Channel bit error rate of the selected service before error correction (re-encoded Viterbi output). Errors start at about 0.1."
    ficBER:
      type: number
      format: float
      description: "Channel bit error rate of the FIC before error correction."
    rsCorrectedRate:
      type: number
      format: float
      description: "DAB+ Reed-Solomon corrected bytes per second."
    framesLost:
      type: integer
      description: "Transmission frames lost since tuning."
    reacquisitions:
      type: integer
      description: "Times synchronization was lost and acquired again since tuning."
    inputLevel:
      type: number
      format: float
      description: "Mean power of the channel input in dB relative to full scale."
    clipping:
      type: number
      format: float
      description: "Percentage of input samples at or near full scale."
    gainStatus:
      type: integer
      description: "Gain advice: 0 OK, 1 increase gain, 2 reduce gain, 3 check (MER well below C/N: overload, or multipath or interference), -1 unknown."
    gainAdvice:
      type: string
      description: "Gain advice as text."
    announcement:
      type: string
      description: "The announcement in progress for the program (Road traffic, News, Alarm...), empty for none."
    nowPlayingArtist:
      type: string
      description: "Artist of the item playing, from the DL Plus tags of the dynamic label."
    nowPlayingTitle:
      type: string
      description: "Title of the item playing, from the DL Plus tags of the dynamic label."
    programmeNow:
      type: string
      description: "The programme on now, from the Service and Programme Information (SPI)."
