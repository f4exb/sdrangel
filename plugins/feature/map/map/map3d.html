            // Do not end up underground when the object is low over rising terrain, or on
            // it. scene.getHeight asks the globe and the tilesets alike, so Google's tiles
            // answer too - where they are loaded, which near the aircraft they are; where
            // nothing is loaded the depth buffer is sampled instead, once per placement
            const carto = Cesium.Cartographic.fromCartesian(camera);
            if (Cesium.defined(carto)) {
                let ground = viewer.scene.getHeight(carto, Cesium.HeightReference.CLAMP_TO_GROUND);
                if (!Cesium.defined(ground)) {
                    ground = surfaceHeightAt(carto, true);
                }
                if (Cesium.defined(ground) && (carto.height < ground + flyByTerrainClearance)) {
                    carto.height = ground + flyByTerrainClearance;
                    Cesium.Cartographic.toCartesian(carto, undefined, camera);
                }
            }

            flyByCameraPos = camera;
            flyByPlacedTime = Cesium.JulianDate.clone(time, flyByPlacedTime);
            flyByProvisional = speed < flyByStationary;
            flyBySide = -flyBySide;
        }

        // Where an entity is drawn: its position at the time, lifted to the height Cesium's
        // clip last put its model at where that is higher - an aircraft on the ground is
        // sent at an altitude of 0, and drawn on the surface. Only the height is taken
        // from the model, as its matrix is a frame behind the entity: a camera following
        // the model's own position would lag it by a frame, and jitter with the frame rate
        const drawnPositionScratch = new Cesium.Cartographic();
        const drawnTranslationScratch = new Cesium.Cartesian3();
        function drawnPosition(entity, time, result) {
            const position = entity.position.getValue(time, result);
            if (!Cesium.defined(position)) {
                return undefined;
            }
            const model = getModelPrimitive(viewer, entity);
            const matrix = Cesium.defined(model) ? model._clampedModelMatrix : undefined;
            if (!Cesium.defined(matrix)) {
                return position;
            }
            const ellipsoid = viewer.scene.ellipsoid ?? Cesium.Ellipsoid.WGS84;
            const drawnHeight = Cesium.Cartographic.fromCartesian(Cesium.Matrix4.getTranslation(matrix, drawnTranslationScratch), ellipsoid, drawnPositionScratch).height;
            const cartographic = ellipsoid.cartesianToCartographic(position, drawnPositionScratch);
            if (Cesium.defined(cartographic) && (drawnHeight > cartographic.height)) {
                cartographic.height = drawnHeight;
                return ellipsoid.cartographicToCartesian(cartographic, position);
            }
            return position;
        }

        function cameraFlyBy(scene, time) {
            const entity = flyByEntity;
            if (!Cesium.defined(entity)) {
                return;
            }
            const s = flyByScratch;
            const position = drawnPosition(entity, time, s.position);
            if (!Cesium.defined(position)) {
                return;
            }
            var velocity = s.velocity;
            if (Cesium.defined(flyByVelocityProperty)) {
                velocity = flyByVelocityProperty.getValue(time, s.velocity);
            }
            if (!Cesium.defined(velocity)) {
                velocity = Cesium.Cartesian3.clone(Cesium.Cartesian3.ZERO, s.velocity);
            }

            if (!Cesium.defined(flyByCameraPos)) {
                flyByReposition(position, velocity, time);
            } else if (flyByProvisional && (Cesium.Cartesian3.magnitude(velocity) >= flyByStationary)) {
                // The object is under way now, so lead its track properly
                flyByReposition(position, velocity, time);
            } else {
                // Move on once it has gone past and is well away - but never so soon that
                // the viewpoint jumps about
                Cesium.Cartesian3.subtract(position, flyByCameraPos, s.toTarget);
                const distance = Cesium.Cartesian3.magnitude(s.toTarget);
                const receding = Cesium.Cartesian3.dot(velocity, s.toTarget) > 0;
                const held = Cesium.defined(flyByPlacedTime)
                    ? Cesium.JulianDate.secondsDifference(time, flyByPlacedTime) : flyByMinDwell;
                if (receding && (distance > flyByRepositionDistance * flyByZoom) && (Math.abs(held) >= flyByMinDwell)) {
                    flyByReposition(position, velocity, time);
                }
            }

            // Hold the viewpoint and just turn to keep the object framed
            const camera = viewer.camera;
            Cesium.Cartesian3.subtract(position, flyByCameraPos, s.direction);
            if (Cesium.Cartesian3.magnitude(s.direction) < 1.0) {
                return;
            }
            Cesium.Cartesian3.normalize(s.direction, s.direction);
            // Up is the geodetic up made perpendicular to the view direction, so the
            // horizon stays level
            flyByUpAt(flyByCameraPos, s.cameraUp);
            const along = Cesium.Cartesian3.dot(s.cameraUp, s.direction);
            Cesium.Cartesian3.subtract(s.cameraUp,
                Cesium.Cartesian3.multiplyByScalar(s.direction, along, s.offset), s.cameraUp);
            Cesium.Cartesian3.normalize(s.cameraUp, s.cameraUp);
            Cesium.Cartesian3.cross(s.direction, s.cameraUp, s.right);
            Cesium.Cartesian3.normalize(s.right, s.right);

            camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
            Cesium.Cartesian3.clone(flyByCameraPos, camera.position);
            Cesium.Cartesian3.clone(s.direction, camera.direction);
            Cesium.Cartesian3.clone(s.cameraUp, camera.up);
            Cesium.Cartesian3.clone(s.right, camera.right);
        }

        // Mouse wheel while flying by: move the viewpoint in or out along the line of
        // sight straight away, and remember the scale for the viewpoints placed later.
        // Cesium's own wheel zoom is turned off while in this mode, since the camera
        // position is written every frame and its zoom would be discarded anyway
        function flyByWheel(delta) {
            if (cameraMode !== cameraModeFlyBy) {
                return;
            }
            const zoom = Math.max(flyByZoomMin, Math.min(flyByZoomMax,
                flyByZoom * ((delta > 0) ? flyByZoomStep : 1 / flyByZoomStep)));
            const applied = zoom / flyByZoom;
            flyByZoom = zoom;
            if (Cesium.defined(flyByCameraPos) && Cesium.defined(flyByEntity)) {
                const position = drawnPosition(flyByEntity, viewer.clock.currentTime);
                if (Cesium.defined(position)) {
                    const offset = Cesium.Cartesian3.subtract(flyByCameraPos, position, new Cesium.Cartesian3());
                    Cesium.Cartesian3.multiplyByScalar(offset, applied, offset);
                    flyByCameraPos = Cesium.Cartesian3.add(position, offset, offset);
                }
            }
        }

        // First person camera
        // Scratch, so the per-frame path allocates nothing. lookAtTransform copies the
        // transform, so it can be reused
        const firstPersonScratch = {
            position: new Cesium.Cartesian3(),
            orientation: new Cesium.Quaternion(),
            rotation: new Cesium.Matrix3(),
            transform: new Cesium.Matrix4(),
            offset: new Cesium.Cartesian3(),
            direction: new Cesium.Cartesian3(),
            up: new Cesium.Cartesian3()
        };

        function cameraFirstPerson(scene, time) {
            const entity = firstPersonEntity;
            if (!Cesium.defined(entity)) {
                return;
            }
            const s = firstPersonScratch;
            const position = drawnPosition(entity, time, s.position);
            if (!Cesium.defined(position)) {
                return;
            }

            let transform;
            if (!Cesium.defined(entity.orientation)) {
                transform = Cesium.Transforms.eastNorthUpToFixedFrame(position, undefined, s.transform);
            } else {
                const orientation = entity.orientation.getValue(time, s.orientation);
                if (!Cesium.defined(orientation)) {
                    return;
                }

                transform = Cesium.Matrix4.fromRotationTranslation(
                    Cesium.Matrix3.fromQuaternion(orientation, s.rotation),
                    position,
                    s.transform
                );
            }

            const camera = viewer.camera;

            if (cameraInitPos) {
                camera.position = new Cesium.Cartesian3(firstPersonOffset, 0.0, 0.0);
                camera.direction = new Cesium.Cartesian3(1.0, 0.0, 0.0);
                camera.up = new Cesium.Cartesian3(0.0, 0.0, 1.0);
                camera.right = new Cesium.Cartesian3(0.0, -1.0, 0.0);
                cameraInitPos = false;
            }


            // Save camera state
            const offset = Cesium.Cartesian3.clone(camera.position, s.offset);
            const direction = Cesium.Cartesian3.clone(camera.direction, s.direction);
            const up = Cesium.Cartesian3.clone(camera.up, s.up);

            // Set camera to be in model's reference frame.
            camera.lookAtTransform(transform);

            // Reset the camera state to the saved state so it appears fixed in the model's frame.
            Cesium.Cartesian3.clone(offset, camera.position);
            Cesium.Cartesian3.clone(direction, camera.direction);
            Cesium.Cartesian3.clone(up, camera.up);
            Cesium.Cartesian3.cross(direction, up, camera.right);
        }

        // Image overlays

        function dataCallback(interval, index) {
            let time;
            //console.log("Interval: " + interval + " start:" + interval.start + " stop:" + interval.stop + " index: " + index);
            if (index === 0) {
                // leading
                time = Cesium.JulianDate.toIso8601(interval.stop);
            } else {
                time = Cesium.JulianDate.toIso8601(interval.start);
            }
            //console.log("Returning time: " + time);
            return {
                Time: time,
            };
        }

        const times = Cesium.TimeIntervalCollection.fromIso8601({
            iso8601: "2015-07-30/2017-06-16/P1D",   // P1D = 1 day
            leadingInterval: true,
            trailingInterval: true,
            isStopIncluded: false,
            dataCallback: dataCallback,
        });

        // See https://wiki.earthdata.nasa.gov/display/GIBS/GIBS+API+for+Developers#GIBSAPIforDevelopers-OGCWebMapService(WMS)
        var gibsProvider = new Cesium.WebMapTileServiceImageryProvider({
            url: "https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/{Time}/{TileMatrixSet}/{TileMatrix}/{TileRow}/{TileCol}.jpg",
            layer: '', // FIXME
            style: "default",
            tileMatrixSetID: "250m",
            format: "image/jpeg",
            clock: viewer.clock,
            times: times
        });
        const seaMarksProvider = new Cesium.UrlTemplateImageryProvider({
            url: "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png"
        });
        const railwaysProvider = new Cesium.UrlTemplateImageryProvider({
            url: "https://a.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png"
        });
        // The RainViewer API gives the frame path with a leading slash
        // ("/v2/radar/d89dd451e329"), so a URL built by adding one of our own asks for
        // tilecache.rainviewer.com//v2/radar/... That 404s, and because a 404 carries no
        // Access-Control-Allow-Origin the browser reports it as a CORS failure rather
        // than a missing tile. Cesium's Resource does not normalise the double slash
        // away - checked against the 1.145 bundle - so the path is trimmed here, the way
        // setNDWeatherPath() does for the navigation display's underlay
        function rainViewerUrl(path, suffix) {
            return "https://tilecache.rainviewer.com/" + String(path).replace(/^\/+/, "") + suffix;
        }
        const rainTileSuffix = "/256/{z}/{x}/{y}/4/1_1.png";
        // Past its own largest zoom RainViewer serves a "zoom not supported" placeholder
        // - the same small image at every level beyond 7 - and the cloud composite is a
        // few km per pixel, so 6 is already as much as it holds. Told the limit, Cesium
        // enlarges the tile above instead of asking for one that is not there
        const rainMaxLevel = 7;
        const cloudMaxLevel = 6;

        var rainProvider = new Cesium.UrlTemplateImageryProvider({
            url: rainViewerUrl("v2/radar/0000000000", rainTileSuffix),
            maximumLevel: rainMaxLevel
        });
        // Clouds come from EUMETSAT's global geostationary infrared composite. RainViewer
        // stopped publishing satellite infrared - its satellite.infrared array is empty -
        // and this is the only free worldwide replacement found: IR 10.8 um from every
        // geostationary satellite, so everything but the poles, published every 3 hours.
        // A WMS rather than a tile server, which Cesium asks in EPSG:4326, the projection
        // the service advertises
        function cloudProviderFor(time) {
            const parameters = {
                format: "image/png",
                transparent: true
            };
            if (time) {
                parameters.time = time;
            }
            return new Cesium.WebMapServiceImageryProvider({
                url: "https://view.eumetsat.int/geoserver/wms",
                layers: "mumi:worldcloudmap_ir108",
                parameters: parameters,
                maximumLevel: cloudMaxLevel,
                enablePickFeatures: false
            });
        }
        var cloudProvider = cloudProviderFor(undefined);

        // The infrared image is opaque grey, dark where it sees warm ground, so laid over
        // the map as it comes it would hide it. Keying the dark end out leaves the cold
        // cloud tops and lets the map through everywhere else
        // Cesium's colorToAlpha is a hard cut rather than a ramp: everything within the
        // threshold of the key colour goes fully transparent and the rest stays as it is.
        // The image is neutral grey, so the distance from black is just its brightness,
        // and 0.45 puts the cut at about 115 of 255 - measured over the whole composite,
        // warm ground sits around 70-100 and cold cloud tops run from about 160 up. The
        // layer alpha then softens what is left, since the cut has no gradient of its own
        function styleCloudLayer(layer) {
            layer.colorToAlpha = Cesium.Color.BLACK;
            layer.colorToAlphaThreshold = 0.45;
            layer.alpha = 0.75;
            return layer;
        }
        var auroraProvider = new Cesium.SingleTileImageryProvider({
            url: "aurora.png",
            tileWidth: 360,
            tileHeight: 181
        });

        var gibsLayer = new Cesium.ImageryLayer(gibsProvider);
        gibsLayer.show = false;
        viewer.imageryLayers.add(gibsLayer);
        var cloudLayer = styleCloudLayer(new Cesium.ImageryLayer(cloudProvider));
        cloudLayer.show = false;
        viewer.imageryLayers.add(cloudLayer);
        var rainLayer = new Cesium.ImageryLayer(rainProvider);
        rainLayer.show = false;
        viewer.imageryLayers.add(rainLayer);
        const seaMarksLayer = new Cesium.ImageryLayer(seaMarksProvider);
        seaMarksLayer.show = false;
        viewer.imageryLayers.add(seaMarksLayer);
        const railwaysLayer = new Cesium.ImageryLayer(railwaysProvider);
        railwaysLayer.show = false;
        viewer.imageryLayers.add(railwaysLayer);
        var auroraLayer = new Cesium.ImageryLayer(auroraProvider);
        auroraLayer.show = false;
        viewer.imageryLayers.add(auroraLayer);

        const layers = new Map([
            ["nasaGlobalImagery", gibsLayer],
            ["clouds", cloudLayer],
            ["rain", rainLayer],
            ["seaMarks", seaMarksLayer],
            ["railways", railwaysLayer],
            ["aurora", auroraLayer]
        ]);

        function downloadBlob(filename, blob) {
            if (window.navigator.msSaveOrOpenBlob) {
                window.navigator.msSaveBlob(blob, filename);
            } else {
                const elem = window.document.createElement("a");
                elem.href = window.URL.createObjectURL(blob);
                elem.download = filename;
                document.body.appendChild(elem);
                elem.click();
                document.body.removeChild(elem);
            }
        }

        function downloadText(filename, text) {
            var element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);

            element.style.display = 'none';
            document.body.appendChild(element);

            element.click();

            document.body.removeChild(element);
        }

        var dataDir = ""; // Directory where 3D models are stored
        function modelCallback(modelGraphics, time, externalFiles) {
            const resource = modelGraphics.uri.getValue(time);
            console.log("modelcallback " + resource);

            const regex = /http:\/\/127.0.0.1:\d+/;

            var file = resource.url.replace(regex, dataDir);

            // KML only supports Collada files. User will have to convert the models if required
            file = file.replace(/glb$/, "dae");
            file = file.replace(/gltf$/, "dae");

            if (navigator.platform.indexOf('Win') > -1) {
                file = file.replace(/\//g, "\\");
            }

            return file;
        }

        // Use WebSockets for handling commands from MapPlugin
        // (CZML doesn't support camera control, for example)
        // and sending events back to it
        let socket = new WebSocket("ws://127.0.0.1:$WS_PORT$");

        // Track polylines ("<name> t3d <n>") are drawn through a PolylineCollection
        // primitive rather than as CZML entities. Entity polylines go through the
        // static geometry batcher: every positions update re-combines geometry in
        // proportion to the TOTAL polyline count on the main thread, which with a
        // few hundred aircraft tracks visible stalled it for ~100 ms about once a
        // second (the perf line's longtasks) - position updates then applied late
        // and movement went jerky while the frame rate looked fine. A
        // PolylineCollection is built for dynamic updates: setting positions of the
        // same length rewrites one line's vertex data - but see handleTrackPolyline()
        // for what a change of length costs, and why each track has its own.
        var trackPolylineById = new Map();
        // One PolylineCollection per track segment, all inside one PrimitiveCollection.
        // A PolylineCollection rebuilds its vertex arrays for the whole collection when
        // any of its polylines changes its number of points - and the growing tail of a
        // track does exactly that on every update, ~28 times a second across a busy sky.
        // With every track in one collection (108 tracks, 6,410 points) that was 11-17 ms
        // in the frame each update landed in, the largest single cost of feeding the map;
        // the same update in a collection holding only that track measured +0.1 ms. The
        // PrimitiveCollection keeps show/removeAll working for everything else that uses
        // trackPolylines. One draw command per segment instead of ~30 for all tracks
        // together, which is nothing beside what far mode saves.
        function handleTrackPolyline(command) {
            if (command["delete"]) {
                const track = trackPolylineById.get(command.id);
                if (track) {
                    trackPolylines.remove(track.collection);    // Destroys it
                    trackPolylineById.delete(command.id);
                }
                return;
            }
            const p = command.polyline;
            if (!p) {
                return;
            }
            if (!trackPolylines) {
                trackPolylines = new Cesium.PrimitiveCollection();
                viewer.scene.primitives.add(trackPolylines);
            }
            let track = trackPolylineById.get(command.id);
            if (!track) {
                const collection = new Cesium.PolylineCollection();
                trackPolylines.add(collection);
                track = { collection: collection, line: collection.add({ show: false }) };
                trackPolylineById.set(command.id, track);
            }
            const line = track.line;
            if (p.positions && p.positions.cartographicDegrees) {
                clipTrackToGround(p.positions.cartographicDegrees);
                line.positions = Cesium.Cartesian3.fromDegreesArrayHeights(p.positions.cartographicDegrees);
            }
            if (p.material && p.material.solidColor) {
                const rgba = p.material.solidColor.color.rgba;
                line.material.uniforms.color = new Cesium.Color(rgba[0] / 255, rgba[1] / 255, rgba[2] / 255, rgba[3] / 255);
            }
            if (p.width !== undefined) {
                line.width = p.width;
            }
            if (p.show !== undefined) {
                line.show = p.show;
            }
        }

        // czmlStream.process returns a promise; a packet with bad data (an invalid
        // date, say) rejects it, and without a catch that surfaced as an anonymous
        // "Unhandled promise rejection" naming no entity - and a synchronous throw
        // inside a czmlArray would abandon the rest of the batch. Isolate each
        // packet and name the culprit, once per id and reason.
        var czmlProcessErrors = new Set();
        function reportProcessError(packet, e) {
            const key = (packet.id || "?") + "|" + e;
            if (!czmlProcessErrors.has(key)) {
                czmlProcessErrors.add(key);
                console.log("CZML process failed for '" + (packet.id || "?") + "': " + formatRejection(e), packet);
            }
        }
        // A window of samples is re-sent as the smoother refines it, and a refined sample
        // can be as much as 17 m from where it was first sent. The aircraft is shown a
        // few seconds behind the newest sample - the document clock starts in the past
        // for that, so it interpolates between received samples rather than guessing
        // ahead - which means the samples being rewritten are the ones under it now,
        // and it steps back or forward along its track with each refinement. So samples
        // at times the clock has already passed, or will pass within a couple of seconds,
        // are dropped from a packet: what has been shown stays where it was shown, the
        // segment being flown keeps both its ends, and refinement goes on for what has
        // not been reached. The newest sample is always kept, or a single sample arriving
        // late would be lost
        const samplesKeptAheadS = 2.0;
        function dropSamplesAlreadyShown(packet) {
            const position = packet.position;
            const coords = Cesium.defined(position) ? position.cartographicDegrees : undefined;
            if (!Cesium.defined(coords) || (coords.length <= 4) || (typeof coords[0] !== 'string')) {
                return;
            }
            const horizon = Cesium.JulianDate.addSeconds(viewer.clock.currentTime, samplesKeptAheadS, new Cesium.JulianDate());
            const kept = [];
            for (let i = 0; i < coords.length; i += 4) {
                const newest = (i + 4 >= coords.length);
                if (newest || (Cesium.JulianDate.compare(Cesium.JulianDate.fromIso8601(coords[i]), horizon) >= 0)) {
                    kept.push(coords[i], coords[i + 1], coords[i + 2], coords[i + 3]);
                }
            }
            position.cartographicDegrees = kept;
        }

        function processPacket(packet) {
            dropSamplesAlreadyShown(packet);
            try {
                const r = czmlStream.process(packet);
                if (r && r.catch) {
                    r.catch(function (e) { reportProcessError(packet, e); });
                }
            } catch (e) {
                reportProcessError(packet, e);
            }
        }

        // One CZML packet. Pulled out of the message handler so that a batched
        // "czmlArray" can run exactly the same logic per packet - including the
        // terrain sampling special cases, which stay per packet and asynchronous.
        function handleCzml(command) {
            // Track segment polylines bypass the CZML datasource - see above
            if (command.id && (command.id.indexOf(" t3d ") >= 0)) {
                handleTrackPolyline(command);
                return;
            }
            if (command["delete"]) {
                forgetLod(command.id);
            } else if (command.model) {
                lodFromPacket(command);
            }
            // Before the datasource updates the entity's uri - see noteModelChange
            if (command.model && command.model.gltf) {
                noteModelChange(command);
            }
            // Implement CLIP_TO_GROUND, to work around https://github.com/CesiumGS/cesium/issues/4049 - Now fixed, so this may be obsolete
            if (command.hasOwnProperty('altitudeReference') && command.hasOwnProperty('position') && command.position.hasOwnProperty('cartographicDegrees')) {
                clipPositionToGround(command.position.cartographicDegrees);
                processPacket(command);
            } else if ((command.hasOwnProperty('polygon') && command.polygon.hasOwnProperty('altitudeReference'))
                || (command.hasOwnProperty('polyline') && command.polyline.hasOwnProperty('altitudeReference'))) {
                // Support per vertex height reference in polygons and CLIP_TO_GROUND in polylines
                var prim = command.hasOwnProperty('polygon') ? command.polygon : command.polyline;
                var clipToGround = prim.altitudeReference == "CLIP_TO_GROUND";
                var clampToGround = prim.altitudeReference == "CLAMP_TO_GROUND";
                var size = prim.positions.cartographicDegrees.length;
                var positionCount = size / 3;
                var positions = new Array(positionCount);
                if (!hasSurfaceHeights()) {
                    if (clampToGround) {
                        for (let i = 0; i < positionCount; i++) {
                            prim.positions.cartographicDegrees[i * 3 + 2] = 0;
                        }
                    } else if (clipToGround) {
                        for (let i = 0; i < positionCount; i++) {
                            if (prim.positions.cartographicDegrees[i * 3 + 2] < 0) {
                                prim.positions.cartographicDegrees[i * 3 + 2] = 0;
                            }
                        }
                    }
                    processPacket(command);
                } else {
                    for (let i = 0; i < positionCount; i++) {
                        positions[i] = Cesium.Cartographic.fromDegrees(prim.positions.cartographicDegrees[i * 3 + 0], prim.positions.cartographicDegrees[i * 3 + 1]);
                    }
                    Promise.resolve(
                        sampleSurfaceHeight(positions),
                    ).then((updatedPositions) => {
                        if (clampToGround) {
                            for (let i = 0; i < positionCount; i++) {
                                prim.positions.cartographicDegrees[i * 3 + 2] = updatedPositions[i].height;
                            }
                        } else if (clipToGround) {
                            for (let i = 0; i < positionCount; i++) {
                                if (prim.positions.cartographicDegrees[i * 3 + 2] < updatedPositions[i].height) {
                                    prim.positions.cartographicDegrees[i * 3 + 2] = updatedPositions[i].height;
                                }
                            }
                        }
                        processPacket(command);
                    }).catch((e) => {
                        // Without this the packet was simply lost. Terrain is sampled
                        // at EVERY vertex and at maximum detail, so a large polygon
                        // asks for a great many tiles at once - the aircraft coverage
                        // outlines are 144 vertices spread over thousands of miles -
                        // and one rejected request took the whole entity with it,
                        // silently and for good. It happened at startup, when nothing
                        // is cached yet, and not when the same polygon was sent again
                        // later, which is what made it look like the item had never
                        // been sent.
                        //
                        // Drawing it unclamped is a far better outcome than not
                        // drawing it: the heights are whatever the sender gave, so at
                        // worst it sits at the ellipsoid instead of on the terrain.
                        console.warn("Terrain sampling failed for", command.id, e);
                        processPacket(command);
                    });
                }
            } else {
                processPacket(command);
            }
        }


        socket.onmessage = function (event) {
            try {
                const command = JSON.parse(event.data);

                if (command.command == "trackId") {
                    // Track an entity with the given ID
                    const entity = czmlStream.entities.getById(command.id);
                    withFullDetail(entity, function () {
                        viewer.trackedEntity = entity;
                    });
                } else if (command.command == "setHomeView") {
                    // Set the viewing rectangle used when the home button is pressed
                    Cesium.Camera.DEFAULT_VIEW_RECTANGLE = Cesium.Rectangle.fromDegrees(
                        command.longitude - command.angle,
                        command.latitude - command.angle,
                        command.longitude + command.angle,
                        command.latitude + command.angle
                    );
                    Cesium.Camera.DEFAULT_VIEW_FACTOR = 0.0;
                    viewer.camera.flyHome(0);
                } else if (command.command == "setView") {
                    // Set the camera view
                    viewer.scene.camera.setView({
                        destination: Cesium.Cartesian3.fromDegrees(command.longitude, command.latitude, command.altitude),
                        orientation: {
                            heading: 0,
                        },
                    });
                } else if (command.command == "setCameraMode") {
                    cameraMode = command.mode;
                    // Whatever is being followed now carries over to the new mode
                    const followed = Cesium.defined(viewer.trackedEntity) ? viewer.trackedEntity
                        : (Cesium.defined(firstPersonEntity) ? firstPersonEntity : flyByEntity);
                    if (cameraMode === cameraModeFirstPerson) {
                        setFirstPersonView(followed);
                    } else if (cameraMode === cameraModeFlyBy) {
                        setFlyByView(followed);
                    } else {
                        setThirdPersonView(followed);
                    }
                } else if (command.command == "playAnimation") {
                    // Play model animation
                    if (command.stop) {
                        //console.log(`stopping animation ${command.animation} for ${command.id}`);
                        recordAnimationStop(command);
                        stopAnimation(viewer, command);
                    } else {
                        //console.log(`playing animation ${command.animation} for ${command.id} command` + JSON.stringify(command));
                        // Remembered for a change of level of detail
                        command.record = recordAnimation(command);
                        playAnimation(viewer, command, 30);
                    }
                } else if (command.command == "setDateTime") {
                    // Set current date and time of viewer
                    var dateTime = Cesium.JulianDate.fromIso8601(command.dateTime);
                    viewer.clock.currentTime = dateTime;
                } else if (command.command == "getDateTime") {
                    // Get current date and time of viewer
                    reportClock();
                } else if (command.command == "setTerrain") {
                    // Support using Ellipsoid terrain for performance and also
                    // because paths can't be clammped to ground, so AIS paths
                    // currently appear underground if terrain is used
                    if (command.provider == "Ellipsoid") {
                        if (!(viewer.terrainProvider instanceof Cesium.EllipsoidTerrainProvider)) {
                            viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
                        }
                    } else if (command.provider == "Cesium World Terrain") {
                        viewer.scene.setTerrain(
                            Cesium.Terrain.fromWorldTerrain({
                                requestWaterMask: command.water,
                                requestVertexNormals: command.terrainLighting
                            })
                        );
                    } else if (command.provider == "CesiumTerrainProvider") {
                        viewer.scene.setTerrain(
                            new Cesium.Terrain(
                                Cesium.CesiumTerrainProvider.fromUrl(
                                    command.url,
                                    {
                                        requestWaterMask: command.water,
                                        requestVertexNormals: command.terrainLighting
                                    }
                                )
                            )
                        );
                    } else if (command.provider == "ArcGISTiledElevationTerrainProvider") {
                        viewer.scene.setTerrain(
                            new Cesium.Terrain(
                                Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
                                    command.url,
                                    {
                                        requestWaterMask: command.water,
                                        requestVertexNormals: command.terrainLighting
                                    })
                            )
                        );
                    } else {
                        console.log(`Unknown terrain ${command.terrain}`);
                    }
                    viewer.scene.globe.depthTestAgainstTerrain = true; // So labels/points aren't clipped by terrain
                } else if (command.command == "setBuildings") {
                    if (command.buildings == "None") {
                        if (buildings !== undefined) {
                            viewer.scene.primitives.remove(buildings);
                            buildings = undefined;
                        }
                    } else {
                        if (buildings === undefined) {
                            Promise.resolve(
                                Cesium.createOsmBuildingsAsync()
                            ).then((osmBuildingsTileset) => {
                                buildings = viewer.scene.primitives.add(osmBuildingsTileset);
                            });
                        }
                    }
                } else if (command.command == "setGooglePhotorealistic3DTiles") {
                    // Google's tileset has terrain, buildings and imagery baked in, so the globe
                    // is hidden while it's used - which hides the layers draped on it too
                    // (rain, clouds, sea marks, railways, NASA global imagery, Maidenhead grid)
                    googleTilesetEnabled = command.enabled;
                    surfaceHeights.clear(); // The surface is about to change
                    trackGroundHeights.clear();
                    trackGroundMisses.clear();
                    showGlobePickers(!command.enabled);

                    if (command.enabled) {
                        if (googleTileset === undefined) {
                            Promise.resolve(
                                Cesium.createGooglePhotorealistic3DTileset(undefined, googleTilesetOptions)
                            ).then((tileset) => {
                                if (!googleTilesetEnabled) { // Turned off while loading
                                    tileset.destroy();
                                    return;
                                }
                                googleTileset = viewer.scene.primitives.add(tileset);
                                viewer.scene.globe.show = false;
                            }).catch((e) => {
                                console.log(`Failed to create Google Photorealistic 3D Tileset: ${e}`);
                                showGlobePickers(true); // Still on the globe after all
                            });
                        }
                    } else {
                        if (googleTileset !== undefined) {
                            viewer.scene.primitives.remove(googleTileset);
                            googleTileset = undefined;
                        }
                        viewer.scene.globe.show = true;
                    }
                } else if (command.command == "setLowDetailModels") {
                    if (lowDetailModelsEnabled !== command.enabled) {
                        lowDetailModelsEnabled = command.enabled;
                        updateFarMode();    // Turned off, every aircraft goes back to full detail now
                    }
                } else if (command.command == "setLighting") {
                    viewer.scene.globe.enableLighting = command.useSunLight;
                    if (command.distantLightIntensity !== undefined) {
                        setFarModelAmbient(command.distantLightIntensity);
                    }
                    //viewer.scene.globe.nightFadeOutDistance = 0.0; // FIXME: Can't be nearly 0. Causes terrain above horizon to be blacked out in 1.129
                    // Currently Cesium only supports a single light source, either Sun or Directional
                    if (!command.useSunLight) {
                        viewer.scene.light = new Cesium.DirectionalLight({
                            direction: new Cesium.Cartesian3(1, 0, 0),
                            intensity: command.cameraLightIntensity
                        });
                        viewer.scene.preRender.addEventListener(cameraLight);
                    } else {
                        viewer.scene.light = new Cesium.SunLight();
                        viewer.scene.preRender.removeEventListener(cameraLight);
                    }
                } else if (command.command == "setCameraReferenceFrame") {
                    if (command.eci) {
                        viewer.scene.postUpdate.addEventListener(icrf);
                    } else {
                        viewer.scene.postUpdate.removeEventListener(icrf);
                    }
                } else if (command.command == "setAntiAliasing") {
                    viewer.scene.postProcessStages.fxaa.enabled = command.fxaa;
                    viewer.scene.msaaSamples = command.msaa;
                } else if (command.command == "setHDR") {
                    if (command.hdr) {
                        viewer.scene.highDynamicRange = true;
                    } else {
                        viewer.scene.highDynamicRange = false;
                    }
                } else if (command.command == "setFrameRate") {
                    setPacedFrameRate(command.frameRate);
                } else if (command.command == "setFog") {
                    if (command.fog) {
                        viewer.scene.fog.enabled = true;
                    } else {
                        viewer.scene.fog.enabled = false;
                    }
                } else if (command.command == "showFPS") {
                    if (command.show) {
                        viewer.scene.debugShowFramesPerSecond = true;
                    } else {
                        viewer.scene.debugShowFramesPerSecond = false;
                    }
                    // The counter is a mean, so it cannot show a stall - 130 ms lost once a
                    // second still reads as 60 fps. The graph shows where the time went
                    frameGraphShow(command.show);
                } else if (command.command == "showPFD") {
                    const pfdCanvas = document.getElementById("pfdCanvas");
                    if (command.show == true) {
                        startPFDUpdates();
                        // Checked every time it is shown, not just when a saved position
                        // is applied: the window may have been made smaller since
                        panelEnsureVisible(pfdCanvas);
                        canvas.removeAttribute("hidden");
                    } else {
                        canvas.setAttribute("hidden", "hidden");
                        stopPFDUpdates();
                    }
                    pfdShown = (command.show == true);
                    updateNDTimers();
                } else if (command.command == "setAudioVolume") {
                    // Playing loops pick the new volume up on the next update pass,
                    // which folds it into every layer's gain target
                    mapItemSoundVolume = command.mapItem;
                    cockpitSoundVolume = command.cockpit;
                } else if (command.command == "showND") {
                    if (command.show == true) {
                        panelEnsureVisible(ndCanvas);
                        ndCanvas.removeAttribute("hidden");
                    } else {
                        ndCanvas.setAttribute("hidden", "hidden");
                    }
                    ndShown = (command.show == true);
                    updateNDTimers();
                } else if (command.command == "showEFIS") {
                    if (command.show == true) {
                        if (efisTimer === undefined) {
                            efisTimer = setInterval(drawEFIS, 100);
                        }
                        panelEnsureVisible(efisCanvas);
                        efisCanvas.removeAttribute("hidden");
                    } else {
                        efisCanvas.setAttribute("hidden", "hidden");
                        clearInterval(efisTimer);
                        efisTimer = undefined;
                    }
                } else if (command.command == "showRMP") {
                    if (command.show == true) {
                        if (rmpTimer === undefined) {
                            rmpTimer = setInterval(updateRMP, 250);
                        }
                        panelEnsureVisible(rmpCanvas);
                        rmpCanvas.removeAttribute("hidden");
                    } else {
                        rmpCanvas.setAttribute("hidden", "hidden");
                        clearInterval(rmpTimer);
                        rmpTimer = undefined;
                    }
                } else if (command.command == "setRMPState") {
                    rmpSetState(command);
                } else if (command.command == "setEFISState") {
                    setEFISState(command.state);
                } else if (command.command == "setPanelGeometry") {
                    // Where each cockpit panel was left when SDRangel last closed
                    const g = command.panels;
                    if (g !== undefined) {
                        panelApplyGeometry(document.getElementById("pfdCanvas"), g.pfd);
                        panelApplyGeometry(ndCanvas, g.nd);
                        panelApplyGeometry(efisCanvas, g.efis);
                        panelApplyGeometry(rmpCanvas, g.rmp);
                        panelApplyGeometry(dcduCanvas, g.dcdu);
                    }
                } else if (command.command == "showDCDU") {
                    // Unchecked suppresses the pop-on-message behaviour too
                    dcduEnabled = command.show == true;
                    if (dcduEnabled) {
                        panelEnsureVisible(dcduCanvas);
                        dcduCanvas.removeAttribute("hidden");
                        drawDCDU();
                    } else {
                        dcduCanvas.setAttribute("hidden", "hidden");
                    }
                } else if (command.command == "showMUF") {
                    if (command.show == true) {
                        viewer.dataSources.add(
                            Cesium.GeoJsonDataSource.load(
                                "muf.geojson",
                                { describe: describeMUF }
                            )
                        ).then(function (dataSource) {
                            if (mufGeoJSONStream != null) {
                                viewer.dataSources.remove(mufGeoJSONStream, true);
                                mufGeoJSONStream = null;
                            }
                            mufGeoJSONStream = dataSource;
                        });
                    } else {
                        viewer.dataSources.remove(mufGeoJSONStream, true);
                        mufGeoJSONStream = null;
                    }
                } else if (command.command == "showfoF2") {
                    if (command.show == true) {
                        viewer.dataSources.add(
                            Cesium.GeoJsonDataSource.load(
                                "fof2.geojson",
                                { describe: describefoF2 }
                            )
                        ).then(function (dataSource) {
                            if (foF2GeoJSONStream != null) {
                                viewer.dataSources.remove(foF2GeoJSONStream, true);
                                foF2GeoJSONStream = null;
                            }
                            foF2GeoJSONStream = dataSource;
                        });
                    } else {
                        viewer.dataSources.remove(foF2GeoJSONStream, true);
                        foF2GeoJSONStream = null;
                    }
                } else if (command.command == "showMagneticDeclination") {
                    if (command.show == true) {
                        viewer.dataSources.add(
                            Cesium.GeoJsonDataSource.load(
                                "/map/data/wmm.geojson",
                                { describe: describeWMM }
                            )
                        ).then(function (dataSource) {
                            if (wmmGeoJSONStream != null) {
                                viewer.dataSources.remove(wmmGeoJSONStream, true);
                                wmmGeoJSONStream = null;
                            }
                            wmmGeoJSONStream = dataSource;
                        });
                    } else {
                        viewer.dataSources.remove(wmmGeoJSONStream, true);
                        wmmGeoJSONStream = null;
                    }
                } else if (command.command == "showMaidenheadGrid") {
                    showGrid(command.show);

                } else if (command.command == "setDefaultImagery") {
                    // By name, as the list is filtered when there's no Cesium Ion API key
                    const viewModel = findImageryViewModel(command.imagery);
                    if (viewModel !== undefined) {
                        viewer.baseLayerPicker.viewModel.selectedImagery = viewModel;
                    } else {
                        console.log(`Unknown imagery ${command.imagery}`);
                    }
                } else if (command.command == "showLayer") {
                    layers.get(command.layer).show = command.show;
                } else if (command.command == "setLayerSettings") {
                    if (command.layer == "NASAGlobalImagery") {
                        if ('url' in command) {
                            console.log("Using URL: " + command.url + " format: " + command.format + " matrixSet: " + command.tileMatrixSet + " dates:" + command.dates + " length: " + command.dates.length + " typeof: " + typeof (command.dates));

                            viewer.imageryLayers.remove(gibsLayer, true);

                            const times = Cesium.TimeIntervalCollection.fromIso8601({
                                iso8601: command.dates[0],
                                leadingInterval: true,
                                trailingInterval: true,
                                isStopIncluded: false,
                                dataCallback: dataCallback,
                            });

                            for (let i = 1; i < command.dates.length; i++) {

                                const times2 = Cesium.TimeIntervalCollection.fromIso8601({
                                    iso8601: command.dates[i],
                                    leadingInterval: true,
                                    trailingInterval: true,
                                    isStopIncluded: false,
                                    dataCallback: dataCallback,
                                });

                                times.removeInterval(times.get(times.length - 1)); // Remove element that goes to end of time
                                for (let i = 1; i < times2.length; i++) {
                                    times.addInterval(times2.get(i));
                                }
                            }

                            gibsProvider = new Cesium.WebMapTileServiceImageryProvider({
                                url: command.url,
                                layer: '', // FIXME
                                style: "default",
                                tileMatrixSetID: command.tileMatrixSet,
                                format: command.format,
                                clock: viewer.clock,
                                times: times
                            });

                            gibsLayer = new Cesium.ImageryLayer(gibsProvider);
                            gibsLayer.alpha = 0.5;
                            gibsLayer.show = command.show;
                            viewer.imageryLayers.add(gibsLayer);
                            layers.set(command.layer, gibsLayer);
                        }
                        if ('opacity' in command) {
                            gibsLayer.alpha = command.opacity / 100.0;
                        }
                    } else if (command.layer == "clouds") {
                        // Replacing the provider is what picks up a new frame, since the
                        // time is a request parameter rather than part of a tile path
                        viewer.imageryLayers.remove(cloudLayer, true);
                        cloudProvider = cloudProviderFor(command.time);
                        cloudLayer = styleCloudLayer(new Cesium.ImageryLayer(cloudProvider));
                        cloudLayer.show = command.show;
                        viewer.imageryLayers.add(cloudLayer);
                        layers.set(command.layer, cloudLayer);
                    } else if (command.layer == "rain") {
                        // The ND's weather radar underlay uses the same frame
                        setNDWeatherPath(command.path ? command.path : undefined);
                        viewer.imageryLayers.remove(rainLayer, true);
                        rainLayer = undefined;
                        layers.delete(command.layer);
                        if (command.path) {
                            rainProvider = new Cesium.UrlTemplateImageryProvider({
                                url: rainViewerUrl(command.path, rainTileSuffix),
                                maximumLevel: rainMaxLevel
                            });
                            rainLayer = new Cesium.ImageryLayer(rainProvider);
                            rainLayer.show = command.show;
                            viewer.imageryLayers.add(rainLayer);
                            layers.set(command.layer, rainLayer);
                        }
                    } else if (command.layer == "aurora") {
                        viewer.imageryLayers.remove(auroraLayer, true);
                        auroraProvider = new Cesium.SingleTileImageryProvider({
                            url: "aurora.png",
                            tileWidth: 360,
                            tileHeight: 181
                        });
                        auroraLayer = new Cesium.ImageryLayer(auroraProvider);
                        auroraLayer.show = command.show;
                        viewer.imageryLayers.add(auroraLayer);
                        layers.set(command.layer, auroraLayer);
                    } else {
                        console.log("Unknown layer: " + command.layer);
                    }
                } else if (command.command == "updateImage") {

                    // Textures on entities can flash white when changed: https://github.com/CesiumGS/cesium/issues/1640
                    // so we use a primitive instead of an entity - FIXME: No longer working
                    // Can't modify geometry of primitives, so need to create a new primitive each time
                    // Material needs to be set as translucent in order to allow camera to zoom through it
                    var oldImage = images.get(command.name);
                    var image = viewer.scene.primitives.add(new Cesium.Primitive({
                        geometryInstances: new Cesium.GeometryInstance({
                            geometry: new Cesium.RectangleGeometry({
                                rectangle: Cesium.Rectangle.fromDegrees(command.west, command.south, command.east, command.north),
                                vertexFormat: Cesium.EllipsoidSurfaceAppearance.VERTEX_FORMAT,
                                height: command.altitude
                            })
                        }),
                        appearance: new Cesium.EllipsoidSurfaceAppearance({
                            aboveGround: false,
                            material: new Cesium.Material({
                                fabric: {
                                    type: 'Image',
                                    uniforms: {
                                        image: command.data,
                                    }
                                },
                                translucent: true
                            })
                        })
                    }));
                    images.set(command.name, image);
                    if (oldImage !== undefined) {
                        const removeListener = viewer.scene.postRender.addEventListener(() => {
                            if (!image.ready) {
                                return;
                            }
                            viewer.scene.primitives.remove(oldImage);
                            removeListener();
                        });
                    }
                } else if (command.command == "removeImage") {
                    var image = images.get(command.name);
                    if (image !== undefined) {
                        viewer.scene.primitives.remove(image);
                    } else {
                        console.log(`Can't find image ${command.name} to remove it`);
                    }
                } else if (command.command == "removeAllImages") {
                    for (let [k, image] of images) {
                        viewer.scene.primitives.remove(image);
                    }
                } else if (command.command == "setNDAirports") {
                    // The whole airport database for the ND's airport overlay
                    setNDAirports(command.airports);
                } else if (command.command == "setNDNavAids") {
                    setNDNavAids(command.navAids);
                } else if (command.command == "removeAllCZMLEntities") {
                    czmlStream.entities.removeAll();
                    lodEntities.clear();
                    entityAnimations.clear();
                    if (trackPolylines) {
                        trackPolylines.removeAll();
                        trackPolylineById.clear();
                    }
                } else if (command.command == "czmlArray") {
                    // A whole flush of packets in one message: one message, one
                    // JSON parse and one pass, rather than one of each per aircraft.
                    for (let i = 0; i < command.packets.length; i++) {
                        handleCzml(command.packets[i]);
                    }
                } else if (command.command == "czml") {
                    handleCzml(command);
                } else if (command.command == "save") {
                    // Export to kml/kmz
                    dataDir = command.dataDir;
                    Cesium.exportKml({
                        entities: czmlStream.entities,
                        kmz: command.filename.endsWith("kmz"),
                        modelCallback: modelCallback
                    }).then(function (result) {
                        if (command.filename.endsWith("kmz")) {
                            downloadBlob(command.filename, result.kmz);
                        } else {
                            downloadText(command.filename, result.kml);
                        }
                    });
                } else {
                    console.log(`Unknown command ${command.command}`);
                }

            } catch (e) {
                console.log(`Erroring processing received message:\n${e}\n${event.data}`);
            }
        };

        function setFirstPersonView(entity) {
            clearFarAmbient(entity);
            // Only one camera handler at a time, or they fight over the camera each frame
            viewer.scene.postUpdate.removeEventListener(cameraFlyBy);
            viewer.scene.screenSpaceCameraController.enableZoom = true;
            flyByEntity = undefined;
            flyByCameraPos = undefined;
            if (!Cesium.defined(entity)) {
                viewer.scene.postUpdate.removeEventListener(cameraFirstPerson);
                return;
            }

            const camera = viewer.camera;

            // Save current camera position/orientation so we can restore it, when going back to third person
            /*
            cameraSavedPosition = camera.positionWC.clone(cameraSavedPosition);
            cameraSavedHeading = camera.heading;
            cameraSavedPitch = camera.pitch;
            cameraSavedRoll = camera.roll;
            cameraSavedTransform = camera.transform.clone(cameraSavedTransform);
            cameraSavedPositionValid = true;
            console.log("******* SAVED POSITION", cameraSavedPosition, cameraSavedHeading, cameraSavedPitch, cameraSavedRoll, cameraSavedTransform);*/

            viewer.trackedEntity = entity; // So infobox camera icon indicates we're trackingd
            viewer.cesiumWidget._needTrackedEntityUpdate = false;  // Prevent camera from zooming to it a bit later, and overwriting the position we set

            firstPersonEntity = entity;

            // Get size of model, so we can position camera at front of it, rather than in the middle
            if (Cesium.defined(firstPersonEntity) && Cesium.defined(firstPersonEntity.id)) {
                var primitives = viewer.scene.primitives;
                var length = primitives.length;
                for (var i = 0; i < length; i++) {
                    var primitive = primitives.get(i);
                    if (primitive.id === firstPersonEntity && primitive instanceof Cesium.Model && primitive.ready) {
                        firstPersonOffset = primitive.boundingSphere.radius;
                    }
                }
            }

            cameraInitPos = true;

            viewer.scene.postUpdate.addEventListener(cameraFirstPerson);
        }

        function setFlyByView(entity) {
            clearFarAmbient(entity);
            viewer.scene.postUpdate.removeEventListener(cameraFirstPerson);
            firstPersonEntity = undefined;
            if (!Cesium.defined(entity)) {
                // Nothing to follow, so the wheel goes back to Cesium
                viewer.scene.postUpdate.removeEventListener(cameraFlyBy);
                viewer.scene.screenSpaceCameraController.enableZoom = true;
                flyByEntity = undefined;
                return;
            }

            viewer.trackedEntity = entity; // So the infobox camera icon shows it is being followed
            viewer.cesiumWidget._needTrackedEntityUpdate = false; // Or Cesium flies to it a frame later

            flyByEntity = entity;
            flyByVelocityProperty = Cesium.defined(entity.position)
                ? new Cesium.VelocityVectorProperty(entity.position, false) : undefined;
            flyByCameraPos = undefined;    // Placed on the first frame, from where it is then
            flyByPlacedTime = undefined;
            flyByProvisional = false;

            // Removed first: Cesium keeps duplicate registrations, and re-entering fly-by
            // would otherwise run the handler twice a frame
            viewer.scene.postUpdate.removeEventListener(cameraFlyBy);
            viewer.scene.postUpdate.addEventListener(cameraFlyBy);
            viewer.scene.screenSpaceCameraController.enableZoom = false;
        }

        function setThirdPersonView(entity) {
            clearFarAmbient(entity);
            viewer.scene.postUpdate.removeEventListener(cameraFlyBy);
            viewer.scene.screenSpaceCameraController.enableZoom = true;
            flyByEntity = undefined;
            flyByCameraPos = undefined;
            viewer.trackedEntity = undefined; // If we're switching from first to third, ensure trackedEntity changes, so camera switches to it
            viewer.trackedEntity = entity;
            viewer.scene.postUpdate.removeEventListener(cameraFirstPerson);
            firstPersonEntity = undefined;
            /*if (cameraSavedPositionValid && !Cesium.defined(entity)) {
                console.log("******* SAVED POSITION RESTORED", cameraSavedPosition, cameraSavedHeading, cameraSavedPitch, cameraSavedRoll, cameraSavedTransform);
                const camera = viewer.camera;
                camera.setView({
                    destination: cameraSavedPosition,
                    orientation: {
                        heading: cameraSavedHeading,
                        pitch: cameraSavedPitch,
                        roll: cameraSavedRoll
                    },
                    endTransform: cameraSavedTransform
                });
                //camera.transform = Cesium.Matrix4.clone(cameraSavedTransform, camera.transform);
                cameraSavedPositionValid = false;
            } else {
                console.log("******* SAVED POSITION NOT RESTORED");
            }*/
        }

        function infoBoxCameraClicked(infoBoxViewModel) {
            if (infoBoxViewModel.isCameraTracking && viewer.trackedEntity === viewer.selectedEntity) {
                if (cameraMode !== cameraModeThirdPerson) {
                    setThirdPersonView(undefined);
                } else {
                    viewer.trackedEntity = undefined;
                }
            } else {
                const selectedEntity = viewer.selectedEntity;
                withFullDetail(selectedEntity, function () {
                    if (cameraMode === cameraModeFirstPerson) {
                        setFirstPersonView(selectedEntity);
                    } else if (cameraMode === cameraModeFlyBy) {
                        setFlyByView(selectedEntity);
                    } else {
                        const position = selectedEntity.position;
                        if (Cesium.defined(position)) {
                            setThirdPersonView(selectedEntity);
                        } else {
                            viewer.zoomTo(selectedEntity);
                        }
                    }
                });
            }
        }

        viewer.selectedEntityChanged.addEventListener(function (selectedEntity) {
            if (Cesium.defined(selectedEntity) && Cesium.defined(selectedEntity.id)) {
                socket.send(JSON.stringify({ event: "selected", id: selectedEntity.id }));
                // Calculate it's velocity for PFD
                velocityVectorProperty = new Cesium.VelocityVectorProperty(selectedEntity.position, false);
            } else {
                socket.send(JSON.stringify({ event: "selected" }));
            }
        });

        viewer.trackedEntityChanged.addEventListener(function (trackedEntity) {
            updateFarMode();    // A followed aircraft is drawn in full detail
            if (Cesium.defined(trackedEntity) && Cesium.defined(trackedEntity.id)) {
                socket.send(JSON.stringify({ event: "tracking", id: trackedEntity.id }));
            } else {
                socket.send(JSON.stringify({ event: "tracking" }));
            }
        });

        // Report clock changes for use by other plugins
        var systemTime = new Cesium.JulianDate();
        function reportClock() {
            if (socket.readyState === 1) {
                Cesium.JulianDate.now(systemTime);
                socket.send(JSON.stringify({
                    event: "clock",
                    canAnimate: viewer.clock.canAnimate,
                    shouldAnimate: viewer.clock.shouldAnimate,
                    currentTime: Cesium.JulianDate.toIso8601(viewer.clock.currentTime),
                    multiplier: viewer.clock.multiplier,
                    systemTime: Cesium.JulianDate.toIso8601(systemTime)
                }));
            }
        };

        // Can be called by onclick handler in anchors in the infobox, to pass a URL to SDRangel
        function infoboxLink(url) {
            socket.send(JSON.stringify({ event: "link", url: url }));
            return false;
        }

        // Use WASD keys to move camera
        document.addEventListener('keydown', function (event) {
            var amount = 0.5;
            if (event.key == 'w') {
                viewer.camera.moveUp(amount);
            } else if (event.key == 's') {
                viewer.camera.moveDown(amount);
            } else if (event.key == 'a') {
                viewer.camera.moveLeft(amount);
            } else if (event.key == 'd') {
                viewer.camera.moveRight(amount);
            } else if (event.key == 'q') {
                viewer.camera.moveForward(amount);
            } else if (event.key == 'e') {
                viewer.camera.moveBackward(amount);
            }
        });

        Cesium.knockout.getObservable(viewer.clockViewModel, 'shouldAnimate').subscribe(function (isAnimating) {
            reportClock();
        });
        Cesium.knockout.getObservable(viewer.clockViewModel, 'multiplier').subscribe(function (multiplier) {
            reportClock();
        });
        // This is called every frame, which is too fast, so instead use setInterval with 1 second period
        //Cesium.knockout.getObservable(viewer.clockViewModel, 'currentTime').subscribe(function(currentTime) {
        //reportClock();
        //});
        setInterval(function () {
            reportClock();
        }, 1000);
        viewer.timeline.addEventListener('settime', reportClock, false);

        socket.onopen = () => {
            reportClock();
        };

        // ---- frame time graph ----
        // Drawn alongside the FPS counter, so the existing showFPS command toggles both and
        // there is no new setting to plumb through the API, the GUI and the serialiser.
        //
        // The x axis is TIME, not frame number. A stall has to appear as wide as it was
        // long, otherwise it is compressed into a single bar and the graph stops matching
        // what was actually seen - which is the whole point of having it. A mean frame rate
        // cannot show a stall at all: 130 ms lost once a second still reads as 60 fps.
        //
        // Intervals are recorded on every rendered frame, but the canvas is redrawn at most
        // every frameGraphRedrawMs. A graph for diagnosing frame time must not spend much
        // of it, and at 20 redraws a second it still looks live.
        //
        // The colours and the reference lines are relative to the rate the renderer is being
        // PACED at, not to a fixed 60 fps. A 60 fps line says nothing once the page is paced
        // at 120: every frame sits below it and the graph is uniformly green, including the
        // frames that missed their slot. What matters is whether a frame arrived when it was
        // due, and due is whatever setPacedFrameRate was last given.
        const frameGraphSeconds = 5.0;
        const frameGraphRedrawMs = 50;
        // A gap of k intervals means k - 1 frames were lost, so the boundaries sit halfway
        // between whole slots: green is one slot and nothing lost, amber is two and one lost,
        // red is three or more
        const frameGraphAmberIntervals = 1.5;
        const frameGraphRedIntervals = 2.5;
        const frameGraphFullScaleIntervals = 2.2;  // leaves the half rate line clear of the top
        // Ring buffers, so recording a frame allocates nothing. Sized for the window at the
        // ~850 Hz rAF free-runs at with the frame rate limiter off; if it ever fills, the
        // oldest frames go first
        const frameGraphCapacity = 8192;
        const frameGraph = {
            canvas: null,
            ctx: null,
            shown: false,
            width: 0,
            height: 0,
            stamps: new Float64Array(frameGraphCapacity),   // performance.now() at each frame
            gaps: new Float64Array(frameGraphCapacity),     // ms since the frame before it
            sorted: new Float64Array(frameGraphCapacity),   // gaps, sorted for the quantiles
            start: 0,                         // index of the oldest frame
            count: 0,
            last: 0,
            lastDraw: 0
        };

        // The paced interval in ms, which every threshold below is a multiple of. With
        // pacing off the page free runs and there is no slot to be late for, so fall back to
        // 60 fps - an arbitrary reference, but the familiar one.
        function frameGraphInterval() {
            return 1000.0 / ((pacedFrameRate > 0) ? pacedFrameRate : 60.0);
        }

        function frameGraphSetup() {
            const canvas = document.getElementById("frameGraphCanvas");

            if (canvas === null) {
                return false;
            }
            // clientWidth reads 0 while the element is hidden, so this must run after the
            // hidden attribute has gone
            const ratio = window.devicePixelRatio || 1.0;
            frameGraph.width = canvas.clientWidth || 360;
            frameGraph.height = canvas.clientHeight || 110;
            canvas.width = Math.round(frameGraph.width * ratio);
            canvas.height = Math.round(frameGraph.height * ratio);
            frameGraph.canvas = canvas;
            frameGraph.ctx = canvas.getContext("2d");
            frameGraph.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            return true;
        }

        function frameGraphRecord() {
            const now = performance.now();

            if (frameGraph.last !== 0) {
                if (frameGraph.count === frameGraphCapacity) {
                    frameGraph.start = (frameGraph.start + 1) % frameGraphCapacity;
                    frameGraph.count--;
                }
                const i = (frameGraph.start + frameGraph.count) % frameGraphCapacity;
                frameGraph.stamps[i] = now;
                frameGraph.gaps[i] = now - frameGraph.last;
                frameGraph.count++;
            }
            frameGraph.last = now;

            const cutoff = now - frameGraphSeconds * 1000.0;
            while ((frameGraph.count > 0) && (frameGraph.stamps[frameGraph.start] < cutoff)) {
                frameGraph.start = (frameGraph.start + 1) % frameGraphCapacity;
                frameGraph.count--;
            }
            if ((now - frameGraph.lastDraw) >= frameGraphRedrawMs) {
                frameGraph.lastDraw = now;
                frameGraphDraw(now);
            }
        }

        function frameGraphDraw(now) {
            const ctx = frameGraph.ctx;

            if (ctx === null) {
                return;
            }
            const width = frameGraph.width;
            const height = frameGraph.height;
            const top = 15;
            const plot = height - top - 2;
            const gaps = frameGraph.gaps;
            const stamps = frameGraph.stamps;
            const first = frameGraph.start;
            const count = frameGraph.count;
            const interval = frameGraphInterval();

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
            ctx.fillRect(0, 0, width, height);

            // A typed array sorts numerically by default, with no comparator
            const sorted = frameGraph.sorted.subarray(0, count);
            for (let i = 0; i < count; i++) {
                sorted[i] = gaps[(first + i) % frameGraphCapacity];
            }
            sorted.sort();
            const quantile = (p) => (sorted.length === 0) ? 0.0
                : sorted[Math.min(sorted.length - 1, Math.round(p * (sorted.length - 1)))];
            const worst = (sorted.length === 0) ? 0.0 : sorted[sorted.length - 1];

            // Full scale comes from the 95th percentile, not the worst frame. Scaling to the
            // worst means a single 200 ms stall sets full scale to 272 ms and flattens every
            // normal frame into an unreadable strip along the bottom, hiding the 10-30 ms
            // variation that is most of what there is to see. Frames above full scale clip
            // at the top in red, and the true worst is always in the readout. Doubling steps
            // so the axis does not jump about between redraws
            let full = interval * frameGraphFullScaleIntervals;
            while (full < quantile(0.95) * 1.6) {
                full *= 2;
            }

            const msToY = (ms) => top + plot * (1.0 - Math.min(ms, full) / full);
            const timeToX = (t) => width * (t - (now - frameGraphSeconds * 1000.0))
                / (frameGraphSeconds * 1000.0);

            for (let i = 0; i < count; i++) {
                const j = (first + i) % frameGraphCapacity;
                const gap = gaps[j];
                const end = timeToX(stamps[j]);
                const start = timeToX(stamps[j] - gap);
                const y = msToY(gap);

                ctx.fillStyle = (gap <= interval * frameGraphAmberIntervals) ? "#51d88a"
                    : ((gap <= interval * frameGraphRedIntervals) ? "#ffc861" : "#ff6b6b");
                ctx.fillRect(start, y, Math.max(end - start, 1.0), top + plot - y);
            }

            // The paced rate, and half it: the first is where frames belong, the second is
            // where losing one puts them. Drawn over the bars, because the paced rate line
            // sits exactly along their tops and drawn underneath it and its label vanish
            ctx.font = "9px sans-serif";
            ctx.lineWidth = 1;
            for (const divisor of [1, 2]) {
                const ms = interval * divisor;

                if (ms > full) {
                    continue;
                }
                const y = Math.round(msToY(ms)) + 0.5;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width - 23, y);
                ctx.stroke();
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                ctx.fillText((1000.0 / ms).toFixed(0), width - 21, y + 3);
            }

            const span = (count > 1) ? (stamps[(first + count - 1) % frameGraphCapacity] - stamps[first]) : 0;
            const rate = (span > 0) ? (1000.0 * (count - 1) / span) : 0.0;

            ctx.fillStyle = "#ffffff";
            ctx.font = "10px sans-serif";
            ctx.fillText(rate.toFixed(0) + " fps    p50 " + quantile(0.5).toFixed(1)
                + "    p95 " + quantile(0.95).toFixed(1) + "    max " + worst.toFixed(0)
                + " ms    full scale " + full.toFixed(0) + " ms", 3, 11);
        }

        function frameGraphShow(show) {
            if (show) {
                const canvas = (frameGraph.canvas !== null) ? frameGraph.canvas
                    : document.getElementById("frameGraphCanvas");

                if (canvas === null) {
                    return;
                }
                canvas.removeAttribute("hidden");
                if (!frameGraphSetup()) {
                    return;
                }
                if (!frameGraph.shown) {
                    frameGraph.shown = true;
                    frameGraph.last = 0;
                    frameGraph.lastDraw = 0;
                    frameGraph.start = 0;
                    frameGraph.count = 0;
                    viewer.scene.postRender.addEventListener(frameGraphRecord);
                }
            } else {
                if (frameGraph.shown) {
                    frameGraph.shown = false;
                    viewer.scene.postRender.removeEventListener(frameGraphRecord);
                }
                if (frameGraph.canvas !== null) {
                    frameGraph.canvas.setAttribute("hidden", "hidden");
                }
            }
        }
        // ---- end frame time graph ----



    </script>
