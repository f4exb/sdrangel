<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script src="/Cesium/Cesium.js"></script>
    <style>
        @import url(/Cesium/Widgets/widgets.css);

        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
</head>
<body style="margin:0;padding:0">
    <div id="cesiumContainer"></div>
    <script src="aircraftaudio.js"></script>
    <script src="grid.js"></script>
    <script>

        // Cesium rejects some promises with plain objects rather than Errors, which the
        // application log shows as an unhelpful "[object Object]" - so give every
        // rejection a readable form, and report any that nothing caught
        function formatRejection(e) {
            if (e instanceof Error) {
                return `${e.name}: ${e.message}`;
            }
            try {
                return JSON.stringify(e);
            } catch (x) {
                return String(e);
            }
        }

        // Cesium's own logging passes objects to console.log as well, which the
        // application log shows the same way - so those get the same readable form
        const consoleLog = console.log.bind(console);
        console.log = function (...args) {
            consoleLog(...args.map((a) => ((a !== null) && (typeof a === 'object')) ? formatRejection(a) : a));
        };

        window.addEventListener("unhandledrejection", function (ev) {
            console.log("Unhandled promise rejection: " + formatRejection(ev.reason));
            ev.preventDefault();
        });

        // See: https://community.cesium.com/t/how-to-run-an-animation-for-an-entity-model/16932
        // The loaded Model primitive drawn for an entity, if there is one yet
        function getModelPrimitive(viewer, entity) {
            var primitives = viewer.scene.primitives;
            var length = primitives.length;
            for (var i = 0; i < length; i++) {
                var primitive = primitives.get(i);
                if (primitive.id === entity && primitive instanceof Cesium.Model && primitive.ready) {
                    return primitive;
                }
            }
            return undefined;
        }

        function getActiveAnimations(viewer, entity) {
            var primitive = getModelPrimitive(viewer, entity);
            return (primitive !== undefined) ? primitive.activeAnimations : undefined;
        }

        // Sounds accompanying model animations, positioned in 3D at the entity they are
        // for, relative to the camera, so they appear to come from the aircraft
        // How sound falls away with distance, shared by the one-shots and the engine
        // loops. Within the reference distance it is at full volume; beyond it the
        // inverse law applies, steepened by the rolloff. The maximum matters as much as
        // the shape: WebAudio's default is 10 km, at which point the distance stops
        // being taken into account at all - and engine loops play out to 20 km
        const audioRefDistance = 500;   // Metres
        const audioRolloffFactor = 2;
        const audioMaxDistance = 50000;

        // Doppler shift. WebAudio's own doppler support (setVelocity, dopplerFactor) was
        // removed from the specification years ago, so the shift is applied by hand to the
        // sample playback rate. Clamped well inside what the physics gives - an airliner
        // approaching at 250 m/s is Mach 0.7 and would shift by nearly four times, which
        // turns a recorded engine into a squeal
        const dopplerSpeedOfSound = 343;    // m/s
        const dopplerMinRate = 0.75;        // Receding
        const dopplerMaxRate = 1.35;        // Approaching
        const dopplerJumpLimit = 400;       // m/s, beyond which the camera or target jumped
        const dopplerSmoothing = 0.4;       // Of the shift itself, per update
        var spatialAudioContext = null;
        const spatialAudioBuffers = new Map(); // Full audio URL -> Promise of decoded AudioBuffer

        // [0..1] From the Map Display Settings volume sliders
        var mapItemSoundVolume = 1.0; // Sounds located at map items - engines and animations
        var cockpitSoundVolume = 1.0; // Cockpit sounds - callouts and the datalink ring

        function ensureSpatialAudioContext() {
            if (spatialAudioContext === null) {
                spatialAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            // A suspended context plays nothing, silently
            if (spatialAudioContext.state === "suspended") {
                spatialAudioContext.resume().catch(() => { });
            }
            return spatialAudioContext;
        }

        function getSpatialAudioBuffer(name) {
            const url = name.startsWith("/") || name.includes("://") ? name : "../audio/" + name;
            if (!spatialAudioBuffers.has(url)) {
                spatialAudioBuffers.set(url,
                    fetch(url)
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error("HTTP " + response.status);
                            }
                            return response.arrayBuffer();
                        })
                        .then((data) => spatialAudioContext.decodeAudioData(data))
                );
            }
            return spatialAudioBuffers.get(url);
        }

        function playSpatialAudio(name, entity) {
            try {
                ensureSpatialAudioContext();
                const position = entity.position.getValue(viewer.clock.currentTime);
                if (!Cesium.defined(position)) {
                    return;
                }
                // The entity's position in the WebAudio listener frame, which is the
                // camera's: x right, y up, -z forward. Units are metres in both.
                const camera = viewer.camera;
                const delta = Cesium.Cartesian3.subtract(position, camera.positionWC, new Cesium.Cartesian3());
                const x = Cesium.Cartesian3.dot(delta, camera.rightWC);
                const y = Cesium.Cartesian3.dot(delta, camera.upWC);
                const z = -Cesium.Cartesian3.dot(delta, camera.directionWC);
                getSpatialAudioBuffer(name)
                    .then((buffer) => {
                        const source = spatialAudioContext.createBufferSource();
                        source.buffer = buffer;
                        const panner = spatialAudioContext.createPanner();
                        panner.panningModel = "HRTF";
                        panner.distanceModel = "inverse";
                        panner.refDistance = audioRefDistance;
                        panner.rolloffFactor = audioRolloffFactor;
                        panner.maxDistance = audioMaxDistance;
                        if (panner.positionX !== undefined) {
                            panner.positionX.value = x;
                            panner.positionY.value = y;
                            panner.positionZ.value = z;
                        } else {
                            panner.setPosition(x, y, z);
                        }
                        const gain = spatialAudioContext.createGain();
                        gain.gain.value = mapItemSoundVolume;
                        source.connect(gain);
                        gain.connect(panner);
                        panner.connect(spatialAudioContext.destination);
                        source.start();
                    })
                    .catch((e) => {
                        console.log(`Spatial audio ${name} failed: ${e}`);
                        const url = name.startsWith("/") || name.includes("://") ? name : "../audio/" + name;
                        spatialAudioBuffers.delete(url); // So a transient fetch failure can be retried
                    });
            } catch (e) {
                console.log(`Spatial audio failed: ${e}`);
            }
        }

        // Sounds looped at entities that have a loopSound property. A value ending in
        // an audio extension is a legacy single recording; any other value names a
        // directory below /3d/Sounds containing engine.json and its OGG layers.
        const loopSounds = new Map();
        const loopSoundErrors = new Set();
        const loopSoundRange = 20000;
        const loopSoundStopRange = 22000;
        const loopSoundGain = 0.5;
        const loopSoundMaxCount = 8;
        const loopSoundRetryMilliseconds = 10000;
        var loopSoundBus = null;

        function loopSoundProperty(entity, name, time) {
            const p = entity.properties;
            if (Cesium.defined(p) && p.hasProperty(name)) {
                return p[name].getValue(time);
            }
            return undefined;
        }

        function logLoopSoundError(key, message) {
            if (!loopSoundErrors.has(key)) {
                loopSoundErrors.add(key);
                console.log(message);
            }
        }

        function ensureLoopSoundBus() {
            ensureSpatialAudioContext();
            if (loopSoundBus === null) {
                // Several layers and aircraft can peak together. A gentle final limiter
                // protects the rest of the Map audio without changing the layer curves.
                const limiter = spatialAudioContext.createDynamicsCompressor();
                limiter.threshold.value = -6.0;
                limiter.knee.value = 6.0;
                limiter.ratio.value = 6.0;
                limiter.attack.value = 0.005;
                limiter.release.value = 0.25;
                limiter.connect(spatialAudioContext.destination);
                loopSoundBus = limiter;
            }
            return loopSoundBus;
        }

        function isSingleLoopSound(name) {
            return !name.includes("..") && /^[A-Za-z0-9._-]+\.(wav|ogg)$/i.test(name);
        }

        function createLoopMaster(entry) {
            const master = spatialAudioContext.createGain();
            master.gain.value = loopSoundGain * mapItemSoundVolume;
            master.connect(ensureLoopSoundBus());
            entry.masterGain = master;
            return master;
        }

        function createLoopPanner(entry, spatial) {
            const panner = spatialAudioContext.createPanner();
            panner.panningModel = "equalpower";
            panner.distanceModel = "inverse";
            panner.refDistance = spatial.fullScaleDistance;
            panner.rolloffFactor = audioRolloffFactor;
            panner.maxDistance = audioMaxDistance;
            panner.coneInnerAngle = spatial.insideConeAngle;
            panner.coneOuterAngle = spatial.outsideConeAngle;
            panner.coneOuterGain = AircraftAudio.outsideConeVolumeToGain(spatial.outsideConeVolume);
            panner.connect(entry.masterGain);
            const group = { panner: panner, spatial: spatial };
            entry.groups.push(group);
            return group;
        }

        function startLoopLayer(entry, group, definition, buffer, initialGain, initialRate) {
            const source = spatialAudioContext.createBufferSource();
            source.buffer = buffer;
            source.loop = true; // The converted files contain no separate loop-point metadata
            source.playbackRate.value = initialRate;
            const gain = spatialAudioContext.createGain();
            const now = spatialAudioContext.currentTime;
            gain.gain.setValueAtTime(0.0, now);
            gain.gain.linearRampToValueAtTime(initialGain, now + 0.5);
            source.connect(gain);
            gain.connect(group.panner);
            source.start(0, Math.random() * buffer.duration);
            entry.layers.push({
                definition: definition,
                source: source,
                gain: gain,
                engineRate: initialRate
            });
        }

        function startSingleLoopSound(entry) {
            createLoopMaster(entry);
            const spatial = {
                conePitch: 0.0,
                coneHeading: 0.0,
                insideConeAngle: 360.0,
                outsideConeAngle: 360.0,
                outsideConeVolume: 10000.0,
                fullScaleDistance: audioRefDistance
            };
            const group = createLoopPanner(entry, spatial);
            getSpatialAudioBuffer(entry.name)
                .then((buffer) => {
                    if (loopSounds.get(entry.entity.id) === entry) {
                        startLoopLayer(entry, group, undefined, buffer, 1.0, 1.0);
                    }
                })
                .catch((e) => {
                    const url = "../audio/" + entry.name;
                    spatialAudioBuffers.delete(url);
                    entry.failed = true;
                    entry.retryAfter = performance.now() + loopSoundRetryMilliseconds;
                    logLoopSoundError(entry.name, `Loop sound ${entry.name} failed: ${e}`);
                });
        }

        function startEngineLoopSound(entry, time) {
            AircraftAudio.loadConfiguration(entry.name)
                .then((configuration) => Promise.all(configuration.layers.map((definition) => {
                    const url = configuration.baseURL + encodeURIComponent(definition.filename);
                    return getSpatialAudioBuffer(url)
                        .then((buffer) => ({ definition: definition, buffer: buffer }))
                        .catch((e) => {
                            spatialAudioBuffers.delete(url);
                            logLoopSoundError(url, `Engine layer ${url} failed: ${e}`);
                            return null;
                        });
                })))
                .then((loaded) => {
                    if (loopSounds.get(entry.entity.id) !== entry) {
                        return;
                    }
                    const available = loaded.filter((layer) => layer !== null);
                    if (available.length === 0) {
                        throw new Error("no engine layers could be loaded");
                    }

                    createLoopMaster(entry);
                    const groups = new Map();
                    entry.engineState = AircraftAudio.estimateEngineState(
                        (name) => loopSoundProperty(entry.entity, name, time));
                    const now = spatialAudioContext.currentTime;
                    for (const loadedLayer of available) {
                        const definition = loadedLayer.definition;
                        const key = AircraftAudio.spatialProfileKey(definition.spatial);
                        let group = groups.get(key);
                        if (group === undefined) {
                            group = createLoopPanner(entry, definition.spatial);
                            groups.set(key, group);
                        }
                        const spool = entry.engineState[definition.kind];
                        const volume = AircraftAudio.volumePercentToGain(
                            AircraftAudio.interpolateCurve(definition.vparams, spool));
                        const rate = AircraftAudio.interpolateCurve(definition.rparams, spool);
                        startLoopLayer(entry, group, definition, loadedLayer.buffer, volume, rate);
                    }
                    entry.lastEngineUpdate = performance.now();
                    entry.failed = false;
                    // Give newly-created panners their true position before their fade-in
                    updateOneLoopSoundSpatial(entry, viewer.clock.currentTime, viewer.camera);
                })
                .catch((e) => {
                    if (loopSounds.get(entry.entity.id) === entry) {
                        entry.failed = true;
                        entry.retryAfter = performance.now() + loopSoundRetryMilliseconds;
                    }
                    logLoopSoundError(entry.name, `Engine sound set ${entry.name} failed: ${e}`);
                });
        }

        function stopLoopSound(id) {
            const entry = loopSounds.get(id);
            if (entry === undefined) {
                return;
            }
            loopSounds.delete(id);
            if (spatialAudioContext === null) {
                return;
            }
            const now = spatialAudioContext.currentTime;
            for (const layer of entry.layers) {
                try {
                    layer.gain.gain.cancelScheduledValues(now);
                    layer.gain.gain.setValueAtTime(layer.gain.gain.value, now);
                    layer.gain.gain.linearRampToValueAtTime(0.0, now + 0.3);
                    layer.source.stop(now + 0.35);
                } catch (e) {
                }
            }
            setTimeout(() => {
                for (const group of entry.groups) {
                    group.panner.disconnect();
                }
                if (entry.masterGain !== null) {
                    entry.masterGain.disconnect();
                }
            }, 400);
        }

        function setLoopPannerPosition(panner, x, y, z, now) {
            if (panner.positionX !== undefined) {
                panner.positionX.setTargetAtTime(x, now, 0.06);
                panner.positionY.setTargetAtTime(y, now, 0.06);
                panner.positionZ.setTargetAtTime(z, now, 0.06);
            } else {
                panner.setPosition(x, y, z);
            }
        }

        function setLoopPannerOrientation(panner, x, y, z, now) {
            if (panner.orientationX !== undefined) {
                panner.orientationX.setTargetAtTime(x, now, 0.06);
                panner.orientationY.setTargetAtTime(y, now, 0.06);
                panner.orientationZ.setTargetAtTime(z, now, 0.06);
            } else {
                panner.setOrientation(x, y, z);
            }
        }

        function loopSoundConeDirection(entity, time, spatial, camera) {
            if ((spatial.insideConeAngle >= 360.0) && (spatial.outsideConeAngle >= 360.0)) {
                return undefined;
            }
            if (!Cesium.defined(entity.orientation)) {
                return null;
            }
            const orientation = entity.orientation.getValue(time);
            if (!Cesium.defined(orientation)) {
                return null;
            }

            // Cesium applies its glTF axis correction before entity.orientation. In
            // this entity-local frame +X is forward, +Z is up and -Y is right.
            const heading = Cesium.Math.toRadians(spatial.coneHeading);
            const pitch = Cesium.Math.toRadians(spatial.conePitch);
            const cosPitch = Math.cos(pitch);
            const localDirection = new Cesium.Cartesian3(
                Math.cos(heading) * cosPitch,
                -Math.sin(heading) * cosPitch,
                Math.sin(pitch));
            const worldDirection = Cesium.Matrix3.multiplyByVector(
                Cesium.Matrix3.fromQuaternion(orientation), localDirection, new Cesium.Cartesian3());
            return {
                x: Cesium.Cartesian3.dot(worldDirection, camera.rightWC),
                y: Cesium.Cartesian3.dot(worldDirection, camera.upWC),
                z: -Cesium.Cartesian3.dot(worldDirection, camera.directionWC)
            };
        }

        function updateOneLoopSoundSpatial(entry, time, camera) {
            const entity = entry.entity;
            const position = Cesium.defined(entity.position) ? entity.position.getValue(time) : undefined;
            if (!Cesium.defined(position)) {
                return;
            }
            const delta = Cesium.Cartesian3.subtract(position, camera.positionWC, new Cesium.Cartesian3());
            const distance = Cesium.Cartesian3.magnitude(delta);
            const wallNow = performance.now();
            if (entry.lastDistance !== undefined) {
                const dt = (wallNow - entry.lastWallTime) / 1000.0;
                if ((dt > 0.02) && (dt < 1.0)) {
                    const radialRate = (distance - entry.lastDistance) / dt; // Receding is positive
                    if (Math.abs(radialRate) < dopplerJumpLimit) {
                        const shift = Math.max(dopplerMinRate, Math.min(dopplerMaxRate,
                            dopplerSpeedOfSound / (dopplerSpeedOfSound + radialRate)));
                        entry.doppler += (shift - entry.doppler) * dopplerSmoothing;
                    } else {
                        entry.doppler = 1.0;
                    }
                }
            }
            entry.lastDistance = distance;
            entry.lastWallTime = wallNow;

            if (entry.groups.length === 0) {
                return;
            }
            const x = Cesium.Cartesian3.dot(delta, camera.rightWC);
            const y = Cesium.Cartesian3.dot(delta, camera.upWC);
            const z = -Cesium.Cartesian3.dot(delta, camera.directionWC);
            const now = spatialAudioContext.currentTime;
            for (const group of entry.groups) {
                setLoopPannerPosition(group.panner, x, y, z, now);
                const direction = loopSoundConeDirection(entity, time, group.spatial, camera);
                if (direction === null) {
                    // Until an orientation arrives, do not impose a cone in an arbitrary direction.
                    group.panner.coneInnerAngle = 360.0;
                    group.panner.coneOuterAngle = 360.0;
                    group.panner.coneOuterGain = 1.0;
                } else if (direction !== undefined) {
                    group.panner.coneInnerAngle = group.spatial.insideConeAngle;
                    group.panner.coneOuterAngle = group.spatial.outsideConeAngle;
                    group.panner.coneOuterGain = AircraftAudio.outsideConeVolumeToGain(group.spatial.outsideConeVolume);
                    setLoopPannerOrientation(group.panner, direction.x, direction.y, direction.z, now);
                }
            }
            for (const layer of entry.layers) {
                layer.source.playbackRate.setTargetAtTime(layer.engineRate * entry.doppler, now, 0.04);
            }
        }

        function updateLoopSoundSpatial() {
            if ((typeof viewer === "undefined") || (spatialAudioContext === null)) {
                return;
            }
            const time = viewer.clock.currentTime;
            const camera = viewer.camera;
            for (const entry of loopSounds.values()) {
                updateOneLoopSoundSpatial(entry, time, camera);
            }
        }

        function updateLoopSounds() {
            if ((typeof viewer === "undefined") || (typeof czmlStream === "undefined")) {
                return;
            }
            const time = viewer.clock.currentTime;
            const camera = viewer.camera;
            const candidates = [];
            for (const candidateEntity of czmlStream.entities.values) {
                if (!Cesium.defined(candidateEntity.properties) || !candidateEntity.properties.hasProperty("loopSound")) {
                    continue;
                }
                const candidateName = candidateEntity.properties["loopSound"].getValue(time);
                if ((typeof candidateName !== "string") || (candidateName.length === 0) || !candidateEntity.isAvailable(time)) {
                    continue;
                }
                const position = Cesium.defined(candidateEntity.position) ? candidateEntity.position.getValue(time) : undefined;
                if (!Cesium.defined(position)) {
                    continue;
                }
                const candidateDelta = Cesium.Cartesian3.subtract(position, camera.positionWC, new Cesium.Cartesian3());
                const distance = Cesium.Cartesian3.magnitude(candidateDelta);
                const playing = loopSounds.has(candidateEntity.id);
                if (distance > (playing ? loopSoundStopRange : loopSoundRange)) {
                    continue;
                }
                candidates.push({
                    entity: candidateEntity,
                    name: candidateName,
                    sortDistance: playing ? distance - 500.0 : distance
                });
            }
            candidates.sort((a, b) => a.sortDistance - b.sortDistance);

            const seen = new Set();
            for (let i = 0; (i < candidates.length) && (i < loopSoundMaxCount); i++) {
                const entity = candidates[i].entity;
                const name = candidates[i].name;
                let entry = loopSounds.get(entity.id);
                if ((entry !== undefined) && ((entry.name !== name)
                    || (entry.failed && (performance.now() >= entry.retryAfter)))) {
                    stopLoopSound(entity.id);
                    entry = undefined;
                }
                if (entry === undefined) {
                    ensureSpatialAudioContext();
                    entry = {
                        name: name,
                        entity: entity,
                        masterGain: null,
                        groups: [],
                        layers: [],
                        engineState: undefined,
                        lastEngineUpdate: performance.now(),
                        doppler: 1.0,
                        lastDistance: undefined,
                        lastWallTime: 0,
                        failed: false,
                        retryAfter: 0
                    };
                    loopSounds.set(entity.id, entry);
                    if (isSingleLoopSound(name)) {
                        startSingleLoopSound(entry);
                    } else {
                        startEngineLoopSound(entry, time);
                    }
                }
                seen.add(entity.id);

                if (entry.masterGain !== null) {
                    const now = spatialAudioContext.currentTime;
                    entry.masterGain.gain.setTargetAtTime(loopSoundGain * mapItemSoundVolume, now, 0.1);
                    if (entry.engineState !== undefined) {
                        const wallNow = performance.now();
                        const target = AircraftAudio.estimateEngineState(
                            (property) => loopSoundProperty(entity, property, time));
                        entry.engineState = AircraftAudio.smoothEngineState(
                            entry.engineState, target, (wallNow - entry.lastEngineUpdate) / 1000.0);
                        entry.lastEngineUpdate = wallNow;
                        for (const layer of entry.layers) {
                            if (layer.definition === undefined) {
                                continue;
                            }
                            const spool = entry.engineState[layer.definition.kind];
                            const volume = AircraftAudio.volumePercentToGain(
                                AircraftAudio.interpolateCurve(layer.definition.vparams, spool));
                            layer.engineRate = AircraftAudio.interpolateCurve(layer.definition.rparams, spool);
                            layer.gain.gain.setTargetAtTime(volume, now, 0.25);
                        }
                    }
                }
            }
            for (const id of Array.from(loopSounds.keys())) {
                if (!seen.has(id)) {
                    stopLoopSound(id);
                }
            }
        }
        setInterval(updateLoopSounds, 250);
        setInterval(updateLoopSoundSpatial, 50);

        // Models the sender asks to animate but that lack the animation, keyed by model
        // URI (so one discovery covers every aircraft using that model) + animation
        // name. The ADS-B sender cannot know which animations each model has, and it
        // re-asserts engine animations every few minutes - without this memo every
        // re-assertion logged a DeveloperError per engine per aircraft, forever.
        var missingAnimations = new Set();
        function animationMemoKey(entity, command) {
            var model = "";
            try {
                if (entity.model && entity.model.uri) {
                    model = String(entity.model.uri.getValue(viewer.clock.currentTime));
                }
            } catch (e) {
            }
            return (model || command.id) + "|" + command.animation;
        }

        // A model swap - a stand-in replaced once the aircraft's type is known - leaves
        // the old primitive in the scene until the new glTF has loaded, while the
        // entity's uri already names the new one. An animation asked for in that window
        // would be played on the old model and, when that model lacks it, memoised
        // against the new model's uri - suppressing it for every aircraft using that
        // model for the rest of the session. So the primitive being replaced is
        // remembered here, and playAnimation waits for its replacement instead.
        var staleModelPrimitives = new Map();   // Entity id to the Model primitive on its way out
        function noteModelChange(packet) {
            var entity = czmlStream.entities.getById(packet.id);
            if ((entity === undefined) || !entity.model || !entity.model.uri) {
                return;
            }
            var url = entity.model.uri.getValue(viewer.clock.currentTime);
            if (url && (typeof url !== "string")) {
                url = url.url;  // A Resource
            }
            if (url && (url != packet.model.gltf)) {
                var primitive = getModelPrimitive(viewer, entity);
                if (primitive !== undefined) {
                    staleModelPrimitives.set(packet.id, primitive);
                }
            }
        }

        function playAnimation(viewer, command, retries) {
            var entity = czmlStream.entities.getById(command.id);
            if (entity !== undefined) {
                if (missingAnimations.has(animationMemoKey(entity, command))) {
                    return;
                }
                var animations;
                var primitive = getModelPrimitive(viewer, entity);
                if ((primitive !== undefined) && (staleModelPrimitives.get(command.id) === primitive)) {
                    // Still the model being replaced - wait for the new one, via the
                    // retry below, as if no primitive existed yet
                    animations = undefined;
                } else {
                    staleModelPrimitives.delete(command.id);
                    animations = (primitive !== undefined) ? primitive.activeAnimations : undefined;
                }
                if (animations !== undefined) {
                    try {
                        // A looped animation being (re)asserted replaces the one
                        // already playing, rather than piling up on it. Only looped:
                        // one-shot sequences legitimately queue the same animation
                        // several times with staggered start times.
                        if (command.loop) {
                            for (var ai = animations.length - 1; ai >= 0; ai--) {
                                var existing = animations.get(ai);
                                if (existing.name == command.animation) {
                                    animations.remove(existing);
                                }
                            }
                        }
                        let options = {
                            name: command.animation,
                            startOffset: command.startOffset,
                            reverse: command.reverse,
                            loop: command.loop ? Cesium.ModelAnimationLoop.REPEAT : Cesium.ModelAnimationLoop.NONE,
                            // A sender that did not set a multiplier sends 0, which
                            // would freeze the animation
                            multiplier: command.multiplier ? command.multiplier : 1.0
                        };
                        options.startTime = Cesium.JulianDate.fromIso8601(command.startDateTime);
                        // https://github.com/CesiumGS/cesium/issues/10048
                        // Animations aren't moved to last frame if startTime in the past
                        // so just play now, in order to ensure gears are down, etc
                        if (Cesium.JulianDate.compare(options.startTime, viewer.clock.currentTime) < 0) {
                            options.startTime = viewer.clock.currentTime;
                        }
                        if (command.duration != 0) {
                            options.stopTime = Cesium.JulianDate.addSeconds(options.startTime, command.duration, new Cesium.JulianDate());
                        }
                        const anim = animations.add(options);
                        // Only reached when the model has the animation, so a sound is
                        // never played for an animation the aircraft does not make.
                        // Played when the animation actually starts - the start time
                        // may be in the future.
                        if ((command.sound !== undefined) && (command.sound.length > 0)) {
                            anim.start.addEventListener(function () {
                                playSpatialAudio(command.sound, entity);
                            });
                        }
                    } catch (e) {
                        // Note we get TypeError instead of DeveloperError, if running minified version of Cesium
                        if ((e instanceof Cesium.DeveloperError) || (e instanceof TypeError)) {
                            // ADS-B plugin doesn't know which animations each aircraft
                            // has, so this model simply lacks it. Remember, so it is
                            // logged once per model and never attempted again
                            const key = animationMemoKey(entity, command);
                            if (!missingAnimations.has(key)) {
                                missingAnimations.add(key);
                                console.log(`Model has no animation ${command.animation} (first seen on ${command.id}) - suppressing further attempts`);
                            }
                        } else {
                            throw e;
                        }
                    }
                } else {
                    // Give Entity time to create primitive
                    // No ready promise in entity API - https://github.com/CesiumGS/cesium/issues/4727
                    if (retries > 0) {
                        setTimeout(function () {
                            //console.log(`Retrying animation for entity ${command.id}`);
                            playAnimation(viewer, command, retries - 1);
                        }, 1000);
                    } else {
                        console.log(`Gave up trying to play animation for entity ${command.id}`);
                    }
                }
            } else {
                // It seems in some cases, entities aren't created immediately, so wait and retry
                if (retries > 0) {
                    setTimeout(function () {
                        //console.log(`Retrying entity ${command.id}`);
                        playAnimation(viewer, command, retries - 1);
                    }, 1000);
                } else {
                    console.log(`Gave up trying to find entity ${command.id}`);
                }
            }
        }

        // There's no way to stop a looped animation that doesn't have a stopTime,
        // only remove it
        // So we need to remove it, then re-add it with a new stopTime, so that it
        // plays again if the timeline is changed
        function stopAnimation(viewer, command) {
            var entity = czmlStream.entities.getById(command.id);
            if (entity !== undefined) {
                var animations = getActiveAnimations(viewer, entity);
                if (animations !== undefined) {
                    var length = animations.length;
                    var anim = undefined;
                    // Find animation with lastet startTime
                    for (var i = 0; i < length; i++) {
                        var a = animations.get(i);
                        if (a.name == command.animation) {
                            if ((anim === undefined) || (Cesium.JulianDate.compare(a.startTime, anim.startTime) >= 0)) {
                                anim = a;
                            }
                        }
                    }
                    if (anim !== undefined) {
                        animations.remove(anim);
                        // Re add with new stopTime
                        animations.add({
                            name: anim.name,
                            startOffset: anim.startOffset,
                            reverse: anim.reverse,
                            loop: anim.loop,
                            multiplier: anim.multiplier,
                            startTime: anim.startTime,
                            stopTime: Cesium.JulianDate.fromIso8601(command.startDateTime) // FIXME: Should this be stopDateTime?
                        });
                    }
                }
            }
        }

        function icrf(scene, time) {
            if (scene.mode !== Cesium.SceneMode.SCENE3D) {
                return;
            }
            var icrfToFixed = Cesium.Transforms.computeIcrfToFixedMatrix(time);
            if (Cesium.defined(icrfToFixed)) {
                var camera = viewer.camera;
                var offset = Cesium.Cartesian3.clone(camera.position);
                var transform = Cesium.Matrix4.fromRotationTranslation(icrfToFixed);
                camera.lookAtTransform(transform, offset);
            }
        }

        // Polygons (such as for airspaces) should be prioritized behind other entities
        function pickEntityPrioritized(e) {
            var picked = viewer.scene.drillPick(e.position);
            if (Cesium.defined(picked)) {
                var firstPolygon = null;
                for (let i = 0; i < picked.length; i++) {
                    // Not Cesium.defaultValue, which Cesium 1.126 removed
                    var id = Cesium.defined(picked[i].id) ? picked[i].id
                        : (Cesium.defined(picked[i].primitive) ? picked[i].primitive.id : undefined);
                    if (id instanceof Cesium.Entity) {
                        if (!Cesium.defined(id.polygon)) {
                            return id;
                        } else if (firstPolygon == null) {
                            firstPolygon = id;
                        }
                    }
                }
                return firstPolygon;
            }
        }

        function pickEntity(e) {
            viewer.selectedEntity = pickEntityPrioritized(e);
        }

        function pickAndTrack(e) {
            const entity = pickEntityPrioritized(e);
            if (Cesium.defined(entity)) {
                if (cameraMode === cameraModeFirstPerson) {
                    setFirstPersonView(entity);
                } else if (cameraMode === cameraModeFlyBy) {
                    setFlyByView(entity);
                } else {
                    if (Cesium.Property.getValueOrUndefined(entity.position, viewer.clock.currentTime)) {
                        setThirdPersonView(entity);
                    } else {
                        viewer.zoomTo(entity);
                    }
                }
            } else if (Cesium.defined(viewer.trackedEntity)) {
                //viewer.trackedEntity = undefined;
                setThirdPersonView(undefined);
            }
        }

        function showCoords(e) {
            if (viewer.terrainProvider instanceof Cesium.EllipsoidTerrainProvider) {
                var cartesian = viewer.camera.pickEllipsoid(e.position);
                var cartographic = Cesium.Cartographic.fromCartesian(cartesian);
                longitudeString = Cesium.Math.toDegrees(cartographic.longitude).toFixed(6);
                latitudeString = Cesium.Math.toDegrees(cartographic.latitude).toFixed(6);
                positionMarker.position = Cesium.Cartesian3.fromRadians(cartographic.longitude, cartographic.latitude, 1);
                positionMarker.point.show = true;
                positionMarker.label.show = true;
                positionMarker.label.text =
                    `Lon: ${`   ${longitudeString}`}\u00B0` +
                    `\nLat: ${`   ${latitudeString}`}\u00B0`;
            } else {
                // https://github.com/CesiumGS/cesium/issues/4368
                // viewer.scene.pickPosition doesn't work because we have viewer.scene.globe.depthTestAgainstTerrain = false
                const ray = viewer.camera.getPickRay(e.position);
                const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
                var cartographic = Cesium.Cartographic.fromCartesian(cartesian);
                Promise.resolve(
                    sampleSurfaceHeight([cartographic]),
                ).then((updatedPositions) => {
                    longitudeString = Cesium.Math.toDegrees(cartographic.longitude).toFixed(6);
                    latitudeString = Cesium.Math.toDegrees(cartographic.latitude).toFixed(6);
                    heightString = updatedPositions[0].height.toFixed(1);
                    positionMarker.position = Cesium.Cartesian3.fromRadians(cartographic.longitude, cartographic.latitude, 1); // Height relative to ground
                    positionMarker.point.show = true;
                    positionMarker.label.show = true;
                    positionMarker.label.text =
                        `Lon: ${`   ${longitudeString}`}\u00B0` +
                        `\nLat: ${`   ${latitudeString}`}\u00B0` +
                        `\nAlt: ${`   ${heightString}`}m`;
                }).catch(() => {
                    // Terrain sampling can fail transiently - no marker this click
                });
            }
        }

        function hideCoords() {
            positionMarker.point.show = false;
            positionMarker.label.show = false;
        }

        // Whether there's a surface heights can be sampled from. Without one, everything
        // is on the ellipsoid at height 0, and sampleTerrainMostDetailed would reject.
        function hasSurfaceHeights() {
            if (googleTileset !== undefined) {
                return viewer.scene.sampleHeightSupported;
            }
            return !(viewer.terrainProvider instanceof Cesium.EllipsoidTerrainProvider);
        }

        // Nothing on Earth is higher than Everest, so anything above this can't be underground
        // and doesn't need the surface lookup below - which is most aircraft, in the cruise
        const maxSurfaceHeight = 9000;
        const minSurfaceHeight = -500;    // The Dead Sea shore is -430 m; sea level itself ranges -106 to +85 m above the ellipsoid

        // Most of the rest aren't either: Cesium ships the highest terrain in each ~3 degree
        // cell of the world, and only buildings stand above that - none taller than this.
        // Sampling costs a render of the scene, so it is worth ruling out all it can
        const maxBuildingHeight = 1000;
        var terrainHeightsLoaded = false;
        Cesium.ApproximateTerrainHeights.initialize().then(() => {
            terrainHeightsLoaded = true;
        }).catch((e) => {
            console.log(`Approximate terrain heights unavailable: ${formatRejection(e)}`);
        });
        const terrainHeightsRectangle = new Cesium.Rectangle();

        function maxSurfaceHeightAt(cartographic) {
            if (!terrainHeightsLoaded) {
                return maxSurfaceHeight;
            }
            terrainHeightsRectangle.west = terrainHeightsRectangle.east = cartographic.longitude;
            terrainHeightsRectangle.south = terrainHeightsRectangle.north = cartographic.latitude;
            const heights = Cesium.ApproximateTerrainHeights.getMinimumMaximumHeights(terrainHeightsRectangle);
            return Math.min(maxSurfaceHeight, heights.maximumTerrainHeight + maxBuildingHeight);
        }

        // Height of the surface below a position, from what is already loaded or drawn, so it
        // costs nothing to fetch.
        // scene.getHeight is preferred, as it only considers the globe and 3D tilesets, so it
        // can't pick up one of our own items by mistake. It works for terrain, but not for
        // Google's tiles: it picks against tile content on the CPU, and their detailed content
        // returns no hits (only the coarse root tiles do, which would give a height kilometres
        // below the surface). So for those, read the depth buffer instead, which means sampling
        // whatever is drawn - hence excluding our own items, otherwise an aircraft can end up
        // clamped on to another aircraft that happens to be above it.
        // sampleHeight renders the scene and reads it back, which is far too slow to do for
        // every aircraft in a feed, so it is only used for positions that are on screen -
        // where being underground is the only time it shows. Everything else keeps the
        // altitude it was sent with, and is clipped when it next moves into view.
        // The culling volume is computed from the viewer's camera here rather than taken
        // from scene.frameState: sampleHeight renders with its own camera, a 0.01m wide
        // orthographic frustum pointing down at the sampled point, and leaves that in
        // frameState until the next frame is rendered. Tested against that, every position
        // after the first in a message is off screen, so is never clipped
        var onScreenFrame = -1;
        var onScreenOccluder;
        var onScreenCullingVolume;
        const onScreenCartesian = new Cesium.Cartesian3();
        const onScreenSphere = new Cesium.BoundingSphere(new Cesium.Cartesian3(), 1.0);

        function positionOnScreen(cartographic) {
            const scene = viewer.scene;
            const ellipsoid = scene.ellipsoid ?? Cesium.Ellipsoid.WGS84;
            const cartesian = Cesium.Cartographic.toCartesian(cartographic, ellipsoid, onScreenCartesian);
            if (onScreenFrame !== scene.frameState.frameNumber) {
                onScreenFrame = scene.frameState.frameNumber;
                const camera = viewer.camera;
                onScreenOccluder = new Cesium.EllipsoidalOccluder(ellipsoid, camera.positionWC);
                onScreenCullingVolume = camera.frustum.computeCullingVolume(camera.positionWC, camera.directionWC, camera.upWC);
            }
            if (!onScreenOccluder.isPointVisible(cartesian)) {
                return false; // Over the horizon
            }
            Cesium.Cartesian3.clone(cartesian, onScreenSphere.center);
            return onScreenCullingVolume.computeVisibility(onScreenSphere) !== Cesium.Intersect.OUTSIDE;
        }

        // The ground doesn't move, so heights are reused between updates and between aircraft,
        // on a grid ~50m across - an aircraft doesn't need finer than that to sit on a runway.
        // The tiles only refine after the camera moves, so a height is sampled again once
        // the camera has moved since it was taken and it is this old - a still camera
        // never samples twice. A sample costs ~13ms, whatever it draws: the scene is
        // rendered again and a pixel read back, which waits for the GPU to finish the
        // frame in hand. So at most one is taken per frame, and the rest of the positions
        // keep what they have until their next update - they arrive every second. A sample
        // that found nothing is retried sooner, as the tiles there are usually still on
        // their way
        const surfaceHeights = new Map();
        const surfaceHeightGrid = 0.0005;
        const surfaceHeightsMax = 50000;
        const surfaceHeightMaxAge = 20000;    // ms
        const surfaceHeightRetry = 1000;      // ms
        const surfaceSamplesPerFrame = 1;
        var surfaceSampleFrame = -1;
        var surfaceSamplesThisFrame = 0;
        var cameraMoves = 0;                  // Counts camera.changed events

        // What became of each position that could have needed clipping, for the perf line:
        // ruled out by the terrain gate, served from the cache, not sampled as it was off
        // screen, sampled (and how long that took), or sampled but nothing found there

        // sampleHeight reads back whatever is drawn, so everything of ours is hidden while
        // it samples: the data sources' primitives (labels, points, billboards), the
        // entities' models - which ModelVisualizer adds straight to scene.primitives, not
        // to the data source's collection, so they have to be found there - and the
        // tracks, which are drawn outside the data sources. Naming the entities in
        // objectsToExclude instead has Cesium render the scene again for each one the ray
        // hits on its way to the ground - and for an aircraft, its own model and label
        // are always hit first. Sampled at the aircraft's own position, an unhidden model
        // reads back as ground at its own altitude, and a radio altitude of nothing.
        // _primitives and _groundPrimitives are DataSourceDisplay's collections for all
        // its data sources
        function sampleDrawnHeight(cartographic) {
            const display = viewer.dataSourceDisplay;
            const hidden = [];
            for (const collection of [display._primitives, display._groundPrimitives, trackPolylines]) {
                if (Cesium.defined(collection) && collection.show) {
                    collection.show = false;
                    hidden.push(collection);
                }
            }
            const primitives = viewer.scene.primitives;
            for (let i = 0; i < primitives.length; i++) {
                const primitive = primitives.get(i);
                if ((primitive instanceof Cesium.Model) && (primitive.id instanceof Cesium.Entity) && primitive.show) {
                    primitive.show = false;
                    hidden.push(primitive);
                }
            }
            try {
                return viewer.scene.sampleHeight(cartographic);
            } finally {
                for (const item of hidden) {
                    item.show = true;
                }
            }
        }

        function surfaceHeightAt(cartographic, force) {
            if (googleTileset === undefined) {
                return viewer.scene.getHeight(cartographic, Cesium.HeightReference.CLAMP_TO_GROUND);
            }
            const lat = Cesium.Math.toDegrees(cartographic.latitude);
            const lon = Cesium.Math.toDegrees(cartographic.longitude);
            const key = Math.round(lat / surfaceHeightGrid) + "," + Math.round(lon / surfaceHeightGrid);
            const now = performance.now();
            let cached = surfaceHeights.get(key);
            if ((cached !== undefined) && ((now < cached.expires) || (Cesium.defined(cached.height) && (cached.moves === cameraMoves)))) {
                return cached.height;
            }
            const frame = viewer.scene.frameState.frameNumber;
            if (frame !== surfaceSampleFrame) {
                surfaceSampleFrame = frame;
                surfaceSamplesThisFrame = 0;
            }
            if (!viewer.scene.sampleHeightSupported || (!force && !positionOnScreen(cartographic))
                || (!force && (surfaceSamplesThisFrame >= surfaceSamplesPerFrame))) {
                // Can't be sampled now, so what was last sampled is still the best there is
                return cached?.height;
            }
            surfaceSamplesThisFrame++;
            let height = sampleDrawnHeight(cartographic);
            // Nothing on Earth stands above maxSurfaceHeight, so a sample that does did not
            // come from the ground: it found something else drawn there. Nor is any ground
            // below minSurfaceHeight: that is the planet-scale tiles drawn before the ones
            // for the place have arrived, seen 27 km down
            if (!Cesium.defined(height) || !isFinite(height) || (height > maxSurfaceHeight) || (height < minSurfaceHeight)) {
                height = undefined;
            }
            if (cached === undefined) {
                if (surfaceHeights.size >= surfaceHeightsMax) {
                    surfaceHeights.clear();
                }
                cached = { height: undefined, expires: 0, moves: -1 };
                surfaceHeights.set(key, cached);
            }
            cached.moves = cameraMoves;
            if (Cesium.defined(height)) {
                cached.height = height;
                cached.expires = now + surfaceHeightMaxAge;
            } else {
                cached.expires = now + surfaceHeightRetry;
            }
            return cached.height;
        }

        // One sample's height, lifted to the surface when it is below it.
        // Aircraft on the ground are sent at an altitude of 0, so this runs for every
        // position update - use what is already drawn or loaded, which is synchronous,
        // rather than sampling for the most detailed. Stays synchronous: this runs for
        // every aircraft in the feed, so it must not queue work per position update
        const clipCartographic = new Cesium.Cartographic();
        function clipSampleToGround(coords, heightIdx) {
            const height = coords[heightIdx];
            if (height > maxSurfaceHeight) {
                return;     // Above any surface, so nothing to look up
            }
            const position = Cesium.Cartographic.fromDegrees(
                coords[heightIdx - 2], coords[heightIdx - 1], 0, clipCartographic);
            if (height > maxSurfaceHeightAt(position)) {
                return;     // Above anything standing in this part of the world
            }
            const surface = surfaceHeightAt(position);
            if (Cesium.defined(surface)) {
                if (height < surface) {
                    coords[heightIdx] = surface;
                }
            } else if (!hasSurfaceHeights() && (height < 0)) {
                // Nothing to sample - the surface is the ellipsoid, at height 0
                coords[heightIdx] = 0;
            }
        }

        // A track's vertices are lifted to just above the surface where they are below it,
        // as the aircraft they belong to is by Cesium's CLIP_TO_GROUND - a track on the
        // ground is otherwise drawn beneath the terrain or tiles and never seen. The same
        // question Cesium asks for the aircraft, of what is loaded: cheap for terrain,
        // a ray pick through the tiles otherwise, so only asked below the terrain gate
        const trackGroundClearance = 1.0;   // m, or the line fights the surface for pixels
        // Heights under track vertices, on a grid ~10 m across. A segment is re-sent as
        // the smoother refines it, and every vertex was asked for again each time - a ray
        // pick through the tiles per vertex, a tenth of the frame time on a busy map -
        // though the ground under it had not changed. Kept for as long as the surface is:
        // the tiles refine a little as they load, which a line drawn a metre up forgives
        const trackGroundHeights = new Map();
        const trackGroundGrid = 0.0001;     // degrees
        const trackGroundMax = 200000;
        // ...and where nothing was loaded, when that was found: the tracks stretch
        // far beyond the tiles selected around the camera, and each re-sent segment
        // asked again for every vertex out there - a ray through every selected
        // tile's bounding sphere per vertex, thousands a second
        const trackGroundMisses = new Map();
        const trackGroundRetryMs = 10000;
        function trackGroundAt(lon, lat, position, reference) {
            const key = Math.round(lon / trackGroundGrid) + "," + Math.round(lat / trackGroundGrid);
            const cached = trackGroundHeights.get(key);
            if (cached !== undefined) {
                return cached;
            }
            const now = performance.now();
            const missed = trackGroundMisses.get(key);
            if ((missed !== undefined) && (now - missed < trackGroundRetryMs)) {
                return undefined;
            }
            const ground = viewer.scene.getHeight(position, reference);
            if (Cesium.defined(ground)) {
                if (trackGroundHeights.size >= trackGroundMax) {
                    trackGroundHeights.clear();
                }
                trackGroundHeights.set(key, ground);
                trackGroundMisses.delete(key);
            } else {
                if (trackGroundMisses.size >= trackGroundMax) {
                    trackGroundMisses.clear();
                }
                trackGroundMisses.set(key, now);
            }
            return ground;
        }
        function clipTrackToGround(coords) {
            if (!hasSurfaceHeights()) {
                return;
            }
            const reference = (googleTileset !== undefined) ? Cesium.HeightReference.CLAMP_TO_3D_TILE : Cesium.HeightReference.CLAMP_TO_GROUND;
            for (let i = 0; i + 2 < coords.length; i += 3) {
                const height = coords[i + 2];
                const position = Cesium.Cartographic.fromDegrees(coords[i], coords[i + 1], 0, clipCartographic);
                if (height > maxSurfaceHeightAt(position)) {
                    continue;
                }
                const ground = trackGroundAt(coords[i], coords[i + 1], position, reference);
                if (Cesium.defined(ground) && (height < ground + trackGroundClearance)) {
                    coords[i + 2] = ground + trackGroundClearance;
                }
            }
        }

        // A CZML position is either a constant [lon, lat, height] or time tagged samples
        // of [time, lon, lat, height] repeated. An aircraft with the PFD open sends its
        // whole smoothed window as one packet, so every sample is clipped, not just the
        // first - previously such a packet was passed through unclipped, and logged
        var loggedBadPosition = false;
        function clipPositionToGround(coords) {
            const stride = (coords.length == 3) ? 3 : 4;
            if ((coords.length % stride) != 0) {
                // Can't happen from CZML::update() - logged once, never per packet
                if (!loggedBadPosition) {
                    loggedBadPosition = true;
                    console.log(`Position of ${coords.length} values is neither a constant nor whole time tagged samples - not clipping`);
                }
                return;
            }
            for (let heightIdx = stride - 1; heightIdx < coords.length; heightIdx += stride) {
                clipSampleToGround(coords, heightIdx);
            }
        }

        // Sample the height of the surface at the given Cartographic positions.
        // Google's 3D tiles aren't terrain, so have to be sampled from the rendered scene,
        // where objectsToExclude keeps an entity from being sampled against itself.
        function sampleSurfaceHeight(positions, objectsToExclude) {
            if (googleTileset === undefined) {
                return Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, positions);
            }
            return Promise.resolve(
                viewer.scene.sampleHeightMostDetailed(positions, objectsToExclude)
            ).then((updatedPositions) => {
                for (const position of updatedPositions) {
                    if (position.height === undefined) { // Nothing was hit at this position
                        position.height = 0;
                    }
                }
                return updatedPositions;
            });
        }

        Cesium.Ion.defaultAccessToken = '$CESIUM_ION_API_KEY$';
        if ('$ARCGIS_API_KEY$' != '') {
            Cesium.ArcGisMapService.defaultAccessToken = '$ARCGIS_API_KEY$';
        }

        // Imagery in the "Cesium ion" category (Bing, Google, Azure, Sentinel-2, Blue Marble,
        // Earth at night, Natural Earth) uses Cesium Ion quota, so is only offered in the base
        // layer picker if the user has entered their own Cesium Ion API key
        let imageryViewModels = Cesium.createDefaultImageryProviderViewModels();
        if ('$HAS_CESIUM_ION_USER_KEY$' != 'true') {
            imageryViewModels = imageryViewModels.filter((vm) => vm.category != "Cesium ion");
        }

        // Names used in the settings dialog that differ from Cesium's view model names
        const imageryNameMap = {
            "ArcGIS world imagery": "ArcGIS World Imagery",
            "Ersi world ocean": "Esri World Ocean"
        };

        function findImageryViewModel(name) {
            const cesiumName = imageryNameMap[name] || name;
            return imageryViewModels.find((vm) => vm.name == cesiumName);
        }

        // Start time is set via CZML::init()
        // Terrain is not set here - setTerrain is sent as soon as the websocket connects,
        // and requesting world terrain here would use Cesium Ion quota whatever the settings say
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProviderViewModels: imageryViewModels,
            selectedImageryProviderViewModel: findImageryViewModel('$DEFAULT_IMAGERY$'),
            animation: true,
            shouldAnimate: true,
            timeline: true,
            geocoder: false,
            fullscreenButton: true,
            navigationHelpButton: false,
            navigationInstructionsInitiallyVisible: false,
            contextOptions: {
                // An image material draws the placeholder texture while its own is
                // still loading, and an opaque one flashes white
                // https://github.com/CesiumGS/cesium/issues/1640
                transparentDefaultTexture: true
            },
            terrainProviderViewModels: [] // User should adjust terrain via dialog, so depthTestAgainstTerrain doesn't get set
        });
        viewer.targetFrameRate = $TARGET_FRAME_RATE$;
        viewer.scene.globe.depthTestAgainstTerrain = false; // So labels/points aren't clipped by terrain (this prevents pickPosition from working)
        viewer.scene.globe.tileCacheSize = 5000; // FIXME: Embedded Chrome is slower at loading from cache
        viewer.scene.moon.onlySunLighting = false; // Moon can be just a black dot if default of true
        viewer.screenSpaceEventHandler.setInputAction(pickEntity, Cesium.ScreenSpaceEventType.LEFT_CLICK);
        viewer.screenSpaceEventHandler.setInputAction(pickAndTrack, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
        viewer.screenSpaceEventHandler.setInputAction(showCoords, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK, Cesium.KeyboardEventModifier.SHIFT);
        viewer.screenSpaceEventHandler.setInputAction(flyByWheel, Cesium.ScreenSpaceEventType.WHEEL);
        viewer.screenSpaceEventHandler.setInputAction(hideCoords, Cesium.ScreenSpaceEventType.RIGHT_CLICK);

        // The scene mode (2D/3D/Columbus) and imagery pickers act on the globe, which isn't
        // drawn while Google's tiles are, so they are hidden rather than left there doing nothing
        function showGlobePickers(show) {
            const display = show ? "" : "none";
            // A picker's container is the viewer's toolbar, shared with the home, geocoder
            // and help buttons - hiding that took them all. Its own elements are the
            // button (_element, or _wrapper for the scene mode picker) and, for the base layer
            // picker, the drop-down (_dropPanel)
            if (Cesium.defined(viewer.baseLayerPicker)) {
                for (const element of [viewer.baseLayerPicker._element, viewer.baseLayerPicker._dropPanel]) {
                    if (Cesium.defined(element)) {
                        element.style.display = display;
                    }
                }
            }
            if (Cesium.defined(viewer.sceneModePicker) && Cesium.defined(viewer.sceneModePicker._wrapper)) {
                viewer.sceneModePicker._wrapper.style.display = display;
            }
        }

        // Far mode. An aircraft model is one fuselage mesh plus ~30 animated parts - gear legs
        // and doors, flaps, slats, tyres, engine fans - each on its own node so it can move,
        // and each a draw call: ~31 per aircraft, which is what set the frame rate with a
        // busy sky (2,772 draw commands for 92 aircraft, 44 ms of CPU a frame). Beyond
        // farModelDistance those parts are a pixel or two of a minimumPixelSize icon, so they
        // are hidden and only the fuselage draws. Which nodes are animated is read from each
        // model's own glTF, once, so nothing here depends on the models' structure.
        var farModelDistance = 20000;           // metres from the camera
        const modelAnimatedNodes = new Map();   // model URL -> node names, or null while loading

        // Fill light for distant aircraft. A model is lit by the single scene light, and
        // its ambient comes from an environment map generated at the model's own position.
        // Looking out at traffic near the horizon the camera usually sees the side away
        // from the sun, and with the minimum pixel size holding those aircraft large they
        // read as black cut-outs with no livery. A flat ambient term lifts the unlit side.
        //
        // It is the spherical harmonic coefficients rather than the environment map's
        // atmosphereScatteringIntensity or the model's lightColor: measured against a
        // backlit model, those two changed nothing once the model was built, and this
        // moved it from 68 to 77 in mean brightness. Supplying coefficients replaces the
        // sky-tinted ambient with a neutral one, which is what shows a livery best.
        // Only the constant term is set - a uniform light from every direction
        // Set from the Map's display settings - "Distant light intensity", 0 turns it off
        var farModelAmbient = 0.5;
        var farAmbientCoefficients = farAmbientFor(farModelAmbient);

        function farAmbientFor(a) {
            return [
                new Cesium.Cartesian3(a, a, a),
                new Cesium.Cartesian3(), new Cesium.Cartesian3(), new Cesium.Cartesian3(),
                new Cesium.Cartesian3(), new Cesium.Cartesian3(), new Cesium.Cartesian3(),
                new Cesium.Cartesian3(), new Cesium.Cartesian3()
            ];
        }

        // A new strength has to reach models that already have the old one on them, so
        // their flag is cleared and the next pass reapplies it
        function setFarModelAmbient(a) {
            if (a === farModelAmbient) {
                return;
            }
            farModelAmbient = a;
            farAmbientCoefficients = farAmbientFor(a);
            const primitives = viewer.scene.primitives;
            for (let i = 0; i < primitives.length; i++) {
                const model = primitives.get(i);
                if ((model instanceof Cesium.Model) && (model.imageBasedLighting !== undefined)) {
                    if (model.farAmbient) {
                        model.imageBasedLighting.sphericalHarmonicCoefficients =
                            (a > 0) ? farAmbientCoefficients : undefined;
                    }
                    model.farAmbient = undefined;
                }
            }
            updateFarMode();
        }

        // Each model carries its own ImageBasedLighting, so this is per aircraft. Assigning
        // rebuilds the model's shaders, so it is only done when the side it is on changes
        function setFarAmbient(model, on) {
            if ((farModelAmbient <= 0) || (model.imageBasedLighting === undefined)
                || (model.farAmbient === on)) {
                return;
            }
            model.farAmbient = on;
            model.imageBasedLighting.sphericalHarmonicCoefficients =
                on ? farAmbientCoefficients : undefined;
        }

        // A model covering less than this achieves nothing by being drawn. Cesium draws a
        // model whatever its size on screen, so a sub-pixel aircraft costs nearly as much
        // as a close one - measured on a 128 aircraft feed, a frame took 25ms with them
        // and 2ms without. A model given a minimum pixel size is never this small, so
        // this only takes effect where the user asked for models that small: it never
        // takes away an aircraft that would have been seen
        const hideBelowPixels = 2;

        // Not drawn by hiding it, but by giving it a distanceDisplayCondition. Cesium
        // tests that in the same expression as the model's own show, at the point it
        // would push draw commands, so it skips exactly the same work - and unlike a
        // hidden model, one that is merely out of range still reports a bounding sphere,
        // so zooming to and tracking an aircraft too small to draw still work.
        // The distance is worked out for each model from its own size and the viewport,
        // so this stays a statement about pixels rather than a fixed range
        const tinyPixelScratch = new Cesium.Cartesian2();
        function tooSmallBeyond(model) {
            const frustum = viewer.camera.frustum;
            if (frustum.fovy === undefined) {
                return undefined;   // Orthographic: size doesn't fall away with distance
            }
            const perMetre = frustum.getPixelDimensions(
                viewer.scene.drawingBufferWidth, viewer.scene.drawingBufferHeight,
                1.0, viewer.scene.pixelRatio, tinyPixelScratch);
            const metresPerPixelAtOneMetre = Math.max(perMetre.x, perMetre.y);
            if (!(metresPerPixelAtOneMetre > 0)) {
                return undefined;
            }
            return (model.boundingSphere.radius * 2) / (hideBelowPixels * metresPerPixelAtOneMetre);
        }

        // The visualizer writes the entity's properties on to the primitive every frame,
        // so this has to be set on the entity to stick. Replaced only when it has really
        // moved, rather than allocating a property for every model every pass
        function setTinyBeyond(entity, model, distance) {
            if (distance === undefined) {
                if (model.tinyBeyond !== undefined) {
                    entity.model.distanceDisplayCondition = undefined;
                    model.tinyBeyond = undefined;
                }
                return;
            }
            if ((model.tinyBeyond === undefined) || (Math.abs(distance - model.tinyBeyond) > model.tinyBeyond * 0.05)) {
                model.tinyBeyond = distance;
                entity.model.distanceDisplayCondition =
                    new Cesium.ConstantProperty(new Cesium.DistanceDisplayCondition(0.0, distance));
            }
        }

        function animatedNodeNames(gltf) {
            const animated = new Set();
            for (const animation of gltf.animations || []) {
                for (const channel of animation.channels || []) {
                    if (channel.target && (channel.target.node !== undefined)) {
                        animated.add(channel.target.node);
                    }
                }
            }
            // A child moves with its parent
            const stack = [...animated];
            while (stack.length > 0) {
                const n = stack.pop();
                for (const child of gltf.nodes[n].children || []) {
                    if (!animated.has(child)) {
                        animated.add(child);
                        stack.push(child);
                    }
                }
            }
            const names = [];
            for (const n of animated) {
                const node = gltf.nodes[n];
                if ((node.mesh !== undefined) && node.name) {
                    names.push(node.name);
                }
            }
            return names;
        }

        function loadAnimatedNodes(url) {
            modelAnimatedNodes.set(url, null);
            fetch(url).then((response) => response.arrayBuffer()).then((buffer) => {
                const bytes = new Uint8Array(buffer);
                let json;
                if ((bytes[0] == 0x67) && (bytes[1] == 0x6C) && (bytes[2] == 0x54) && (bytes[3] == 0x46)) {
                    // Binary glTF: the JSON chunk follows the 12 byte header and 8 byte chunk header
                    const length = new DataView(buffer).getUint32(12, true);
                    json = JSON.parse(new TextDecoder().decode(bytes.subarray(20, 20 + length)));
                } else {
                    json = JSON.parse(new TextDecoder().decode(bytes));
                }
                modelAnimatedNodes.set(url, animatedNodeNames(json));
            }).catch((e) => {
                console.log("Far mode: can't read " + url + ": " + e);
                modelAnimatedNodes.set(url, []);
            });
        }

        function updateFarMode() {
            const cameraPosition = viewer.camera.positionWC;
            const time = viewer.clock.currentTime;
            const primitives = viewer.scene.primitives;
            for (let i = 0; i < primitives.length; i++) {
                const model = primitives.get(i);
                if (!(model instanceof Cesium.Model) || !model.ready || !(model.id instanceof Cesium.Entity)) {
                    continue;
                }
                const entity = model.id;
                if (!entity.model || !entity.model.uri) {
                    continue;
                }
                // Beyond this it covers less than a couple of pixels and is not drawn
                const tinyBeyond = (model.minimumPixelSize < hideBelowPixels) ? tooSmallBeyond(model) : undefined;
                setTinyBeyond(entity, model, tinyBeyond);
                const distance = Cesium.Cartesian3.distance(cameraPosition, model.boundingSphere.center);
                // Before the checks below, which skip models with nothing animated to hide
                setFarAmbient(model, distance > farModelDistance);
                let url = entity.model.uri.getValue(time);
                if (url && (typeof url !== "string")) {
                    url = url.url;  // A Resource
                }
                if (!url) {
                    continue;
                }
                const nodes = modelAnimatedNodes.get(url);
                if (nodes === undefined) {
                    loadAnimatedNodes(url);
                    continue;
                }
                if ((nodes === null) || (nodes.length == 0)) {
                    continue;   // Still loading, or nothing animated to hide
                }
                const isFar = distance > farModelDistance;
                if (model.farMode === isFar) {
                    continue;
                }
                model.farMode = isFar;
                for (const name of nodes) {
                    const node = model.getNode(name);
                    if (node) {
                        node.show = !isFar;
                    }
                }
            }
        }
        setInterval(updateFarMode, 1000);          // Aircraft move
        viewer.camera.moveEnd.addEventListener(updateFarMode);

        // How much of Google's tileset is held in memory, and for how long. Both cost
        // requests to keep low and memory to keep high, and memory is what shows: the
        // tiles are only half of it, because a tile that is loaded, or was drawn
        // recently, keeps the whole branch of the tile tree it sits in, and every
        // garbage collection walks that tree. Flying low along a track discovers ground
        // quickly, and with Cesium's defaults for Google (1.5 GB, and no release at all
        // before the fix in our Cesium) the tree passed 460,000 tiles and 2 GB, where
        // collections took a third of a second and showed as a stutter every few
        // seconds.
        //
        // Measured on a low fly-by, with the tree release in place:
        //
        //   cache   idle    tiles held      frame rate   requests
        //   1536 MB  600    60k - 234k      21 - 59 fps    -
        //    512 MB  600    60k - 234k      21 - 59 fps  20.5/s
        //    512 MB  120    60k - 107k      48 - 59 fps  30.5/s
        //
        // So the idle is what bounds the tree during flight, and it is paid for in
        // requests against the Google quota - about half as many again.
        //
        // The screen space error is how much of a tile's own error, in pixels, is
        // tolerated before it is refined, so it decides how much has to be fetched and
        // drawn. Cesium's default of 16 loads about twice what 24 does, and on the same
        // flight that showed as:
        //
        //   error   tiles loaded   lost to collection   frame rate
        //     16        68/s          876 ms per 10s     24 - 49 fps
        //     24        32/s          388 ms per 10s     50 - 59 fps
        //
        // Side by side from a fixed viewpoint the two are hard to tell apart - the
        // foreground is identical and only the horizon softens - so the detail is worth
        // less here than the frame rate
        const googleTilesetOptions = {
            cacheBytes: 512 * 1024 * 1024,
            maximumCacheOverflowBytes: 256 * 1024 * 1024,
            externalTilesetIdleFrames: 120,
            maximumScreenSpaceError: 24
        };

        // See surfaceHeightAt(). Raised once per frame the camera moved appreciably
        viewer.camera.changed.addEventListener(function () {
            cameraMoves++;
        });

        viewer.useBrowserRecommendedResolution = false; // Improves label quality when false, as drawn at higher res

        viewer.infoBox.frame.setAttribute('sandbox', 'allow-same-origin allow-popups allow-forms allow-scripts allow-top-navigation');
        viewer.infoBox.frame.src = "about:blank"; // Force reload so new attributes are applied

        viewer.infoBox.viewModel.cameraClicked.removeEventListener(Cesium.Viewer.prototype._onInfoBoxCameraClicked, viewer); // Override info box camera button being clicked
        viewer.infoBox.viewModel.cameraClicked.addEventListener(infoBoxCameraClicked, viewer);

        // The PFD is redrawn once per displayed frame rather than on a timer. The old
        // 100 Hz interval drew frames that were never shown - the application renders at
        // 60 - and its period beating against the refresh made the tapes move unevenly.
        // requestAnimationFrame also stops the redraw altogether while the map is not
        // being composited. The radio altitude keeps its own timer: it samples terrain
        // rather than drawing, and is wanted at a steady rate
        var pfdRunning = false;
        var pfdFrame = undefined;
        var pfdRadioAltTimer = undefined;

        function pfdLoop() {
            if (!pfdRunning) {
                return;
            }
