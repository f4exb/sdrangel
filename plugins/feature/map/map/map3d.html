        // (3.1 -> 4.9/s), but that burn didn't reproduce the late rAF wakes either.
        const pacedChannel = new MessageChannel();
        var pacedWait = 0;

        pacedChannel.port1.onmessage = function () {
            if (pacedWait > 0) {
                setTimeout(pacedRenderLoop, pacedWait);
            } else {
                pacedRenderLoop();
            }
        };
        // ---- end frame pacing ----

        // ---- shader program retention ----
        // Cesium releases a model's shader program when the last model using it is
        // destroyed, and destroys released programs at the end of that frame. Aircraft turn
        // over all the time - 15 arriving and 20 leaving in a measured 45 s - so the same
        // small set of programs is compiled over and over: 4,049 programs created in one
        // session against about 150 ever cached, at 1.4 builds a second, and every single
        // build landed within 500 ms of a model being added.
        //
        // Compiling one is not cheap and it happens on a frame that is on screen. Frames
        // that built a program measured 19.4 ms against a median of 8.7, and frames that
        // gained a model 29.5 ms with 37% of them over 33 ms - which is where the worst
        // frames in the frame time graph come from.
        //
        // The set actually needed is small: four attribute combinations, six derived
        // variants each. So instead of destroying a program the moment nothing is using it,
        // released programs are held back for a while in case that aircraft type returns,
        // which it nearly always does. Retention is bounded by age AND by count, so a long
        // session cannot grow without limit; over the cap the oldest go first. Eviction
        // stages them back into Cesium's own release list and calls its own routine, rather
        // than reimplementing the teardown - derived programs have to go with their parent,
        // and only Cesium knows how to do that.
        const shaderRetentionMilliseconds = 300000;    // 5 minutes
        const shaderRetentionMax = 256;                // well above the ~150 ever seen in use

        function pinShaderPrograms(scene) {
            const cache = (scene && scene.context) ? scene.context.shaderCache : undefined;

            if ((cache === undefined) || cache.pinnedByMap
                || (typeof cache.destroyReleasedShaderPrograms !== "function")) {
                return false;
            }
            cache.pinnedByMap = true;
            const destroyReleased = cache.destroyReleasedShaderPrograms;
            const held = new Map();                    // keyword -> { cached, since }

            // Exposed so the state is visible from the console without instrumenting it
            cache.heldShaderPrograms = held;
            cache.shaderProgramsEvicted = 0;

            cache.destroyReleasedShaderPrograms = function () {
                const now = performance.now();
                const pending = this._shadersToRelease;

                for (const keyword in pending) {
                    if (!Object.prototype.hasOwnProperty.call(pending, keyword)) {
                        continue;
                    }
                    const cached = pending[keyword];

                    // Taken up again before this ran, so it was never really released
                    if (!cached || (cached.count > 0)) {
                        held.delete(keyword);
                        continue;
                    }
                    if (!held.has(keyword)) {
                        held.set(keyword, { cached: cached, since: now });
                    }
                }
                this._shadersToRelease = {};

                const expired = [];
                for (const entry of held) {
                    const keyword = entry[0];
                    const record = entry[1];

                    if (record.cached.count > 0) {
                        held.delete(keyword);          // back in use, so not a candidate
                    } else if ((now - record.since) > shaderRetentionMilliseconds) {
                        expired.push(keyword);
                    }
                }
                if ((held.size - expired.length) > shaderRetentionMax) {
                    const byAge = Array.from(held.entries())
                        .sort((a, b) => a[1].since - b[1].since);

                    for (let i = 0; i < byAge.length; i++) {
                        if ((held.size - expired.length) <= shaderRetentionMax) {
                            break;
                        }
                        if (expired.indexOf(byAge[i][0]) < 0) {
                            expired.push(byAge[i][0]);
                        }
                    }
                }
                if (expired.length === 0) {
                    return;
                }
                const staged = {};
                for (const keyword of expired) {
                    const record = held.get(keyword);

                    if (record !== undefined) {
                        staged[keyword] = record.cached;
                        held.delete(keyword);
                    }
                }
                cache.shaderProgramsEvicted += expired.length;
                this._shadersToRelease = staged;
                destroyReleased.call(this);
            };

        }
        // ---- end shader program retention ----

        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProviderViewModels: imageryViewModels,
            selectedImageryProviderViewModel: findImageryViewModel('$DEFAULT_IMAGERY$'),
            animation: true,
            shouldAnimate: true,
            timeline: true,
            geocoder: false,
            fullscreenButton: true,
            navigationHelpButton: false,
            navigationInstructionsInitiallyVisible: false,
            contextOptions: {
                // An image material draws the placeholder texture while its own is
                // still loading, and an opaque one flashes white
                // https://github.com/CesiumGS/cesium/issues/1640
                transparentDefaultTexture: true
            },
            terrainProviderViewModels: [], // User should adjust terrain via dialog, so depthTestAgainstTerrain doesn't get set
            // Cesium otherwise takes its clock from whichever data source was added last,
            // and puts it back to the one before when that is removed - writing that
            // source's currentTime straight into the viewer's clock. The CZML document
            // packet carries the time SDRangel started, so adding and removing any data
            // source - which the MUF and foF2 layers do on every GIRO refresh, every 15
            // minutes - threw the clock back to the start of the session. Hours behind,
            // every aircraft's samples were in its future, so nothing could be positioned
            // and the map quietly emptied. Reproduced by adding and removing a bare
            // CustomDataSource: the clock jumped back 9 hours in one step. This map sets
            // its own time from the aircraft it is shown, so no data source should
            automaticallyTrackDataSourceClocks: false
        });
        setPacedFrameRate($TARGET_FRAME_RATE$);
        // Cesium stops the clock while a data source is still loading: every frame it sets
        // clock.canAnimate from dataSourceDisplay.update(), and a tick that cannot animate
        // still moves the clock's _lastSystemTime on, so the time spent waiting is thrown
        // away rather than caught up. update() is false while any visualizer is not ready,
        // so one aircraft whose model never loads stops time for the whole map. Found with
        // the clock nine hours behind after a night's run - every aircraft's samples were
        // then in its future, so nothing could be positioned and the map drew no traffic at
        // all. That behaviour is meant for playing a recording back smoothly; here the
        // aircraft are live and a stale sky is far worse than a model that pops in late
        viewer.allowDataSourcesToSuspendAnimation = false;

        // START the clock a few seconds behind the wall clock. Cesium interpolates between
        // the position samples it holds, but only while the clock is BETWEEN two of them;
        // level with the wall clock it is past the newest sample everything has, so each
        // moving item is drawn at an extrapolated guess that its next report contradicts,
        // and it jumps when the report arrives. A few seconds behind, anything reporting
        // more often than that has a sample either side and the path drawn is the one
        // actually travelled.
        //
        // Sized for what reports fastest - aircraft, at about once a second. It is not an
        // attempt to cover everything the map draws: AIS ships can be minutes apart and
        // satellites are computed rather than reported, so those are extrapolated whatever
        // this is set to, and lagging the clock far enough to hold them between samples
        // would be worse than the jump it avoided. Items with no time to them at all -
        // airports, beacons, airspaces - do not care either way.
        //
        // This is an initial value and nothing more: the clock is the user's, to drag along
        // the timeline or set through the setDateTime action, so no lag is maintained or
        // restored afterwards. It only has to be right when there is nobody to have chosen
        // otherwise.
        //
        // czml.cpp's document packet asks for this too, and has since ff3b3f4ef, but nothing
        // applies it any more: the viewer is constructed with automaticallyTrackDataSourceClocks
        // false - see the comment on it above - and that is precisely the option that would
        // adopt a data source's clock, so the packet's currentTime is discarded
        const startingClockLagSeconds = 4;      // a little over the fastest reporting interval
        viewer.clock.currentTime = Cesium.JulianDate.addSeconds(
            Cesium.JulianDate.now(), -startingClockLagSeconds, new Cesium.JulianDate());

        pinShaderPrograms(viewer.scene);
        viewer.scene.globe.depthTestAgainstTerrain = true; // false So labels/points aren't clipped by terrain (this prevents pickPosition from working)
        viewer.scene.globe.tileCacheSize = 500; // FIXME: Embedded Chrome is slower at loading from cache
        viewer.scene.moon.onlySunLighting = false; // Moon can be just a black dot if default of true
        viewer.screenSpaceEventHandler.setInputAction(pickEntity, Cesium.ScreenSpaceEventType.LEFT_CLICK);
        viewer.screenSpaceEventHandler.setInputAction(pickAndTrack, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
        viewer.screenSpaceEventHandler.setInputAction(showCoords, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK, Cesium.KeyboardEventModifier.SHIFT);
        viewer.screenSpaceEventHandler.setInputAction(flyByWheel, Cesium.ScreenSpaceEventType.WHEEL);
        viewer.screenSpaceEventHandler.setInputAction(hideCoords, Cesium.ScreenSpaceEventType.RIGHT_CLICK);

        // drawn while Google's tiles are, so they are hidden rather than left there doing nothing
        function showGlobePickers(show) {
            const display = show ? "" : "none";
            // A picker's container is the viewer's toolbar, shared with the home, geocoder
            // and help buttons - hiding that took them all. Its own elements are the
            // button (_element, or _wrapper for the scene mode picker) and, for the base layer
            // picker, the drop-down (_dropPanel)
            if (Cesium.defined(viewer.baseLayerPicker)) {
                for (const element of [viewer.baseLayerPicker._element, viewer.baseLayerPicker._dropPanel]) {
                    if (Cesium.defined(element)) {
                        element.style.display = display;
                    }
                }
            }
            if (Cesium.defined(viewer.sceneModePicker) && Cesium.defined(viewer.sceneModePicker._wrapper)) {
                viewer.sceneModePicker._wrapper.style.display = display;
            }
        }

        // Far mode. An aircraft model is one fuselage mesh plus ~30 animated parts - gear legs
        // and doors, flaps, slats, tyres, engine fans - each on its own node so it can move,
        // and each a draw call: ~31 per aircraft, which is what set the frame rate with a
        // busy sky (2,772 draw commands for 92 aircraft, 44 ms of CPU a frame). Beyond
        // farModelDistance those parts are a pixel or two of a minimumPixelSize icon, so they
        // are hidden and only the fuselage draws. Which nodes are animated is read from each
        // model's own glTF, once, so nothing here depends on the models' structure.
        var farModelDistance = 20000;           // metres from the camera
        const modelAnimatedNodes = new Map();   // model URL -> node names, or null while loading

        // Fill light for distant aircraft. A model is lit by the single scene light, and
        // its ambient comes from an environment map generated at the model's own position.
        // Looking out at traffic near the horizon the camera usually sees the side away
        // from the sun, and with the minimum pixel size holding those aircraft large they
        // read as black cut-outs with no livery. A flat ambient term lifts the unlit side.
        //
        // It is the spherical harmonic coefficients rather than the environment map's
        // atmosphereScatteringIntensity or the model's lightColor: measured against a
        // backlit model, those two changed nothing once the model was built, and this
        // moved it from 68 to 77 in mean brightness. Supplying coefficients replaces the
        // sky-tinted ambient with a neutral one, which is what shows a livery best.
        // Only the constant term is set - a uniform light from every direction
        // Set from the Map's display settings - "Distant light intensity", 0 turns it off
        var farModelAmbient = 0.5;
        var farAmbientCoefficients = farAmbientFor(farModelAmbient);

        function farAmbientFor(a) {
            return [
                new Cesium.Cartesian3(a, a, a),
                new Cesium.Cartesian3(), new Cesium.Cartesian3(), new Cesium.Cartesian3(),
                new Cesium.Cartesian3(), new Cesium.Cartesian3(), new Cesium.Cartesian3(),
                new Cesium.Cartesian3(), new Cesium.Cartesian3()
            ];
        }

        // A new strength has to reach models that already have the old one on them, so
        // their flag is cleared and the next pass reapplies it
        function setFarModelAmbient(a) {
            if (a === farModelAmbient) {
                return;
            }
            farModelAmbient = a;
            farAmbientCoefficients = farAmbientFor(a);
            // Take the old strength off everything that has it, then let the scan put
            // the new one on - which for a strength of zero means leaving it off
            const primitives = viewer.scene.primitives;
            for (let i = 0; i < primitives.length; i++) {
                const model = primitives.get(i);
                if ((model instanceof Cesium.Model) && (model.imageBasedLighting !== undefined)
                    && (model.farAmbient !== undefined)) {
                    model.imageBasedLighting.sphericalHarmonicCoefficients = undefined;
                    model.farAmbient = false;
                }
            }
            updateFarMode();
        }

        // Moving the camera to an aircraft takes it from far to near in a single step,
        // while the scan that takes the fill light back off runs on the camera settling -
        // so for a moment it is drawn close and still lit. Taking it off when the move is
        // asked for, rather than after it, also gives the model's shaders time to rebuild
        // while the aircraft is still in the distance
        function clearFarAmbient(entity) {
            if (!Cesium.defined(entity)) {
                return;
            }
            const primitives = viewer.scene.primitives;
            for (let i = 0; i < primitives.length; i++) {
                const model = primitives.get(i);
                if ((model instanceof Cesium.Model) && (model.id === entity)) {
                    setFarAmbient(model, false);
                    return;
                }
            }
        }

        // Each model carries its own ImageBasedLighting, so this is per aircraft. Assigning
        // rebuilds the model's shaders, so it is only done when the side it is on changes
        function setFarAmbient(model, on) {
            if (model.imageBasedLighting === undefined) {
                return;
            }
            // A strength of zero is the same as being near: no coefficients. Folded in
            // here rather than returning early, or turning the setting down to zero
            // would leave the light on whatever was already carrying it
            const wanted = on && (farModelAmbient > 0);
            if (model.farAmbient === wanted) {
                return;
            }
            model.farAmbient = wanted;
            model.imageBasedLighting.sphericalHarmonicCoefficients =
                wanted ? farAmbientCoefficients : undefined;
        }

        // An aircraft's model builds its draw commands a few frames after it is added,
        // once it has loaded, and the fill light changes its shaders. Left to the far mode
        // scan or a level of detail swap, which reach a model only once it is ready, the
        // light went on after that first build and every shader the model has was built a
        // second time - one of the four builds measured per arriving aircraft. So the
        // light goes on as the model is added, judged from the entity's position, as its
        // bounding sphere is not known yet. The scan corrects it later if that differs
        const addedModelPositionScratch = new Cesium.Cartesian3();
        viewer.scene.primitives.primitiveAdded.addEventListener(function (primitive) {
            if (!(primitive instanceof Cesium.Model) || !(primitive.id instanceof Cesium.Entity)) {
                return;
            }
            const entity = primitive.id;
            const position = Cesium.defined(entity.position)
                ? entity.position.getValue(viewer.clock.currentTime, addedModelPositionScratch) : undefined;
            if (!Cesium.defined(position)) {
                return;
            }
            const isFar = (Cesium.Cartesian3.distance(viewer.camera.positionWC, position) > farModelDistance)
                && !isFocused(entity);
            setFarAmbient(primitive, isFar);
        });

        // A model covering less than this achieves nothing by being drawn. Cesium draws a
        // model whatever its size on screen, so a sub-pixel aircraft costs nearly as much
        // as a close one - measured on a 128 aircraft feed, a frame took 25ms with them
        // and 2ms without. A model given a minimum pixel size is never this small, so
        // this only takes effect where the user asked for models that small: it never
        // takes away an aircraft that would have been seen
        const hideBelowPixels = 2;

        // Not drawn by hiding it, but by giving it a distanceDisplayCondition. Cesium
        // tests that in the same expression as the model's own show, at the point it
        // would push draw commands, so it skips exactly the same work - and unlike a
        // hidden model, one that is merely out of range still reports a bounding sphere,
        // so zooming to and tracking an aircraft too small to draw still work.
        // The distance is worked out for each model from its own size and the viewport,
        // so this stays a statement about pixels rather than a fixed range
        const tinyPixelScratch = new Cesium.Cartesian2();
        function tooSmallBeyond(model) {
            const frustum = viewer.camera.frustum;
            if (frustum.fovy === undefined) {
                return undefined;   // Orthographic: size doesn't fall away with distance
            }
            const perMetre = frustum.getPixelDimensions(
                viewer.scene.drawingBufferWidth, viewer.scene.drawingBufferHeight,
                1.0, viewer.scene.pixelRatio, tinyPixelScratch);
            const metresPerPixelAtOneMetre = Math.max(perMetre.x, perMetre.y);
            if (!(metresPerPixelAtOneMetre > 0)) {
                return undefined;
            }
            return (model.boundingSphere.radius * 2) / (hideBelowPixels * metresPerPixelAtOneMetre);
        }

        // The visualizer writes the entity's properties on to the primitive every frame,
        // so this has to be set on the entity to stick. Replaced only when it has really
        // moved, rather than allocating a property for every model every pass
        function setTinyBeyond(entity, model, distance) {
            if (distance === undefined) {
                if (model.tinyBeyond !== undefined) {
                    entity.model.distanceDisplayCondition = undefined;
                    model.tinyBeyond = undefined;
                }
                return;
            }
            if ((model.tinyBeyond === undefined) || (Math.abs(distance - model.tinyBeyond) > model.tinyBeyond * 0.05)) {
                model.tinyBeyond = distance;
                entity.model.distanceDisplayCondition =
                    new Cesium.ConstantProperty(new Cesium.DistanceDisplayCondition(0.0, distance));
            }
        }

        function animatedNodeNames(gltf) {
            // A level of detail whose animations the converter dropped carries the names
            // they drove in its extras instead. Far mode hides exactly those nodes, and
            // with no animations left there is nothing here to work them out from
            if ((gltf.animations === undefined) || (gltf.animations.length === 0)) {
                const kept = gltf.extras && gltf.extras.SDRANGEL_animatedNodes;
                return Array.isArray(kept) ? kept.slice() : [];
            }
            const animated = new Set();
            for (const animation of gltf.animations || []) {
                for (const channel of animation.channels || []) {
                    if (channel.target && (channel.target.node !== undefined)) {
                        animated.add(channel.target.node);
                    }
                }
            }
            // A child moves with its parent
            const stack = [...animated];
            while (stack.length > 0) {
                const n = stack.pop();
                for (const child of gltf.nodes[n].children || []) {
                    if (!animated.has(child)) {
                        animated.add(child);
                        stack.push(child);
                    }
                }
            }
            const names = [];
            for (const n of animated) {
                const node = gltf.nodes[n];
                if ((node.mesh !== undefined) && node.name) {
                    names.push(node.name);
                }
            }
            return names;
        }

        function loadAnimatedNodes(url) {
            modelAnimatedNodes.set(url, null);
            fetch(url).then((response) => response.arrayBuffer()).then((buffer) => {
                const bytes = new Uint8Array(buffer);
                let json;
                if ((bytes[0] == 0x67) && (bytes[1] == 0x6C) && (bytes[2] == 0x54) && (bytes[3] == 0x46)) {
                    // Binary glTF: the JSON chunk follows the 12 byte header and 8 byte chunk header
                    const length = new DataView(buffer).getUint32(12, true);
                    json = JSON.parse(new TextDecoder().decode(bytes.subarray(20, 20 + length)));
                } else {
                    json = JSON.parse(new TextDecoder().decode(bytes));
                }
                modelAnimatedNodes.set(url, animatedNodeNames(json));
            }).catch((e) => {
                console.log("Far mode: can't read " + url + ": " + e);
                modelAnimatedNodes.set(url, []);
            });
        }

        // One being followed or flown in is close, and is what is being looked at -
        // whatever the camera's distance currently says.
        //
        // The distance must not be trusted at the moment focus changes. Setting
        // viewer.trackedEntity fires trackedEntityChanged, whose handler calls
        // updateFarMode() to put the followed aircraft into full detail - but it runs
        // before the camera has moved, so the scan reads the old distance and does the
        // opposite, putting the very aircraft being focused into far mode and undoing the
        // clearFarAmbient() that setThirdPersonView() had just done. Measured: cleared at
        // 1 ms, set again at 2 ms with the camera still 292 km away, and not corrected
        // until 333 ms - the aircraft drawn at 83 m for eleven frames with the distant
        // fill light still on it. Tracking a moving aircraft keeps camera.moveEnd from
        // firing, so the wait can be the whole 1 s scan interval.
        function isFocused(entity) {
            return (entity === viewer.trackedEntity) || (entity === firstPersonEntity)
                || (entity === flyByEntity)
                || ((lodPendingFocus !== undefined) && (lodPendingFocus.entity === entity));
        }

        function updateFarMode() {
            const cameraPosition = viewer.camera.positionWC;
            const time = viewer.clock.currentTime;
            const primitives = viewer.scene.primitives;
            for (let i = 0; i < primitives.length; i++) {
                const model = primitives.get(i);
                if (!(model instanceof Cesium.Model) || !model.ready || !(model.id instanceof Cesium.Entity)) {
                    continue;
                }
                const entity = model.id;
                if (!entity.model || !entity.model.uri) {
                    continue;
                }
                // Beyond this it covers less than a couple of pixels and is not drawn
                const tinyBeyond = (model.minimumPixelSize < hideBelowPixels) ? tooSmallBeyond(model) : undefined;
                setTinyBeyond(entity, model, tinyBeyond);
                const distance = Cesium.Cartesian3.distance(cameraPosition, model.boundingSphere.center);
                const isFar = (distance > farModelDistance) && !isFocused(entity);
                let url = entity.model.uri.getValue(time);
                if (url && (typeof url !== "string")) {
                    url = url.url;  // A Resource
                }
                if (!url) {
                    setFarAmbient(model, isFar);
                    continue;
                }
                applyFarMode(model, url, isFar);
                const lod = lodEntities.get(entity.id);
                if (lod !== undefined) {
                    chooseLod(lod, entity, model);
                }
            }
            pumpLodSwaps();
        }

        function applyFarMode(model, url, isFar) {
            // Before the checks below, which skip models with nothing animated to hide
            setFarAmbient(model, isFar);
            const nodes = modelAnimatedNodes.get(url);
            if (nodes === undefined) {
                loadAnimatedNodes(url);
                return;
            }
            if ((nodes === null) || (nodes.length == 0)) {
                return;     // Still loading, or nothing animated to hide
            }
            if (model.farMode === isFar) {
                return;
            }
            model.farMode = isFar;
            for (const name of nodes) {
                const node = model.getNode(name);
                if (node) {
                    node.show = !isFar;
                }
            }
        }
        setInterval(updateFarMode, 1000);          // Aircraft move
        viewer.camera.moveEnd.addEventListener(updateFarMode);

        // A label is drawn as a screen-space quad at its anchor's depth, so Cesium's
        // per-fragment depth test cuts the globe or the terrain through the middle of the
        // text wherever the surface crosses that quad - the closer to edge-on, the more of
        // the label goes. Cesium's own whole-label test, VS_THREE_POINT_DEPTH_CHECK, is
        // what we want instead, but it only applies within threePointDepthTestDistance
        // and samples the globe depth texture, which reads empty at map viewing distances:
        // raising that distance hides nothing (measured). So the depth test is turned off
        // for labels altogether, and whether a label is drawn is decided here, once per
        // label, from whether its own position is over the horizon.
        // translucencyByDistance is the channel used to hide one, because nothing else
        // sets it - show belongs to the CZML, which would overwrite anything put there
        const labelHidden = new Cesium.NearFarScalar(1.0, 0.0, 2.0, 0.0);   // alpha 0 at every distance
        // Kept between calls, which visit every labelled entity: the occluder is moved to
        // the camera rather than made afresh, and positions are read into one scratch
        let labelOccluder;
        const labelPositionScratch = new Cesium.Cartesian3();
        function updateLabelVisibility() {
            const scene = viewer.scene;
            const ellipsoid = scene.ellipsoid ?? Cesium.Ellipsoid.WGS84;
            if ((labelOccluder === undefined) || (labelOccluder.ellipsoid !== ellipsoid)) {
                labelOccluder = new Cesium.EllipsoidalOccluder(ellipsoid);
            }
            const occluder = labelOccluder;
            occluder.cameraPosition = viewer.camera.positionWC;    // Copied, not held
            const time = viewer.clock.currentTime;
            const dataSources = viewer.dataSources;
            for (let i = 0; i < dataSources.length; i++) {
                const entities = dataSources.get(i).entities.values;
                for (let j = 0; j < entities.length; j++) {
                    const entity = entities[j];
                    const label = entity.label;
                    if (label === undefined) {
                        continue;
                    }
                    if (label.disableDepthTestDistance === undefined) {
                        label.disableDepthTestDistance = Number.POSITIVE_INFINITY;
                    }
                    const position = (entity.position !== undefined) ? entity.position.getValue(time, labelPositionScratch) : undefined;
                    const visible = (position !== undefined) && occluder.isPointVisible(position);
                    // Only written when it changes: every write makes a ConstantProperty
                    if (visible === (label.translucencyByDistance !== undefined)) {
                        label.translucencyByDistance = visible ? undefined : labelHidden;
                    }
                }
            }
        }
        setInterval(updateLabelVisibility, 1000);
        viewer.camera.moveEnd.addEventListener(updateLabelVisibility);
        viewer.camera.changed.addEventListener(updateLabelVisibility);

        // Level of detail. The MSFS models come with a second, much cheaper model of the
        // same aircraft and livery - for the A320neo 22 primitives against 74 - and with 200
        // aircraft in view that took a frame from 18 ms to 6 ms. The cost is each model's
        // update rather than its draw calls, and a loaded model costs most of it even when
        // hidden, so an aircraft has one model at a time and changes between the two by
        // changing its uri. It changes at the size the models' own definitions do: MSFS
        // draws the full A320 only while it covers 8% of the screen height. It comes back
        // at 11%, so an aircraft sitting on the line doesn't swap back and forth.
        //
        // Changing an entity's uri on its own looks bad: Cesium destroys the old model at
        // once, so the aircraft vanishes for 6-12 frames and is then drawn untextured for
        // a third of a second, as the textures the two models share were freed with the
        // old one. So the model being changed to is first loaded as a hidden model of our
        // own, the holder, which leaves everything the entity's new model needs in Cesium's
        // cache; and the holder is shown in the aircraft's place, in its pose, for the 3-4
        // frames the entity's new model still takes to appear.
        // MSFS's own definitions switch the full model off at 8% of the screen height and
        // back on at 11%, and those were used here directly. That band turns out to be too
        // narrow for a sky of traffic: an aircraft hovering around it swaps repeatedly, and
        // every swap is a whole model load - unpacking its accessors and deriving its
        // shaders came to a third of all allocation in a heap profile. With ~160 aircraft
        // that churn ran to about 1.3 GB of garbage between collections, which on a 1.34 GB
        // live set meant a ~800 ms pause several times a minute. So the upper edge is
        // raised: the point at which detail is dropped is unchanged, an aircraft simply has
        // to be clearly large before the full model is brought back
        const lowDetailBelow = 0.08;            // Fraction of the screen height
        const fullDetailAbove = 0.16;
        // Zooming out swaps a sky full at once. Measured with 200: 4 at a time took 10 s at
        // 30 fps, 16 took 6 s at 13 fps
        const maxConcurrentLodSwaps = 8;
        const lodHolderTimeoutMs = 15000;
        // Entity id -> {full, low, showingLow, wantLow, swapping}. Only for entities whose
        // model has a low detail version
        const lodEntities = new Map();
        const lodFailedUrls = new Set();        // Models that would not load: not tried again
        // The visualizer makes a Resource of an entity's uri every frame, which for a
        // string means parsing it again: 3 us an aircraft, measurably slower than the
        // Resource the CZML datasource gives it. So the uri is set as a Resource, one per model
        const lodResources = new Map();         // URL -> Resource
        // What has been done to a model is kept here rather than on it: a property added
        // to some Models and not others gives Cesium's per-frame code two shapes of
        // object to deal with, which measured slower
        const lodPosedModels = new WeakSet();
        const appliedAnimations = new WeakMap(); // Model -> the records put on it
        let activeLodSwaps = 0;
        let lowDetailModelsEnabled = true;      // Map setting "Low detail models"

        // The packet's model, before the datasource sees it. lowDetailGltf is ours rather
        // than CZML's, so it is taken out
        function lodFromPacket(command) {
            const low = command.model.lowDetailGltf;
            delete command.model.lowDetailGltf;
            const full = command.model.gltf;
            if (full === undefined) {
                return;     // Not a change of model: showing or hiding it
            }
            const state = lodEntities.get(command.id);
            if ((state !== undefined) && (state.full === full) && (state.low === low)) {
                // The same model sent again, because its size or visibility changed:
                // it stays at the level it is at
                if (state.showingLow) {
                    command.model.gltf = state.low;
                }
                return;
            }
            // A different aircraft model, or the first: it starts at full detail. The
            // sender puts the new model's animations on it itself
            entityAnimations.delete(command.id);
            if (low) {
                lodEntities.set(command.id, { full: full, low: low, showingLow: false, wantLow: false, swapping: false });
            } else {
                lodEntities.delete(command.id);
            }
        }

        function forgetLod(id) {
            lodEntities.delete(id);
            entityAnimations.delete(id);
        }

        // How much of the screen height the model covers as drawn, so including the
        // minimum pixel size that holds a distant one up
        function drawnScreenFraction(model) {
            const scene = viewer.scene;
            const sphere = model.boundingSphere;
            const metresPerPixel = viewer.camera.getPixelSize(sphere, scene.drawingBufferWidth, scene.drawingBufferHeight);
            if (!(metresPerPixel > 0)) {
                return 1.0;
            }
            const diameter = Math.max(2.0 * sphere.radius / metresPerPixel, model.minimumPixelSize);
            return diameter / scene.drawingBufferHeight;
        }

        // A model can load and still have nothing to draw: a converted file whose nodes were
        // all stripped keeps its meshes but has an empty scene, and its bounding sphere is
        // NaN. Taken at face value that made drawnScreenFraction report the whole screen, so
        // an aircraft on such a low detail model went back to full detail, looked small
        // again, and swapped to the empty model again - about once a second, each time a
        // full model load, and invisible in between. Measured with 87 such files after a
        // reconversion: three aircraft doing it made the map's garbage more than double
        function hasDrawableBounds(model) {
            const sphere = model.boundingSphere;
            return Cesium.defined(sphere) && (sphere.radius > 0) && Number.isFinite(sphere.radius);
        }

        // From the far mode pass, for each loaded model that has a low detail version
        function chooseLod(state, entity, model) {
            if (!lowDetailModelsEnabled || isFocused(entity)) {
                state.wantLow = false;
                return;
            }
            if (!model.show) {
                return;     // Not drawn, so not worth changing
            }
            if (!hasDrawableBounds(model)) {
                // Showing a low detail model with nothing in it: back to full detail, and
                // that file is not used again, as for one that would not load
                if (state.showingLow) {
                    console.log("Level of detail: nothing to draw in " + state.low);
                    lodFailedUrls.add(state.low);
                    state.wantLow = false;
                }
                return;
            }
            const fraction = drawnScreenFraction(model);
            if (fraction < lowDetailBelow) {
                state.wantLow = true;
            } else if (fraction > fullDetailAbove) {
                state.wantLow = false;
            }
        }

        // A swap that gives up straight away - the aircraft has no position just now -
        // calls this again from its finally, before it has returned. Without the guard
        // that call started the same aircraft's swap again, which gave up again, without
        // end, and the page hung. Now each pass tries each aircraft once, and one that
        // gave up is tried again on the next pass
        let pumpingLodSwaps = false;
        function pumpLodSwaps() {
            if (pumpingLodSwaps) {
                return;
            }
            pumpingLodSwaps = true;
            try {
                // An aircraft about to be followed goes first, whatever else is changing
                if (lodPendingFocus !== undefined) {
                    const id = lodPendingFocus.entity.id;
                    const state = lodEntities.get(id);
                    if ((state !== undefined) && !state.swapping && state.showingLow
                        && !lodFailedUrls.has(state.full)) {
                        swapLod(id, state, false);
                    }
                }
                for (const [id, state] of lodEntities) {
                    if (activeLodSwaps >= maxConcurrentLodSwaps) {
                        return;
                    }
                    if (!state.swapping && (state.wantLow !== state.showingLow)
                        && !lodFailedUrls.has(state.wantLow ? state.low : state.full)) {
                        swapLod(id, state, state.wantLow);
                    }
                }
            } finally {
                pumpingLodSwaps = false;
            }
        }

        // Following an aircraft drawn in low detail changed its model just as the camera
        // set off, since one being followed is drawn in full. Cesium aims the camera from
        // the bounding sphere of the entity's model, and during the change that model is
        // gone for a few frames and then replaced by one centred a little differently, so
        // the aircraft shot ahead of the camera and jumped back and forth. So the full
        // model is put in first, and the camera only moved once it is drawn. Usually a
        // fraction of a second; if the model never arrives the camera goes anyway
        const focusSwapTimeoutMs = 3000;
        let lodPendingFocus;                    // {entity}: waiting to be followed
        //
        // The aircraft stays marked as about to be followed until the follow has started,
        // not just until its model is in. Starting one means setting trackedEntity to
        // undefined and then to the aircraft, and the far mode pass runs on each change:
        // in between, nothing is followed, and an aircraft still far from the camera was
        // sent back down to low detail - a swap the follow then reversed, two changes of
        // model while the camera was following it, each freezing it for a few frames
        function followingNow(focus, action) {
            lodPendingFocus = focus;
            try {
                action();
            } finally {
                if (lodPendingFocus === focus) {
                    lodPendingFocus = undefined;
                }
            }
        }
        function withFullDetail(entity, action) {
            const state = Cesium.defined(entity) ? lodEntities.get(entity.id) : undefined;
            if ((state === undefined) || (!state.showingLow && !state.swapping)) {
                followingNow({ entity: entity }, action);
                return;
            }
            const focus = { entity: entity };
            lodPendingFocus = focus;            // Also keeps chooseLod from sending it back down
            state.wantLow = false;
            pumpLodSwaps();
            afterFramesUntil(() => {
                if (lodPendingFocus !== focus) {
                    return true;                // Something else was clicked meanwhile
                }
                const current = lodEntities.get(entity.id);
                return (current === undefined) || (!current.showingLow && !current.swapping);
            }, focusSwapTimeoutMs).then(() => {
                if (lodPendingFocus === focus) {
                    followingNow(focus, action);
                }
            });
        }

        // The entity's own Model, whether or not it has loaded
        function anyModelPrimitive(entity) {
            const primitives = viewer.scene.primitives;
            for (let i = 0; i < primitives.length; i++) {
                const primitive = primitives.get(i);
                if ((primitive instanceof Cesium.Model) && (primitive.id === entity)) {
                    return primitive;
                }
            }
            return undefined;
        }

        function textured(model) {
            return model.ready && Cesium.defined(model._loader) && model._loader.texturesLoaded;
        }

        // Resolves true once test() passes, checked after each frame, or false on timeout
        function afterFramesUntil(test, timeoutMs) {
            return new Promise((resolve) => {
                const start = performance.now();
                const remove = viewer.scene.postRender.addEventListener(function () {
                    const passed = test();
                    if (passed || (performance.now() - start > timeoutMs)) {
                        remove();
                        // Dropped as soon as it is finished with. A caller's test closes
                        // over the scope it was written in - for a level of detail swap
                        // that is the model being watched and everything around it - and
                        // this promise, or whatever holds it, can outlive the swap. The
                        // listener going is not enough while the binding still points at
                        // the test: a hundred-odd of those scopes were alive at a time,
                        // each holding a destroyed model's scene graph
                        test = undefined;
                        resolve(passed);
                    }
                });
            });
        }

        // Puts a model the entity is about to be drawn with into the state its current
        // one is in: far mode, and the pose its animations have left it in
        function matchModel(model, id, url) {
            const isFar = (Cesium.Cartesian3.distance(viewer.camera.positionWC,
                model.boundingSphere.center) > farModelDistance)
                && !isFocused(model.id);
            applyFarMode(model, url, isFar);
            applyAnimations(model, id);
        }

        // What is known of the surface under an aircraft, carried from its old model to
        // the new one. With a height reference, the bounding sphere a camera following the
        // aircraft is aimed by needs the height of the ground under it, and the follow
        // camera stands still on any frame it is pending. Where the globe can't answer -
        // on Google's tiles - that height comes from the last one the model's own clip
        // found, or else from a sample of the most detailed tiles that takes as long as
        // they take to load. A new Model, and the visualizer's new record for it, start
        // with neither, so after a change of model the sphere was pending, the camera
        // stood still while the aircraft flew on, and then caught up in a jump
        function entityModelData(entity) {
            const visualizers = czmlStream._visualizers || [];
            for (const visualizer of visualizers) {
                if (visualizer._modelHash !== undefined) {
                    return visualizer._modelHash[entity.id];
                }
            }
            return undefined;
        }
        function surfaceKnownBy(entity, model) {
            const data = entityModelData(entity);
            return {
                height: model._lastSurfaceHeight,
                from: data,
                sampled: (data === undefined) ? undefined : {
                    position: data.mostDetailedHeightPosition,
                    height: data.mostDetailedHeight,
                    previous: data.mostDetailedHeightPrevious
                }
            };
        }
        function carrySurface(entity, model, known) {
            if (known === undefined) {
                return;
            }
            if ((model._lastSurfaceHeight === undefined) && (known.height !== undefined)) {
                model._lastSurfaceHeight = known.height;
            }
            const data = entityModelData(entity);
            if ((data === undefined) || (data === known.from) || (known.sampled === undefined)
                || (data.mostDetailedHeightPosition !== undefined)) {
                return;
            }
            if (known.sampled.height !== undefined) {
                data.mostDetailedHeightPosition = known.sampled.position;
                data.mostDetailedHeight = known.sampled.height;
                data.mostDetailedHeightPrevious = known.sampled.previous;
            } else if (known.sampled.previous !== undefined) {
                // A sample still on its way answers into the old record, never this one,
                // so only the answer before it is carried, and a new sample is asked for
                // with that standing in meanwhile
                data.mostDetailedHeightPrevious = known.sampled.previous;
            }
        }

        // Model.modelMatrix is a plain field, so it is copied into rather than assigned: a
        // shared scratch matrix assigned to several holders moved them all together.
        // False when the entity has no position now - an aircraft between samples or gone
        // stale - when the holder must not be placed at all. A model left at the identity
        // matrix sits at the centre of the Earth, which has no cartographic position, and
        // one with a height reference then hands the globe a height callback for an
        // undefined position: the quadtree throws on it and rendering stops
        const holderMatrixScratch = new Cesium.Matrix4();
        function placeHolder(holder, entity, time) {
            const matrix = entity.computeModelMatrix(time, holderMatrixScratch);
            if (!matrix) {
                return false;
            }
            holder.modelMatrix = Cesium.Matrix4.clone(matrix, holder.modelMatrix);
            return true;
        }

        async function swapLod(id, state, toLow) {
            const target = toLow ? state.low : state.full;
            const current = () => (lodEntities.get(id) === state) && (czmlStream.entities.getById(id) !== undefined);
            state.swapping = true;
            activeLodSwaps++;
            let holder;
            let failed = false;
            try {
                const entity = czmlStream.entities.getById(id);
                if ((entity === undefined) || !entity.model) {
                    return;
                }
                const graphics = entity.model;
                let time = viewer.clock.currentTime;
                const startMatrix = entity.computeModelMatrix(time, new Cesium.Matrix4());
                if (!startMatrix) {
                    return;     // Nowhere to put it: tried again on a later pass
                }
                holder = await Cesium.Model.fromGltfAsync({
                    url: target,
                    scene: viewer.scene,
                    show: false,
                    modelMatrix: startMatrix,
                    minimumPixelSize: Cesium.Property.getValueOrDefault(graphics.minimumPixelSize, time, 0.0),
                    maximumScale: Cesium.Property.getValueOrUndefined(graphics.maximumScale, time),
                    heightReference: Cesium.Property.getValueOrDefault(graphics.heightReference, time, Cesium.HeightReference.NONE),
                    // As czml.cpp asks for the entity's own model: loaded with its textures,
                    // so its shaders are built once rather than again when they arrive
                    incrementallyLoadTextures: false
                });
                holder.errorEvent.addEventListener(function () { failed = true; });
                // Not given the entity as its id: nothing else here should take it for
                // the entity's model
                viewer.scene.primitives.add(holder);
                const loaded = await afterFramesUntil(() => failed || !current() || textured(holder), lodHolderTimeoutMs);
                if (failed || !loaded) {
                    console.log("Level of detail: can't load " + target);
                    lodFailedUrls.add(target);
                    return;
                }
                if (!current()) {
                    return;
                }
                // Loaded, but with nothing in it to draw - see hasDrawableBounds
                if (!hasDrawableBounds(holder)) {
                    console.log("Level of detail: nothing to draw in " + target);
                    lodFailedUrls.add(target);
                    return;
                }
                if (state.wantLow !== toLow) {
                    // Wanted the other way again while it loaded - an aircraft clicked on
                    // and now being followed, say. Changing anyway, only to change back,
                    // would replace the model twice for nothing; and a camera following
                    // it stands still each time the model is replaced
                    return;
                }

                // The handover. The old model goes at the next frame; the holder is drawn
                // where it was until the entity's new model has loaded
                time = viewer.clock.currentTime;
                if (!placeHolder(holder, entity, time)) {
                    return;
                }
                const old = getModelPrimitive(viewer, entity);
                const surface = (old !== undefined) ? surfaceKnownBy(entity, old) : undefined;
                if (old !== undefined) {
                    carrySurface(entity, holder, surface);
                    matchModel(holder, id, target);
                    holder.distanceDisplayCondition = Cesium.Property.getValueOrUndefined(graphics.distanceDisplayCondition, time);
                    holder.show = old.show;
                    // So an animation asked for meanwhile waits for the new model - see noteModelChange
                    staleModelPrimitives.set(id, old);
                }
                state.showingLow = toLow;
                if (!lodResources.has(target)) {
                    lodResources.set(target, new Cesium.Resource({ url: target }));
                }
                graphics.uri = new Cesium.ConstantProperty(lodResources.get(target));

                // The holder follows the aircraft, and the new model is posed as soon as it
                // is ready - before its first frame, which is the one after
                let posed;
                let framesPosed = 0;
                // The pose waiting on the new model's ready event, so the swap can take it
                // off again whichever way it ends. The closure holds this whole scope, and
                // the scope still names the model being replaced, so one left behind on a
                // model that never becomes ready pins its predecessor for as long as it
                // lives. That is the chain a breadth-first walk of the heap found: a live
                // model, its readyEvent, the listener map, this closure, and a destroyed
                // model on the end of it
                let removePose;
                const follow = viewer.scene.preRender.addEventListener(function () {
                    if (!placeHolder(holder, entity, viewer.clock.currentTime)) {
                        holder.show = false;    // As the visualizer hides the entity's model
                    }
                });
                try {
                    await afterFramesUntil(() => {
                        if (!current()) {
                            return true;
                        }
                        const model = anyModelPrimitive(entity);
                        if ((model === undefined) || model.isDestroyed()) {
                            return false;
                        }
                        if (posed !== model) {
                            posed = model;
                            framesPosed = 0;
                            const pose = function () {
                                carrySurface(entity, model, surface);
                                matchModel(model, id, target);
                                lodPosedModels.add(model);
                            };
                            if (model.ready) {
                                pose();
                            } else {
                                // Taken off once it has fired, and again by the swap's
                                // finally if it never does. Cesium's Event holds a
                                // listener until it is removed - in 1.145 in a Map - and
                                // 117 of these were still registered across 138 aircraft
                                if (removePose !== undefined) {
                                    removePose();
                                }
                                removePose = model.readyEvent.addEventListener(() => {
                                    if (removePose !== undefined) {
                                        removePose();
                                        removePose = undefined;
                                    }
                                    pose();
                                });
                            }
                            return false;
                        }
                        if (lodPosedModels.has(model) && textured(model)) {
                            framesPosed++;
                        }
                        // Drawn for a frame with its own textures and pose, under the holder
                        return framesPosed >= 2;
                    }, lodHolderTimeoutMs);
                } finally {
                    follow();
                    // A model that never became ready still has the pose waiting on it
                    if (removePose !== undefined) {
                        removePose();
                        removePose = undefined;
                    }
                }
            } catch (e) {
                console.log("Level of detail: change to " + target + " failed: " + formatRejection(e));
                lodFailedUrls.add(target);
            } finally {
                if ((holder !== undefined) && !holder.isDestroyed()) {
                    viewer.scene.primitives.remove(holder);     // Destroys it
                }
                // Dropped explicitly, because this scope outlives the swap. Something is
                // still holding the closures made here - in a heap taken after a few
                // hours, 150 of them were roots in their own right, which is what a
                // promise that never settles leaves behind - and while `holder` pointed
                // at the model, destroying it freed its GPU resources but not the
                // JavaScript: the scene graph stayed, 65 runtime nodes and their
                // transforms apiece. 505 Model objects were alive for 136 aircraft,
                // 369 of them destroyed and still held, which is most of a heap that
                // had grown to 3.85 MB an aircraft from 2.0 on a fresh start
                holder = undefined;
                state.swapping = false;
                activeLodSwaps--;
                pumpLodSwaps();
            }
        }

        // The animations each aircraft with a low detail model has been asked for, so the
        // model it changes to can be put in the same pose - gear up, flaps out - with its
        // engines still turning. Kept here rather than read back from the old model, as the
        // two levels differ in what they have: the low detail A320 has 8 of the 21, so the
        // flaps set while it was showing would otherwise be lost on the way back up
        const entityAnimations = new Map();     // Entity id -> [record]

        function recordAnimation(command) {
            if (!lodEntities.has(command.id)) {
                return undefined;
            }
            const now = viewer.clock.currentTime;
            // As playAnimation does: a start in the past plays now
            let startTime = Cesium.JulianDate.fromIso8601(command.startDateTime);
            if (Cesium.JulianDate.lessThan(startTime, now)) {
                startTime = Cesium.JulianDate.clone(now);
            }
            const record = {
                name: command.animation,
                startTime: startTime,
                stopTime: (command.duration != 0) ? Cesium.JulianDate.addSeconds(startTime, command.duration, new Cesium.JulianDate()) : undefined,
                startOffset: command.startOffset,
                reverse: !!command.reverse,
                loop: !!command.loop,
                multiplier: command.multiplier ? command.multiplier : 1.0
            };
            let records = entityAnimations.get(command.id) || [];
            if (record.loop) {
                // A looped animation asserted again replaces the one playing
                records = records.filter((r) => r.name !== record.name);
            }
            records.push(record);
            entityAnimations.set(command.id, pruneAnimations(records, now));
            return record;
        }

        function recordAnimationStop(command) {
            const records = entityAnimations.get(command.id);
            if (records === undefined) {
                return;
            }
            // The one stopAnimation stops: the latest to start
            let latest;
            for (const r of records) {
                if ((r.name === command.animation) && ((latest === undefined) || Cesium.JulianDate.greaterThanOrEquals(r.startTime, latest.startTime))) {
                    latest = r;
                }
            }
            if (latest !== undefined) {
                latest.stopTime = Cesium.JulianDate.fromIso8601(command.startDateTime);
            }
        }

        // Once an animation has started, the earlier ones of the same name make no
        // difference to the pose - it overrides them - so only it and any yet to start
        // are kept. Otherwise a long flight's gear and flap movements would pile up
        function pruneAnimations(records, now) {
            const latestStarted = new Map();
            for (const r of records) {
                if (!r.loop && Cesium.JulianDate.lessThanOrEquals(r.startTime, now)) {
                    const latest = latestStarted.get(r.name);
                    if ((latest === undefined) || Cesium.JulianDate.greaterThanOrEquals(r.startTime, latest.startTime)) {
                        latestStarted.set(r.name, r);
                    }
                }
            }
            return records.filter((r) => {
                const latest = latestStarted.get(r.name);
                return r.loop || (latest === undefined) || (r === latest) || Cesium.JulianDate.greaterThan(r.startTime, latest.startTime);
            });
        }

        function applyAnimations(model, id) {
            const records = entityAnimations.get(id);
            if (records === undefined) {
                return;
            }
            const applied = new Set();
            appliedAnimations.set(model, applied);
            for (const r of pruneAnimations(records, viewer.clock.currentTime)) {
                const options = {
                    name: r.name,
                    startTime: r.startTime,
                    startOffset: r.startOffset,
                    reverse: r.reverse,
                    multiplier: r.multiplier
                };
                if (r.loop) {
                    // Started when the first one was, so engines and propellers carry on
                    // turning where they had got to
                    options.loop = Cesium.ModelAnimationLoop.REPEAT;
                    options.stopTime = r.stopTime;
                } else {
                    // Cesium doesn't take an animation whose start has passed to where it
                    // should have got to (https://github.com/CesiumGS/cesium/issues/10048) -
                    // it doesn't play it at all - so that is worked out here: how far it
                    // has got, held at the end, or where it was stopped
                    const stopSeconds = (r.stopTime !== undefined) ? Cesium.JulianDate.secondsDifference(r.stopTime, r.startTime) : Infinity;
                    options.animationTime = function (duration, seconds) {
                        return Math.min(Math.min(seconds, stopSeconds) / duration, 1.0);
                    };
                }
                try {
                    model.activeAnimations.add(options);
                    applied.add(r);
                } catch (e) {
                    // This level of detail doesn't have it
                }
            }
        }

        // How much of Google's tileset is held in memory, and for how long. Both cost
        // requests to keep low and memory to keep high, and memory is what shows: the
        // tiles are only half of it, because a tile that is loaded, or was drawn
        // recently, keeps the whole branch of the tile tree it sits in, and every
        // garbage collection walks that tree. Flying low along a track discovers ground
        // quickly, and with Cesium's defaults for Google (1.5 GB, and no release at all
        // before the fix in our Cesium) the tree passed 460,000 tiles and 2 GB, where
        // collections took a third of a second and showed as a stutter every few
        // seconds.
        //
        // Measured on a low fly-by, with the tree release in place:
        //
        //   cache   idle    tiles held      frame rate   requests
        //   1536 MB  600    60k - 234k      21 - 59 fps    -
        //    512 MB  600    60k - 234k      21 - 59 fps  20.5/s
        //    512 MB  120    60k - 107k      48 - 59 fps  30.5/s
        //
        // So the idle is what bounds the tree during flight, and it is paid for in
        // requests against the Google quota - about half as many again.
        //
        // The screen space error is how much of a tile's own error, in pixels, is
        // tolerated before it is refined, so it decides how much has to be fetched and
        // drawn. Cesium's default of 16 loads about twice what 24 does, and on the same
        // flight that showed as:
        //
        //   error   tiles loaded   lost to collection   frame rate
        //     16        68/s          876 ms per 10s     24 - 49 fps
        //     24        32/s          388 ms per 10s     50 - 59 fps
        //
        // Side by side from a fixed viewpoint the two are hard to tell apart - the
        // foreground is identical and only the horizon softens - so the detail is worth
        // less here than the frame rate
        const googleTilesetOptions = {
            cacheBytes: 512 * 1024 * 1024,
            maximumCacheOverflowBytes: 256 * 1024 * 1024,
            externalTilesetIdleFrames: 120,
            maximumScreenSpaceError: 24
        };

        // See surfaceHeightAt(). Raised once per frame the camera moved appreciably
        viewer.camera.changed.addEventListener(function () {
            cameraMoves++;
        });

        viewer.useBrowserRecommendedResolution = false; // Improves label quality when false, as drawn at higher res

        viewer.infoBox.frame.setAttribute('sandbox', 'allow-same-origin allow-popups allow-forms allow-scripts allow-top-navigation');
        viewer.infoBox.frame.src = "about:blank"; // Force reload so new attributes are applied

        viewer.infoBox.viewModel.cameraClicked.removeEventListener(Cesium.Viewer.prototype._onInfoBoxCameraClicked, viewer); // Override info box camera button being clicked
        viewer.infoBox.viewModel.cameraClicked.addEventListener(infoBoxCameraClicked, viewer);

        // The PFD is redrawn once per displayed frame rather than on a timer. The old
        // 100 Hz interval drew frames that were never shown - the application renders at
        // 60 - and its period beating against the refresh made the tapes move unevenly.
        // requestAnimationFrame also stops the redraw altogether while the map is not
        // being composited. The radio altitude keeps its own timer: it samples terrain
        // rather than drawing, and is wanted at a steady rate
        var pfdRunning = false;
        var pfdFrame = undefined;
        var pfdRadioAltTimer = undefined;

        // The PFD is redrawn on a timer of its own rather than once a frame. What it shows
        // comes from ADS-B, which arrives about once a second, so drawing it sixty or a
        // hundred times a second repaints the same needles: measured against a sky of 150
        // aircraft, the panels were making about 600 MB a minute of garbage, a fifth of
        // all the map allocated, and a major collection is what the stutters are. The
        // other panels were already paced - the ND every 50 ms, the radio every 250, the
        // DCDU every second - so this was the one left running flat out.
        // Still driven by requestAnimationFrame, so it stops when the page is not drawn
        const pfdMinIntervalMs = 100;   // 10 Hz
        let pfdLastUpdate = 0;

        function pfdLoop() {
            if (!pfdRunning) {
                return;
            }
            // Booked before the work, so a throw in updatePFD does not end the loop
            pfdFrame = requestAnimationFrame(pfdLoop);
            const now = performance.now();
            if (now - pfdLastUpdate < pfdMinIntervalMs) {
                return;
            }
            pfdLastUpdate = now;
            updatePFD();
        }

        function startPFDUpdates() {
            if (!pfdRunning) {
                pfdRunning = true;
                pfdFrame = requestAnimationFrame(pfdLoop);
            }
        }

        function stopPFDUpdates() {
            pfdRunning = false;
            if (pfdFrame !== undefined) {
                cancelAnimationFrame(pfdFrame);
                pfdFrame = undefined;
            }
        }
        var ndTimer = undefined;
        var ndTrafficTimer = undefined;
        // The ND's state and traffic scan also run while only the PFD is shown, as the
        // PFD arms TCAS on its FMA from the ND's traffic advisories. The ND itself is
        // only drawn while visible
        var pfdShown = false;
        var ndShown = false;
        function updateNDTimers() {
            if (pfdShown || ndShown) {
                if (ndTimer === undefined) {
                    // 10 Hz, as the PFD: its source updates about once a second
                    ndTimer = setInterval(updateND, 100);
                    ndTrafficTimer = setInterval(updateNDTraffic, 1000);
                    // The radio altitude is the height the TCAS inhibit is measured
                    // against, so it is sampled for the ND as well as for the PFD
                    pfdRadioAltTimer = setInterval(updateRadioAlt, 250);
                }
            } else if (ndTimer !== undefined) {
                clearInterval(ndTimer);
                clearInterval(ndTrafficTimer);
                clearInterval(pfdRadioAltTimer);
                ndTimer = undefined;
                ndTrafficTimer = undefined;
                pfdRadioAltTimer = undefined;
            }
        }
        var efisTimer = undefined;
        var rmpTimer = undefined;

        var buildings = undefined;
        // Aircraft tracks: a PrimitiveCollection of one PolylineCollection per segment - see
        // handleTrackPolyline(). Declared out here because the surface sampling has to hide
        // them - see surfaceHeightAt() - as well as handleTrackPolyline() building them
        var trackPolylines = null;
        var googleTileset = undefined;
        var googleTilesetEnabled = false; // Set before the tileset has finished loading
        const images = new Map();

        var mufGeoJSONStream = null;
        var foF2GeoJSONStream = null;
        var wmmGeoJSONStream = null;

        const positionMarker = viewer.entities.add({
            id: 'Position marker',
            point: {
                show: false,
                pixelSize: 8,
                color: Cesium.Color.RED,
                heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND
            },
            label: {
                show: false,
                showBackground: true,
                font: "12px monospace",
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.RED,
                horizontalOrigin: Cesium.HorizontalOrigin.LEFT,
                verticalOrigin: Cesium.VerticalOrigin.TOP,
                pixelOffset: new Cesium.Cartesian2(0, 9),
                heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND
            },
        });

        // Generate HTML for MUF contour info box from properties in GeoJSON
        function describeMUF(properties, nameProperty) {
            let html = "";
            if (properties.hasOwnProperty("level-value")) {
                const value = properties["level-value"];
                if (Cesium.defined(value)) {
                    html = `<p>MUF: ${value} MHz<p>MUF (Maximum Usable Frequency) is the highest frequency that will reflect from the ionosphere on a 3000km path`;
                }
            }
            return html;
        }

        // Generate HTML for foF2 contour info box from properties in GeoJSON
        function describefoF2(properties, nameProperty) {
            let html = "";
            if (properties.hasOwnProperty("level-value")) {
                const value = properties["level-value"];
                if (Cesium.defined(value)) {
                    html = `<p>foF2: ${value} MHz<p>foF2 (F2 region critical frequency) is the highest frequency that will be reflected vertically from the F2 ionosphere region`;
                }
            }
            return html;
        }

        // Generate HTML for WMM contour info box from properties in GeoJSON
        function describeWMM(properties, nameProperty) {
            let html = "";
            if (properties.hasOwnProperty("Contour")) {
                const value = properties["Contour"];
                if (Cesium.defined(value)) {
                    html = `<p>Magnetic declination: ${value} degrees`;
                }
            }
            return html;
        }

        // Use CZML to stream data from Map plugin to Cesium
        var czmlStream = new Cesium.CzmlDataSource();

        viewer.dataSources.add(czmlStream);

        function cameraLight(scene, time) {
            viewer.scene.light.direction = Cesium.Cartesian3.clone(scene.camera.directionWC, viewer.scene.light.direction);
        }

        var velocityVectorProperty = undefined;
        const velocityVector = new Cesium.Cartesian3();

        // Camera mode, as MapSettings::CameraMode: 0 third person, 1 first person, 2 fly-by
        const cameraModeThirdPerson = 0;
        const cameraModeFirstPerson = 1;
        const cameraModeFlyBy = 2;
        var cameraMode = cameraModeThirdPerson;
        var firstPersonEntity;
        var firstPersonOffset = 0.0;
        var cameraSavedPositionValid = false;
        var cameraSavedPosition;
        var cameraSavedHeading;
        var cameraSavedPitch;
        var cameraSavedRoll;
        var cameraSavedTransform;
        var cameraInitPos = false;

        // ---------------------------------------------------------------------------------
        // Fly-by camera: the camera is put at a fixed point ahead of the object and off to
        // one side, and stays there - only turning to follow - while the object flies past.
        // Once the object is away in the distance it is placed again ahead of the new track.
        // Holding the point still is what makes this a fly-by rather than a chase camera

        const flyByLeadSeconds = 12;        // How far ahead to sit, as flying time
        const flyByMinLead = 800;           // ...but no nearer than this, metres
        const flyByMaxLead = 5000;          // ...and no further than this
        const flyByStandoff = 250;          // To one side of the track, metres
        const flyByHeight = 40;             // Above the object, metres
        const flyByRepositionDistance = 2500; // Move once it is this far away and receding
        const flyByMinDwell = 3;            // Seconds to hold a viewpoint at the least
        const flyByStationary = 20;         // Below this speed the object is treated as parked, m/s
        const flyByTerrainClearance = 30;   // Keep the camera at least this far above ground

        var flyByEntity;
        var flyByVelocityProperty;
        var flyByCameraPos;                 // Fixed world point the camera sits at
        var flyByPlacedTime;
        // A viewpoint placed before the object velocity was known - it stands off rather
        // than leading the track, so it is replaced as soon as a velocity does arrive.
        // Covers both the first frame after entering fly-by, where Cesium has not yet had
        // two samples to differentiate, and an object that is parked and then sets off
        var flyByProvisional = false;
        var flyBySide = 1;
        // The mouse wheel scales the whole standoff geometry, so how close the viewpoint
        // sits carries over to the ones placed after it
        const flyByZoomStep = 0.85;
        const flyByZoomMin = 0.1;
        const flyByZoomMax = 8;
        var flyByZoom = 1;                  // Alternated, so successive passes are shot from either side

        // Scratch, so the per-frame path allocates nothing
        const flyByScratch = {
            position: new Cesium.Cartesian3(),
            velocity: new Cesium.Cartesian3(),
            forward: new Cesium.Cartesian3(),
            up: new Cesium.Cartesian3(),
            side: new Cesium.Cartesian3(),
            offset: new Cesium.Cartesian3(),
            toTarget: new Cesium.Cartesian3(),
            direction: new Cesium.Cartesian3(),
            cameraUp: new Cesium.Cartesian3(),
            right: new Cesium.Cartesian3(),
            transform: new Cesium.Matrix4()
        };

        // The geodetic up at a point, which the local east-north-up frame's third column is
        function flyByUpAt(position, result) {
            const transform = Cesium.Transforms.eastNorthUpToFixedFrame(position, undefined, flyByScratch.transform);
            Cesium.Matrix4.getColumn(transform, 2, result);
            return Cesium.Cartesian3.normalize(result, result);
        }

        // Choose a new viewpoint, ahead of the object and to one side of its track
        function flyByReposition(position, velocity, time) {
            const s = flyByScratch;
            const speed = Cesium.Cartesian3.magnitude(velocity);
            const up = flyByUpAt(position, s.up);

            if (speed >= flyByStationary) {
                Cesium.Cartesian3.normalize(velocity, s.forward);
                // Perpendicular to the track and level with the horizon
                Cesium.Cartesian3.cross(s.forward, up, s.side);
                Cesium.Cartesian3.normalize(s.side, s.side);
                const lead = Math.max(flyByMinLead, Math.min(flyByMaxLead, speed * flyByLeadSeconds)) * flyByZoom;
                Cesium.Cartesian3.multiplyByScalar(s.forward, lead, s.offset);
            } else {
                // Parked: there is no track to lead, so just stand off to the east
                const transform = Cesium.Transforms.eastNorthUpToFixedFrame(position, undefined, s.transform);
                Cesium.Matrix4.getColumn(transform, 0, s.side);
                Cesium.Cartesian3.normalize(s.side, s.side);
                Cesium.Cartesian3.multiplyByScalar(s.side, flyByMinLead * flyByZoom, s.offset);
            }

            const camera = Cesium.Cartesian3.add(position, s.offset, new Cesium.Cartesian3());
            Cesium.Cartesian3.multiplyByScalar(s.side, flyBySide * flyByStandoff * flyByZoom, s.offset);
            Cesium.Cartesian3.add(camera, s.offset, camera);
            Cesium.Cartesian3.multiplyByScalar(up, flyByHeight * flyByZoom, s.offset);
            Cesium.Cartesian3.add(camera, s.offset, camera);
