    <script>

        // Position the PFD bottom left and the ND bottom right, each no more than
        // half the window height, with the EFIS and RMP panels above the ND and the
        // DCDU above the PFD
        const cockpitDisplaySize = Math.max(250, Math.min(500, Math.floor(window.innerHeight / 2)));
        const cockpitDisplayTop = window.innerHeight - cockpitDisplaySize - 30;

        const pfdCanvas = document.getElementById("pfdCanvas");
        pfdCanvas.style.width = cockpitDisplaySize + "px";
        pfdCanvas.style.height = cockpitDisplaySize + "px";
        pfdCanvas.style.left = "10px";
        pfdCanvas.style.top = cockpitDisplayTop + "px";

        ndCanvas.style.width = cockpitDisplaySize + "px";
        ndCanvas.style.height = cockpitDisplaySize + "px";
        ndCanvas.style.left = (window.innerWidth - cockpitDisplaySize - 10) + "px";
        ndCanvas.style.top = cockpitDisplayTop + "px";

        // The EFIS control panel directly above the ND, at three quarters of its
        // width, with the RMP above that, then the DCDU
        const efisPanelWidth = Math.round(cockpitDisplaySize * 0.75);
        const efisPanelHeight = Math.round(efisPanelWidth * 0.26);
        efisCanvas.style.width = efisPanelWidth + "px";
        efisCanvas.style.height = efisPanelHeight + "px";
        efisCanvas.style.left = (window.innerWidth - efisPanelWidth - 10) + "px";
        efisCanvas.style.top = Math.max(cockpitDisplayTop - efisPanelHeight - 6, 0) + "px";

        const rmpPanelHeight = Math.round(efisPanelWidth * 0.40);
        rmpCanvas.style.width = efisPanelWidth + "px";
        rmpCanvas.style.height = rmpPanelHeight + "px";
        rmpCanvas.style.left = (window.innerWidth - efisPanelWidth - 10) + "px";
        rmpCanvas.style.top = Math.max(cockpitDisplayTop - efisPanelHeight - rmpPanelHeight - 12, 0) + "px";

        // The DCDU above the PFD, their left edges aligned
        dcduCanvas.style.left = "10px";
        dcduCanvas.style.top = Math.max(cockpitDisplayTop - 228 - 6, 0) + "px";

        function getPropertyValue(entity, propertyName) {
            const property = entity.properties[propertyName];
            if (Cesium.defined(property)) {
                return property.getValue(viewer.clock.currentTime);
            } else {
                return undefined;
            }
        }

        // Only valid for TimeIntervalCollection properties
        function getTimerIntervalPropertyValueAt(entity, propertyName, time) {
            var value = undefined;
            const property = entity.properties[propertyName];

            if (Cesium.defined(property)) {
                value = property.getValue(time);
                if (!Cesium.defined(value)) {
                    value = property.intervals.get(0).data; // Get first available value
                }
            }

            return value;
        }

        // Only valid for SampledProperty properties
        function getSampledPropertyValueAt(entity, propertyName, time) {
            var value = undefined;
            const property = entity.properties[propertyName];

            if (Cesium.defined(property)) {
                value = property.getValue(time);
                if (!Cesium.defined(value)) {
                    value = property.getValue(property.getSample(0)); // Get first available value
                }
            }

            return value;
        }

        var pfdEntity;
        var pfd60SecsAgo = new Cesium.JulianDate();
        var pfdPrevClock;
        var pfdRadioAltitude;
        var pfdRadioAltitudeEntity;
        var pfdRadioAltPosition;

        function updatePFD() {
            // Display PFD for last selected aircraft
            const entity = viewer.selectedEntity;
            if (Cesium.defined(entity) && Cesium.defined(entity.properties) && ((entity.properties.hasProperty("pfdAltitude") || entity.properties.hasProperty("pfdOnSurface")))) {
                if (entity !== pfdEntity) {
                    pfdRadioAltitude = undefined;
                }
                pfdEntity = entity;
            }
            if (Cesium.defined(pfdEntity)) {
                var callsign;
                var aircraftType;
                if (pfdEntity.properties.hasProperty("pfdCallsign")) {
                    callsign = pfdEntity.properties["pfdCallsign"].getValue();
                } else {
                    callsign = "";
                }
                if (pfdEntity.properties.hasProperty("pfdAircraftType")) {
                    aircraftType = pfdEntity.properties["pfdAircraftType"].getValue();
                } else {
                    aircraftType = "";
                }
                pfd60SecsAgo = Cesium.JulianDate.addSeconds(viewer.clock.currentTime, -60, pfd60SecsAgo);
                const onSurface = pfdEntity.properties["pfdOnSurface"].getValue(viewer.clock.currentTime);
                const wasOnSurface60SecsAgo = getTimerIntervalPropertyValueAt(pfdEntity, "pfdOnSurface", pfd60SecsAgo);
                const indicatedAirspeed = getPropertyValue(pfdEntity, "pfdIndicatedAirspeed");
                const groundspeed = getPropertyValue(pfdEntity, "pfdGroundspeed");
                const mach = getPropertyValue(pfdEntity, "pfdMach");
                const altitude = getPropertyValue(pfdEntity, "pfdAltitude");
                var runwayAltitudeEstimate = undefined;
                if ((onSurface === 0) && (wasOnSurface60SecsAgo > 0)) {
                    runwayAltitudeEstimate = getSampledPropertyValueAt(pfdEntity, "pfdAltitude", pfd60SecsAgo);
                }
                const qnh = getPropertyValue(pfdEntity, "pfdQNH");
                const verticalSpeed = getPropertyValue(pfdEntity, "pfdVerticalSpeed");
                const heading = getPropertyValue(pfdEntity, "pfdHeading");
                const track = getPropertyValue(pfdEntity, "pfdTrack");
                const roll = getPropertyValue(pfdEntity, "pfdRoll");
                const pitch = getPropertyValue(pfdEntity, "pfdPitch");
                const selectedAltitude = getPropertyValue(pfdEntity, "pfdSelectedAltitude");
                const selectedHeading = getPropertyValue(pfdEntity, "pfdSelectedHeading");
                const autopilot = getPropertyValue(pfdEntity, "pfdAutopilot");
                const verticalMode = getPropertyValue(pfdEntity, "pfdVerticalMode");
                const lateralMode = getPropertyValue(pfdEntity, "pfdLateralMode");
                const tcasRA = getPropertyValue(pfdEntity, "pfdTcasRA");

                velocityVectorProperty.getValue(viewer.clock.currentTime, velocityVector);
                const modelSpeedMps = Cesium.Cartesian3.magnitude(velocityVector);
                const modelSpeedKnots = Math.round(modelSpeedMps * 1.944);

                // Is the clock moving forwards
                const forward = pfdPrevClock === undefined ? true : Cesium.JulianDate.compare(viewer.clock.currentTime, pfdPrevClock) > 0;

                setPFDData(forward, pfdEntity.id, callsign, aircraftType, onSurface, wasOnSurface60SecsAgo, runwayAltitudeEstimate,
                    modelSpeedKnots, indicatedAirspeed, groundspeed, mach, altitude, pfdRadioAltitude, qnh, verticalSpeed, heading, track, roll,
                    selectedAltitude, selectedHeading, autopilot, verticalMode, lateralMode, tcasRA, pitch
                );
            }
            drawPFD();
            pfdPrevClock = Cesium.JulianDate.clone(viewer.clock.currentTime, pfdPrevClock);
        }

        var ndEntity;
        var ndFlightPlanRaw;
        var ndFlightPlanParsed;
        var ndPosition;

        function updateND() {
            // Display ND for last selected aircraft, independently of the PFD
            const entity = viewer.selectedEntity;
            if (Cesium.defined(entity) && Cesium.defined(entity.properties) && ((entity.properties.hasProperty("pfdAltitude") || entity.properties.hasProperty("pfdOnSurface")))) {
                ndEntity = entity;
            }
            if (Cesium.defined(ndEntity)) {
                var callsign;
                if (ndEntity.properties.hasProperty("pfdCallsign")) {
                    callsign = ndEntity.properties["pfdCallsign"].getValue();
                }
                var latitude;
                var longitude;
                ndPosition = ndEntity.position.getValue(viewer.clock.currentTime, ndPosition);
                if (Cesium.defined(ndPosition)) {
                    const carto = Cesium.Cartographic.fromCartesian(ndPosition);
                    latitude = Cesium.Math.toDegrees(carto.latitude);
                    longitude = Cesium.Math.toDegrees(carto.longitude);
                }
                // The flight plan is a JSON string - only reparse when it changes
                var flightPlanRaw;
                if (ndEntity.properties.hasProperty("ndFlightPlan")) {
                    flightPlanRaw = ndEntity.properties["ndFlightPlan"].getValue();
                }
                if (flightPlanRaw !== ndFlightPlanRaw) {
                    ndFlightPlanRaw = flightPlanRaw;
                    if ((flightPlanRaw !== undefined) && (flightPlanRaw.length > 0)) {
                        try {
                            ndFlightPlanParsed = JSON.parse(flightPlanRaw);
                        } catch (e) {
                            ndFlightPlanParsed = undefined;
                        }
                    } else {
                        ndFlightPlanParsed = undefined;
                    }
                }
                setNDData({
                    icao: ndEntity.id,
                    callsign: callsign,
                    aircraftType: getPropertyValue(ndEntity, "pfdAircraftType"),
                    latitude: latitude,
                    longitude: longitude,
                    altitude: getPropertyValue(ndEntity, "pfdAltitude"),
                    heading: getPropertyValue(ndEntity, "pfdHeading"),
                    track: getPropertyValue(ndEntity, "pfdTrack"),
                    selectedHeading: getPropertyValue(ndEntity, "pfdSelectedHeading"),
                    groundspeed: getPropertyValue(ndEntity, "pfdGroundspeed"),
                    verticalSpeed: getPropertyValue(ndEntity, "pfdVerticalSpeed"),
                    trueAirspeed: getPropertyValue(ndEntity, "pfdTrueAirspeed"),
                    windSpeed: getPropertyValue(ndEntity, "pfdWindSpeed"),
                    windDirection: getPropertyValue(ndEntity, "pfdWindDirection"),
                    tcasMode: getPropertyValue(ndEntity, "pfdTCASMode"),
                    tcasRA: getPropertyValue(ndEntity, "pfdTcasRA"),
                    threatIcao: getPropertyValue(ndEntity, "pfdThreatIcao"),
                    radioAltitude: pfdRadioAltitude,
                    onSurface: getPropertyValue(ndEntity, "pfdOnSurface"),
                    staticAirTemperature: getPropertyValue(ndEntity, "pfdStaticAirTemperature"),
                    verticalMode: getPropertyValue(ndEntity, "pfdVerticalMode"),
                    lateralMode: getPropertyValue(ndEntity, "pfdLateralMode"),
                    flightPlan: ndFlightPlanParsed
                });
            }
            // While only the PFD is shown this pass just keeps the ND's state and
            // traffic advisories current
            if (!ndCanvas.hasAttribute("hidden")) {
                drawND();
            }
        }

        // The RMP: the selected aircraft's squawk, and a redraw so knob changes, squawk
        // updates and the entry flash all show. Latches its own entity so it works with
        // the ND hidden
        var rmpEntity;
        function updateRMP() {
            const entity = viewer.selectedEntity;
            if (Cesium.defined(entity) && Cesium.defined(entity.properties)
                && (entity.properties.hasProperty("pfdAltitude") || entity.properties.hasProperty("pfdOnSurface"))) {
                rmpEntity = entity;
            }
            if (Cesium.defined(rmpEntity)) {
                const squawk = getPropertyValue(rmpEntity, "pfdSquawk");
                ndSquawk = ((squawk === undefined) || (squawk < 0)) ? undefined : Math.round(squawk);
            } else {
                ndSquawk = undefined;
            }
            drawRMP();
        }

        function updateNDTraffic() {
            // Other aircraft, for TCAS style traffic display on the ND
            var traffic = [];
            if (Cesium.defined(ndEntity)) {
                for (const e of czmlStream.entities.values) {
                    if ((e !== ndEntity) && Cesium.defined(e.properties) && e.properties.hasProperty("pfdAltitude")) {
                        const pos = Cesium.defined(e.position) ? e.position.getValue(viewer.clock.currentTime) : undefined;
                        if (Cesium.defined(pos)) {
                            const carto = Cesium.Cartographic.fromCartesian(pos);
                            // Groundspeed and track give the ND's traffic advisory logic
                            // a closure rate; heading stands in when no track is known
                            var trk = getPropertyValue(e, "pfdTrack");
                            if (trk === undefined) {
                                trk = getPropertyValue(e, "pfdHeading");
                            }
                            traffic.push({
                                lat: Cesium.Math.toDegrees(carto.latitude),
                                lon: Cesium.Math.toDegrees(carto.longitude),
                                altFt: getPropertyValue(e, "pfdAltitude"),
                                vs: getPropertyValue(e, "pfdVerticalSpeed"),
                                gs: getPropertyValue(e, "pfdGroundspeed"),
                                trk: trk,
                                icao: getPropertyValue(e, "pfdIcao")
                            });
                        }
                    }
                }
            }
            setNDTraffic(traffic);
        }

        // The DCDU pops up when a datalink message arrives for the selected aircraft,
        // so unlike the PFD and ND it is watched for all the time
        var dcduEntity;
        const dcduLastSeenIds = new Map(); // Entity id -> last dcduMessage id seen

        function updateDCDU() {
            const entity = viewer.selectedEntity;
            if (Cesium.defined(entity) && Cesium.defined(entity.properties) && ((entity.properties.hasProperty("pfdAltitude") || entity.properties.hasProperty("pfdOnSurface")))) {
                dcduEntity = entity;
            }
            if (!Cesium.defined(dcduEntity) || !dcduEntity.properties.hasProperty("dcduMessage")) {
                return;
            }
            const raw = dcduEntity.properties["dcduMessage"].getValue();
            if ((raw === undefined) || (raw.length === 0)) {
                return;
            }
            var message;
            try {
                message = JSON.parse(raw);
            } catch (e) {
                return;
            }
            if (!dcduLastSeenIds.has(dcduEntity.id)) {
                // First sight of this aircraft: note its current message silently, so
                // selecting an aircraft does not pop up a historical message
                dcduLastSeenIds.set(dcduEntity.id, message.id);
                return;
            }
            if (message.id !== dcduLastSeenIds.get(dcduEntity.id)) {
                dcduLastSeenIds.set(dcduEntity.id, message.id);
                showDCDUMessage(message, true);
            }
        }
        setInterval(updateDCDU, 1000);

        function convertToNearest10Foot(metres) {
            return Math.round((metres * 3.28084) / 10.0) * 10.0;
        }

        function updateRadioAlt() {
            // pfdEntity is only maintained while the PFD is shown; ndEntity is kept
            // whenever either panel is, which is when this runs
            const raEntity = Cesium.defined(pfdEntity) ? pfdEntity : ndEntity;
            if (Cesium.defined(raEntity)) {
                pfdRadioAltitudeEntity = raEntity;
                pfdRadioAltPosition = pfdRadioAltitudeEntity.position.getValue(viewer.clock.currentTime, pfdRadioAltPosition);
                if (Cesium.defined(pfdRadioAltPosition)) {
                    const aircraft = Cesium.Cartographic.fromCartesian(pfdRadioAltPosition);
                    // Cesium clips the model to the surface every frame, and our Cesium
                    // records how far above it the model's lowest point ended up: zero on the
                    // ground by construction, the true clearance in the air, whichever of
                    // terrain and tiles is under it. That is the radio altitude, with no
                    // sampling of our own - the fallbacks below are for a model that has not
                    // found a surface yet, and for anything drawn without a model
                    const model = getModelPrimitive(viewer, raEntity);
                    const clearance = Cesium.defined(model) ? model.heightAboveSurface : undefined;
                    if (Cesium.defined(clearance)) {
                        pfdRadioAltitude = convertToNearest10Foot(clearance);
                    } else if (!hasSurfaceHeights()) {
                        // The surface is the ellipsoid, so height above it is the radio altitude
                        pfdRadioAltitude = convertToNearest10Foot(aircraft.height);
                    } else if (googleTileset !== undefined) {
                        // The same ground the aircraft is clipped to, so the two agree - and
                        // sampled with our own items excluded, so it is the ground below the
                        // aircraft rather than the aircraft itself
                        const surface = surfaceHeightAt(aircraft, true);
                        if (Cesium.defined(surface)) {
                            pfdRadioAltitude = convertToNearest10Foot(aircraft.height - surface);
                        }
                    } else {
                        Promise.resolve(
                            Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, [Cesium.Cartographic.clone(aircraft)]),
                        ).then((updatedPositions) => {
                            if (pfdRadioAltitudeEntity === raEntity) {
                                pfdRadioAltitude = convertToNearest10Foot(aircraft.height - updatedPositions[0].height);
                            }
                        }).catch(() => {
                            // A terrain tile fetch can fail transiently - the radio
                            // altitude just keeps its last value until the next sample
                        });
                    }
                }
            }
        }

    </script>
</body>
