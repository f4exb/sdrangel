            - -DCMAKE_INSTALL_PREFIX=/usr
            - -DLIBMBE_INCLUDE_DIR=$CRAFT_STAGE/opt/install/sdrangel/include
            - -DLIBMBE_LIBRARY=$CRAFT_STAGE/opt/install/sdrangel/lib/libmbe.so
            - -DLIBSERIALDV_INCLUDE_DIR=$CRAFT_STAGE/opt/install/sdrangel/include/serialdv
