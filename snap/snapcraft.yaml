        source: https://github.com/f4exb/serialDV.git
        source-type: git
        source-tag: v1.1.5
        cmake-parameters:
            - -DCMAKE_CXX_FLAGS="-std=c++11"
            - -DCMAKE_INSTALL_PREFIX=/opt/install/sdrangel

    dsdcc:
        plugin: cmake
        source: https://github.com/f4exb/dsdcc.git
        source-type: git
        source-tag: v1.9.6
        after: [mbelib, serialdv]
        cmake-parameters:
            - -DUSE_MBELIB=ON
