# Tested with snapcraft 9.0.1
#
# To install snapcraft on Ubuntu assuming snap is already installed:
#
#     sudo snap install snapcraft
#
# If snapcraft fails due to network issues, might need to do:
#
#     sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT && sudo iptables -I DOCKER-USER -o lxdbr0 -j ACCEPT
#
# To build (in sdrangel directory):
#
#     snapcraft pack
#
# To install sdrangel local snap:
#
#     sudo snap install sdrangel_7.22.1_amd64.snap --dangerous
#
# Users appear to need to grant h/w access manually from command line with:
#
#     sudo snap connect sdrangel:raw-usb
#     sudo snap connect sdrangel:hardware-observe
#     sudo snap connect sdrangel:camera
#     sudo snap connect sdrangel:alsa
#     sudo snap connect sdrangel:audio-record
#     sudo snap connect sdrangel:pulseaudio
#     sudo snap connect sdrangel:joystick
#     sudo snap connect sdrangel:removable-media
#     sudo snap connect sdrangel:network-manager
#     sudo snap connect sdrangel:location-observe   (This doesn't seem to be supported)
#     sudo snap connect sdrangel:jack1
#     sudo snap connect sdrangel:avahi-control
#
# To uninstall:
#
#     sudo snap remove sdrangel
#
# We can clean and build a specific package, and then open a shell after the build in the snap filesystem, with:
#
#     snapcraft clean uhd
#     snapcraft stage uhd --shell-after
#
#
# To publish to snap store:
#
#     snapcraft login
#     snapcraft push sdrangel_7.22.1_amd64.snap --release=stable,edge,candidate,beta
#
# Can also manage/promote releases at: https://snapcraft.io/sdrangel/releases


name: sdrangel
base: core26
type: app
adopt-info: sdrangel
summary: SDRangel
title: SDRangel
description: SDRangel is an Open Source Qt 6 / OpenGL 3.0+ SDR and signal analyzer frontend to various hardware. SSE 4.2 required.
confinement: strict
grade: stable
license: GPL-3.0
issues: https://github.com/f4exb/sdrangel/issues
contact: https://github.com/f4exb/sdrangel/issues
source-code: https://github.com/f4exb/sdrangel
website: https://www.sdrangel.org/
icon: cmake/cpack/sdrangel_icon.svg

# SDRangel and several staged frameworks load plugins dynamically, which the
# library linter cannot detect. Continue checking every missing dependency.
lint:
    ignore:
        - unused-library

apps:
    sdrangel:
        command: bin/sdrangel_wrapper.sh
        extensions: [gpu]
        desktop: opt/install/sdrangel/share/applications/sdrangel.desktop
        plugs:
            - network
            - network-bind
            - network-manager
            - desktop
            - desktop-legacy
            - wayland
            - home
            - unity7
            - opengl
            - raw-usb
            - hardware-observe
            - audio-playback
            - audio-record
            - joystick
            - camera
            - browser-support
            - pulseaudio
            - alsa
            - jack1
            - removable-media
            - gsettings
            - location-observe
            - serial-port
            - avahi-control
        environment:
            LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/opt/install/sdrangel/lib/sdrangel:$SNAP/opt/install/sdrangel/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/openblas-pthread
            PIPEWIRE_CONFIG_DIR: $SNAP/usr/share/pipewire
            PIPEWIRE_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
            SPA_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2
            QTWEBENGINE_DISABLE_SANDBOX: "1"
            QTWEBENGINEPROCESS_PATH: $SNAP/usr/lib/qt6/libexec/QtWebEngineProcess
    sdrangelsrv:
        command: opt/install/sdrangel/bin/sdrangelsrv
        plugs:
            - network
            - network-bind
            - network-manager
            - home
            - raw-usb
            - hardware-observe
            - removable-media
        environment:
            LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/opt/install/sdrangel/lib/sdrangel:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/openblas-pthread
            PIPEWIRE_CONFIG_DIR: $SNAP/usr/share/pipewire
            PIPEWIRE_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
            SPA_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2


layout:
    /usr/lib/x86_64-linux-gnu/libproxy:
        bind: $SNAP/usr/lib/x86_64-linux-gnu/libproxy
    /usr/lib/x86_64-linux-gnu/qt6:
        bind: $SNAP/usr/lib/x86_64-linux-gnu/qt6
    /usr/share/qt6:
        bind: $SNAP/usr/share/qt6

parts:

    iconpath:
        after:
            - sdrangel
        plugin: nil
        override-prime: |
            sed -i.bak -e 's|Icon=sdrangel_icon|Icon=/opt/install/sdrangel/share/icons/hicolor/scalable/apps/sdrangel_icon.svg|g' $CRAFT_PRIME/opt/install/sdrangel/share/applications/sdrangel.desktop

    cleanup:
        after:
            - sdrangel
        plugin: nil
        build-snaps:  # List all content-snaps and base snaps you're using here
            - core26
            - mesa-2604
        override-prime: |
            set -eux
            for snap in "core26" ; do  # List all content-snaps and base snaps you're using here
                cd "/snap/$snap/current" && find . -type f,l -exec rm -f "$CRAFT_PRIME/{}" \;
            done

    launcher:
        plugin: dump
        source: snap/local
        organize:
            sdrangel_wrapper.sh: bin/
            locale-gen: bin/

    sdrangel:
        plugin: cmake
        source: https://github.com/f4exb/sdrangel
        source-type: git
        override-pull: |
            craftctl default
            craftctl set version="$(git describe --tags --abbrev=0 | sed 's/v//')"
        after: [apt, libdab, mbelib, serialdv, dsdcc, codec2, sgp4, cspice, inmarsatc, cm265cc, airspy, rtlsdr, pluto, bladerf, hackrf, limesuite, airspyhf, uhd, uhdfpga, soapysdr, soapyremote]
        cmake-parameters:
            - -DDEBUG_OUTPUT=OFF
            - -DBUILD_TYPE=RELEASE
            - -DENABLE_QT6=ON
            - -DRX_SAMPLE_24BIT=ON
            - -DCMAKE_INSTALL_PREFIX=/opt/install/sdrangel
            - -DMIRISDR_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DAIRSPY_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DAIRSPYHF_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DBLADERF_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DHACKRF_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DRTLSDR_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DLIMESUITE_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DIIO_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DPERSEUS_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DXTRX_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DSOAPYSDR_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DUHD_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DAPT_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DCM256CC_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DDSDCC_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DSERIALDV_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DMBE_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DCODEC2_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DSGP4_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DCSPICE_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DINMARSATC_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DLIBSIGMF_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DDAB_DIR=$CRAFT_STAGE/opt/install/sdrangel
            - -DARCH_OPT=nehalem
        build-packages:
            - libfftw3-dev
            - libusb-1.0-0-dev
