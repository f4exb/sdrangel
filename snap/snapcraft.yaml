        source: https://github.com/srcejon/dab-cmdline
        source-type: git
        source-branch: msvc
        source-subdir: library
        cmake-parameters:
            - -DCMAKE_INSTALL_PREFIX=/opt/install/sdrangel

    mbelib:
        plugin: cmake
        source: https://github.com/srcejon/mbelib.git
        source-type: git
        source-branch: lib
        cmake-parameters:
