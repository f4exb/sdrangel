SoapySDRInputSettings:
  description: SoapySDR
  properties:
    title:
      type: string
      description: "User-visible title."
    centerFrequency:
      type: integer
      format: int64
      description: "Device center frequency in Hz."
    LOppmTenths:
      type: integer
      description: "Local-oscillator correction in tenths of a part per million."
    devSampleRate:
      type: integer
      description: "Device I/Q sample rate in samples per second before software decimation or interpolation."
    log2Decim:
      type: integer
      description: "Base-2 exponent of the software decimation factor; the output sample rate is divided by 2^log2Decim."
    fcPos:
      type: integer
      description: "Position of the decimated passband relative to the device center frequency."
    softDCCorrection:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    softIQCorrection:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    transverterMode:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    transverterDeltaFrequency:
      type: integer
      format: int64
      description: "Frequency translation applied in transverter mode in Hz."
    iqOrder:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        IQ samples order
          * 0 - Q then I (swapped)
          * 1 - I then Q (straight)
    antenna:
      type: string
      description: "Antenna setting for Soapy sdr input."
    bandwidth:
      type: integer
      description: "Bandwidth in Hz."
    tunableElements:
      type: array
      description: "List of tunable elements."
      items:
        $ref: "#/definitions/ArgValue"
    globalGain:
      type: integer
      description: "Overall device gain setting."
    individualGains:
      type: array
      description: "List of individual gains."
      items:
        $ref: "#/definitions/ArgValue"
    autoGain:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    autoDCCorrection:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    autoIQCorrection:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    dcCorrection:
      $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/Complex"
      description: "Enable DC-offset correction (1 enabled, 0 disabled)."
    iqCorrection:
      $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/Complex"
      description: "Enable I/Q imbalance correction (1 enabled, 0 disabled)."
    streamArgSettings:
      type: array
      description: "List of stream arg settings."
      items:
        $ref: "#/definitions/ArgValue"
    deviceArgSettings:
      type: array
      description: "List of device arg settings."
      items:
        $ref: "#/definitions/ArgValue"
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."

