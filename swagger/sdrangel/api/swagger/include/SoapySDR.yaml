SoapySDRReport:
  description: SoapySDR
  properties:
    deviceSettingsArgs:
      type: array
      description: "List of device settings args."
      items:
        $ref: "#/definitions/ArgInfo"
    streamSettingsArgs:
      type: array
      description: "List of stream settings args."
      items:
        $ref: "#/definitions/ArgInfo"
    hasDCAutoCorrection:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    hasDCOffsetValue:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    hasIQBalanceValue:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    hasFrequencyCorrectionValue:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    antennas:
      type: array
      description: "List of antennas."
      items:
        type: string
    hasAGC:
      description: boolean not zero for true
      type: integer
      minimum: 0
      maximum: 1
    gainRange:
      $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/RangeFloat"
      description: "Gain range data for Soapy sdr."
    gainSettings:
      type: array
      description: "List of gain settings."
      items:
        $ref: "#/definitions/SoapySDRGainSetting"
    frequencySettings:
      type: array
      description: "List of frequency settings."
      items:
        $ref: "#/definitions/SoapySDRFrequencySetting"
    frequencySettingsArgs:
      type: array
      description: "List of frequency settings args."
      items:
        $ref: "#/definitions/ArgInfo"
    ratesRanges:
      type: array
      description: "List of rates ranges."
      items:
        $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/RangeFloat"
    bandwidthsRanges:
      type: array
      description: "List of bandwidths ranges."
      items:
        $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/RangeFloat"

definitions:

  SoapySDRGainSetting:
    description: A named gain setting specified by its range
    properties:
      name:
        type: string
        description: "Name."
      range:
        $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/RangeFloat"
        description: "Range configuration for Definitions."

  SoapySDRFrequencySetting:
    description: A named frequency setting specified by a range list
    properties:
      name:
        type: string
        description: "Name."
      ranges:
        type: array
        description: "List of ranges."
        items:
          $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/RangeFloat"

  ArgValue:
    description: Generic argument value
    properties:
      key:
        type: string
        description: "Key for Definitions."
      valueType:
        type: string
        description: "Value type for Definitions."
        enum: [bool, int, float, string]
      valueString:
        type: string
        description: "Value string for Definitions."

  ArgInfo:
    description: Generic argument information
    properties:
      key:
        type: string
        description: "Key for Definitions."
      valueType:
        type: string
        description: "Value type for Definitions."
        enum: [bool, int, float, string]
      valueString:
        type: string
        description: "Value string for Definitions."
      name:
        type: string
        description: "Name."
      description:
        type: string
        description: "Human-readable description."
      units:
        type: string
        description: "Units for Definitions."
      range:
        $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/RangeFloat"
        description: "Range configuration for Definitions."
      valueOptions:
        type: array
        description: "List of value options."
        items:
          type: string
      optionNames:
        type: array
        description: "List of option names."
        items:
          type: string
