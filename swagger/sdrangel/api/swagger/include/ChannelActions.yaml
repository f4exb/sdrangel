ChannelActions:
  description: Base channel actions. Only the channel actions corresponding to the channel specified in the channelType field is or should be present.
  discriminator: channelType
  required:
    - channelType
    - direction
  properties:
    channelType:
      description: Channel type code
      type: string
    direction:
      description: 0 for Rx only, 1 for Tx only or 2 for any number and direction (default 0)
      type: integer
      minimum: 0
      maximum: 2
    originatorDeviceSetIndex:
      description: Optional for reverse API. This is the device set index from where the message comes from.
      type: integer
    originatorChannelIndex:
      description: Optional for reverse API. This is the channel index from where the message comes from.
      type: integer
    AISModActions:
      $ref: "http://swgserver:8081/api/swagger/include/AISMod.yaml#/AISModActions"
      description: "AIS mod actions configuration for Channel."
    APTDemodActions:
      $ref: "http://swgserver:8081/api/swagger/include/APTDemod.yaml#/APTDemodActions"
      description: "Apt demod actions configuration for Channel."
    FileSinkActions:
      $ref: "http://swgserver:8081/api/swagger/include/FileSink.yaml#/FileSinkActions"
      description: "File sink actions configuration for Channel."
    FileSourceActions:
      $ref: "http://swgserver:8081/api/swagger/include/FileSource.yaml#/FileSourceActions"
      description: "File source actions configuration for Channel."
    FreqScannerActions:
      $ref: "http://swgserver:8081/api/swagger/include/FreqScanner.yaml#/FreqScannerActions"
      description: "Freq scanner actions configuration for Channel."
    IEEE_802_15_4_ModActions:
      $ref: "http://swgserver:8081/api/swagger/include/IEEE_802_15_4_Mod.yaml#/IEEE_802_15_4_ModActions"
      description: "Ieee 802 15 4 mod actions configuration for Channel."
    MeshcoreModActions:
      $ref: "http://swgserver:8081/api/swagger/include/MeshcoreMod.yaml#/MeshcoreModActions"
      description: "Meshcore mod actions configuration for Channel."
    PacketModActions:
      $ref: "http://swgserver:8081/api/swagger/include/PacketMod.yaml#/PacketModActions"
      description: "Packet mod actions configuration for Channel."
    PSK31ModActions:
      $ref: "http://swgserver:8081/api/swagger/include/PSK31Mod.yaml#/PSK31ModActions"
      description: "Psk31 mod actions configuration for Channel."
    RadioAstronomyActions:
      $ref: "http://swgserver:8081/api/swagger/include/RadioAstronomy.yaml#/RadioAstronomyActions"
      description: "Radio astronomy actions configuration for Channel."
    RTTYModActions:
      $ref: "http://swgserver:8081/api/swagger/include/RTTYMod.yaml#/RTTYModActions"
      description: "Rtty mod actions configuration for Channel."
    SigMFFileSinkActions:
      $ref: "http://swgserver:8081/api/swagger/include/SigMFFileSink.yaml#/SigMFFileSinkActions"
      description: "Sig mf file sink actions configuration for Channel."
