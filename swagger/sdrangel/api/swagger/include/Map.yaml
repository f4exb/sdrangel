MapSettings:
  description: Map
  properties:
    displayNames:
      description: Display object names on the map (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    map2DEnabled:
      description: Display the 2D map pane (1 for yes, 0 for no). Disable this while keeping map3DEnabled enabled to show only the 3D map.
      type: integer
      minimum: 0
      maximum: 1
    map3DEnabled:
      description: Display the 3D map pane (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    mapProvider:
      description: 2D map provider identifier.
      type: string
    mapType:
      description: Selected 2D map type, for example Street Map or Satellite Map.
      type: string
    osmURL:
      description: Custom OpenStreetMap tile-server URL.
      type: string
    mapBoxStyles:
      description: Mapbox style identifier used by the selected 2D provider.
      type: string
    displaySelectedGroundTracks:
      description: Display ground tracks for selected items (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displayAllGroundTracks:
      description: Display ground tracks for all items (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    terrain:
      description: "Terrain used for 3D map (E.g: 'Ellipsoid' or 'Cesium World Terrain')"
      type: string
    buildings:
      description: 3D buildings layer, for example None or Cesium OSM Buildings.
      type: string
    sunLightEnabled:
      description: Light the globe from the Sun's direction (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    lightIntensity:
      description: Camera light intensity used by the 3D map.
      type: number
      format: float
      minimum: 0
    eciCamera:
      description: Use an ECI rather than ECEF camera frame (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    fxaa:
      description: Enable fast approximate anti-aliasing (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    msaa:
      description: Multisample anti-aliasing level.
      type: integer
      minimum: 1
      maximum: 8
    terrainLighting:
      description: Enable terrain lighting (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    water:
      description: Enable water effects (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    hdr:
      description: Enable high dynamic range rendering (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    fog:
      description: Enable atmospheric fog (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    fps:
      description: Display the 3D map frame rate (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displayMUF:
      description: Display maximum-usable-frequency contours (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displayfoF2:
      description: Display F2 critical-frequency contours (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displayRain:
      description: Display weather-radar rain and snow overlay (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displayClouds:
      description: Display satellite infrared cloud overlay (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displaySeaMarks:
      description: Display sea marks (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displayRailways:
      description: Display railways (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displayNASAGlobalImagery:
      description: Display NASA GIBS imagery (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    nasaGlobalImageryIdentifier:
      description: NASA GIBS imagery-layer identifier.
      type: string
    nasaGlobalImageryOpacity:
      description: NASA GIBS imagery opacity as a percentage.
      type: integer
      minimum: 0
      maximum: 100
    displayAurora:
      description: Display aurora-probability overlay (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displayMagDec:
      description: Display magnetic-declination contours (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displayMaidenheadGrid:
      description: Display Maidenhead grid (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    displayPFD:
      description: Display the aircraft primary-flight display (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    viewFirstPerson:
      description: Use first-person 3D map view (1 for yes, 0 for no).
      type: integer
      minimum: 0
      maximum: 1
    defaultImagery:
      description: Default imagery layer for the 3D map.
      type: string
    mapCenterLatitude:
      description: "Latitude in decimal degrees (North positive) the 2D map is centred on"
      type: number
      format: float
    mapCenterLongitude:
      description: "Longitude in decimal degrees (East positive) the 2D map is centred on"
      type: number
      format: float
    mapZoomLevel:
      description: "Zoom level of the 2D map. Negative means nothing has been saved, in which case the map opens centred on My Position"
      type: number
      format: float
    title:
      type: string
      description: "User-visible title."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIFeatureSetIndex:
      type: integer
      description: "Feature-set index used by the reverse API peer."
    reverseAPIFeatureIndex:
      type: integer
      description: "Feature index used by the reverse API peer."
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

MapReport:
  description: Map
  properties:
    dateTime:
      description: "Current date and time being displayed by 3D map"
      type: string

MapActions:
  description: Map
  properties:
    find:
      description: "The name of the item or the location to centre the map on"
      type: string
    setDateTime:
      description: "Date and time to set for the map (ISO 8601 extended format)"
      type: string

MapItem:
  description: "An item to draw on the map. Set image to an empty string to remove item from the map."
  required:
    - name
  properties:
    name:
      description: "A name for the item"
      type: string
    group:
      description: "Which of the Map's item settings groups this item belongs to - its
        colour, labels, minimum zoom and so on. Optional: when it is not given the item
        takes the group named after the plugin that sent it!"
      type: string
    image:
      description: "Filename or URL of image to draw on the 2D map"
      type: string
    imageRotation:
      description: "Angle to rotate the image by"
      type: integer
      default: 0
    text:
      description: "Text to draw on the map when item is selected"
      type: string
    latitude:
      description: "Latitude in decimal degrees, positive to the North"
      type: number
      format: float
      minimum: -90
      maximum: 90
    longitude:
      description: "Longitude in decimal degrees, positive to the East"
      type: number
      format: float
      minimum: -180
      maximum: 180
    altitude:
      description: "Altitude / height above sea level in metres"
      type: number
      format: float
    fixedPosition:
      description: "Indicates whether position of item is constant with time (0 - variable, 1 - fixed)"
      type: integer
      minimum: 0
      maximum: 1
    positionDateTime:
      description: "Date and time at this position (ISO 8601 extended format)"
      type: string
    altitudeDateTime:
      description: "Date and time at this altitude, if different from positionDateTime (ISO 8601 extended format)"
      type: string
    track:
      description: "Track/path the item has taken"
      type: array
      items:
        $ref: "http://swgserver:8081/api/swagger/include/Map.yaml#/MapCoordinate"
    predictedTrack:
      description: "Track/path the item is predicted to take"
      type: array
      items:
        $ref: "http://swgserver:8081/api/swagger/include/Map.yaml#/MapCoordinate"
    model:
      description: "3D .glb/*.gltf model for displaying on 3D map"
      type: string
    orientation:
      description: "How to orientate the model (0 - Along direction of motion, 1 - Use heading, pitch and roll)"
      type: integer
      minimum: 0
      maximum: 1
    heading:
      description: "Heading angle, in decimal degrees clockwise from North"
      type: number
      format: float
    pitch:
      description: "Pitch angle, in decimal degrees"
      type: number
      format: float
    roll:
      description: "Roll angle, in decimal degrees"
      type: number
      format: float
    orientationDateTime:
      description: "Date and time at this orientation (ISO 8601 extended format)"
      type: string
    label:
      description: "Label for the model"
      type: string
    labelAltitudeOffset:
      description: "Vertical offset to position label at"
      type: number
      format: float
    labelDateTime:
      description: "Date and time from when this label applies (ISO 8601 extended format). Leave empty if label should apply for all time."
      type: string
    modelAltitudeOffset:
      description: "Vertical offset to adjust model by to prevent it from going underground when altitude is 0"
      type: number
      format: float
    altitudeReference:
      description: "0 - NONE (Absolute), 1 - CLAMP_TO_GROUND, 2 - RELATIVE_TO_GROUND, 3 - CLIP_TO_GROUND."
      type: integer
      minimum: 0
      maximum: 3
    animations:
      description: "Animations to play"
      type: array
      items:
        $ref: "http://swgserver:8081/api/swagger/include/Map.yaml#/MapAnimation"
    type:
      description: "(0 - Map Item, 1 - Image Tile, 2 - Polygon, 3 - Polyline)"
      type: integer
      minimum: 0
      maximum: 3
    imageTileWest:
      type: number
      format: float
      description: "Image tile west for Map item."
    imageTileSouth:
      type: number
      format: float
      description: "Image tile south for Map item."
    imageTileEast:
      type: number
      format: float
      description: "Image tile east for Map item."
    imageTileNorth:
      type: number
      format: float
      description: "Image tile north for Map item."
    imageZoomLevel:
      description: "For 2D map"
      type: number
      format: float
    coordinates:
      description: "Polygon/polyline coordinates"
      type: array
      items:
        $ref: "http://swgserver:8081/api/swagger/include/Map.yaml#/MapCoordinate"
    extrudedHeight:
      description: "Extruded height (from surface) for polygons"
      type: number
      format: float
    availableFrom:
      description: "Date and time at which the item should first appear on 3D map"
      type: string
    availableUntil:
      description: "Date and time until after which this item should no longer appear on 3D map"
      type: string
    colorValid:
      description: "0 - Use default color, 1 - Use specified color"
      type: integer
      minimum: 0
      maximum: 1
    color:
      description: "RGBA for polygon and polyline"
      type: integer
    aircraftState:
      $ref: "http://swgserver:8081/api/swagger/include/Map.yaml#/MapAircraftState"
      description: "Current states of aircraft tracked by the ADS-B demodulator."
    loopSound:
      description: "Sound to loop while the item is on the 3D map, spatially located at the item. Either the name of an engine sound set (cfm, v2500, 777, 787, A380, jet), whose -n1/-n2/-idle recordings the map layers and mixes by phase of flight, or an audio file name from the Map's audio directory (e.g. helicopter.wav). Empty for none"
      type: string

MapAnimation:
  description: "Animation to play in the model on the 3D map"
  properties:
    name:
      description: "Name of animation to play (As in .glb/.glTF file)"
      type: string
    reverse:
      description: "(0 - Forward, 1 - Reverse)"
      type: integer
      minimum: 0
      maximum: 1
    loop:
      description: "(0 - Play once, 1 - Play in loop)"
      type: integer
      minimum: 0
      maximum: 1
    startDateTime:
      description: "Date and time to start playing this animation (ISO 8601 extended format)"
      type: string
    startOffset:
      description: "Fractional [0..1] offset in to animations timeline to start animation at"
      type: number
      format: float
      default: 0.0
    multiplier:
      description: "Speed multiplier for animation. >1 plays faster"
      type: number
      format: float
      default: 1.0
    duration:
      description: "Time in seconds to play animation for. 0 to play whole animation"
      type: number
      format: float
      default: 0.0
    stop:
      description: "Stop a looped animation from playing"
      type: integer
    sound:
      description: "Audio file to play when the animation starts (from the Map's audio directory, e.g. A320_gear.wav), spatially located at the map item. Empty for none"
      type: string

MapCoordinate:
  description: "A map coordinate"
  properties:
    latitude:
      description: "Latitude in decimal degrees, positive to the North"
      type: number
      format: float
      minimum: -90
      maximum: 90
    longitude:
      description: "Longitude in decimal degrees, positive to the East"
      type: number
      format: float
      minimum: -180
      maximum: 180
    altitude:
      description: "Altitude / height above sea level in metres"
      type: number
      format: float
    dateTime:
      description: "Date and time at this coordinate (ISO 8601 extended format)"
      type: string

MapAircraftState:
  description: "Aircraft state for PFD/ND"
  properties:
    callsign:
      type: string
      description: "Radio callsign."
    aircraftType:
      type: string
      description: "Aircraft type for Map aircraft state."
    onSurface:
      type: integer
      description: "On surface for Map aircraft state."
    airspeed:
      description: "Indicated airspeed in knots"
      type: number
      format: float
    airspeedDateTime:
      description: "Date and time at this indicated airspeed (ISO 8601 extended format)"
      type: string
    trueAirspeed:
      description: "True airspeed in knots"
      type: number
      format: float
    groundspeed:
      description: "Ground speed in knots"
      type: number
      format: float
    mach:
      type: number
      format: float
      description: "Mach for Map aircraft state."
    altitude:
      description: "Barometric altitude in feet"
      type: number
      format: float
    altitudeDateTime:
      description: "Date and time at this altitude (ISO 8601 extended format)"
      type: string
    qnh:
      description: "QNH in hPA"
      type: number
      format: float
    verticalSpeed:
      description: "feet/m"
      type: number
      format: float      
    verticalSpeedDateTime:
      description: "Date and time at this vertical speed (ISO 8601 extended format)"
      type: string
    heading:
      description: "Degrees magnetic"
      type: number
      format: float
    track:
      description: "Degrees true"
      type: number
      format: float
    selectedAirspeed:
      type: number
      format: float
      description: "Selected airspeed for Map aircraft state."
    selectedAltitude:
      type: number
      format: float
      description: "Selected altitude for Map aircraft state."
    selectedHeading:
      type: number
      format: float
      description: "Selected heading for Map aircraft state."
    autopilot:
      description: "-1 unknown, 0 off, 1 on"
      type: integer
    verticalMode:
      description: "0 unknown, 1 VNAV, ALT HOLD, APP (G/S)"
      type: integer
    lateralMode:
      description: "0 unknown, 1 LNAV, APP (LOC)"
      type: integer
    tcasMode:
      description: "-1 unknown, 0 Off, 1 TA, 2 TA/RA"
      type: integer  
    windSpeed:
      type: number
      format: float
      description: "Wind speed for Map aircraft state."
    windDirection:
      type: number
      format: float
      description: "Wind direction for Map aircraft state."
    staticAirTemperature:
      type: number
      format: float
      description: "Static air temperature for Map aircraft state."
    flightPlan:
      $ref: "http://swgserver:8081/api/swagger/include/Map.yaml#/MapFlightPlan"
    datalinkMessage:
      $ref: "http://swgserver:8081/api/swagger/include/Map.yaml#/MapDatalinkMessage"

MapDatalinkMessage:
  description: "Datalink ATC message (CPDLC / pre-departure clearance / oceanic clearance), shown on the Map's DCDU"
  properties:
    id:
      description: "Sequence number, incremented for each message for an aircraft"
      type: integer
    received:
      description: "Date and time the message was received (ISO 8601 extended format)"
      type: string
    uplink:
      description: "1 ground to air, 0 air to ground"
      type: integer
    station:
      description: "Ground station / ATC facility, e.g. EDDS. Empty if unknown"
      type: string
    text:
      type: string

MapFlightPlan:
  description: "Flight plan / cleared route, drawn on the Map's ND (Navigation Display)"
  properties:
    departure:
      description: "ICAO of departure airport"
      type: string
    arrival:
      description: "ICAO of arrival airport"
      type: string
    arrivalRunway:
      description: "Arrival runway, e.g. 27R. Empty if unknown"
      type: string
    approach:
      description: "Arrival approach procedure as filed, e.g. ILSY01R. Empty if unknown"
      type: string
    activeWaypoint:
      description: "Index in to waypoints of the waypoint being flown to, -1 if unknown"
      type: integer
    waypoints:
      type: array
      items:
        $ref: "http://swgserver:8081/api/swagger/include/Map.yaml#/MapRouteWaypoint"

MapRouteWaypoint:
  description: "A waypoint of a flight plan, for the Map's ND (Navigation Display)"
  properties:
    name:
      type: string
    latitude:
      description: "Latitude in decimal degrees, positive to the North. NaN if the waypoint could not be placed"
      type: number
      format: float
    longitude:
      description: "Longitude in decimal degrees, positive to the East. NaN if the waypoint could not be placed"
      type: number
      format: float
    altitude:
      description: "Expected or constrained altitude at this waypoint in feet. NaN if unknown"
      type: number
      format: float
    eta:
      description: "Estimated time over this waypoint (ISO 8601 extended format). Empty if unknown"
      type: string

