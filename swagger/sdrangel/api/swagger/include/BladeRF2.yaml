BladeRF2InputSettings:
  description: BladeRF2
  properties:
    title:
      type: string
      description: "User-visible title."
    centerFrequency:
      type: integer
      format: int64
      description: "Device center frequency in Hz."
    LOppmTenths:
      type: integer
      description: "Local-oscillator correction in tenths of a part per million."
    devSampleRate:
      type: integer
      description: "Device I/Q sample rate in samples per second before software decimation or interpolation."
    bandwidth:
      type: integer
      description: "Bandwidth in Hz."
    gainMode:
      type: integer
      description: "Gain-control mode selection."
    globalGain:
      type: integer
      description: "Overall device gain setting."
    biasTee:
      type: integer
      description: "Enable the antenna bias tee (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    log2Decim:
      type: integer
      description: "Base-2 exponent of the software decimation factor; the output sample rate is divided by 2^log2Decim."
    fcPos:
      type: integer
      description: "Position of the decimated passband relative to the device center frequency."
    dcBlock:
      type: integer
      description: "Enable DSP DC-offset correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    iqCorrection:
      type: integer
      description: "Enable I/Q imbalance correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    transverterMode:
      type: integer
      description: "Enable transverter frequency translation (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    transverterDeltaFrequency:
      type: integer
      format: int64
      description: "Frequency translation applied in transverter mode in Hz."
    iqOrder:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        IQ samples order
          * 0 - Q then I (swapped)
          * 1 - I then Q (straight)
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."

BladeRF2InputReport:
  description: BladeRF2
  properties:
    frequencyRange:
      $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/FrequencyRange"
      description: "Frequency range data for Blade rf2 input."
    sampleRateRange:
      $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/Range"
      description: "Sample rate range data for Blade rf2 input."
    bandwidthRange:
      $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/Range"
      description: "Bandwidth range data for Blade rf2 input."
    globalGainRange:
      $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/Range"
      description: "Global gain range data for Blade rf2 input."
    gainModes:
      type: array
      description: "List of gain modes."
      items:
        $ref: "http://swgserver:8081/api/swagger/include/Structs.yaml#/NamedEnum"

