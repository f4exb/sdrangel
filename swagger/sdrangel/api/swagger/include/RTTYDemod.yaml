RTTYDemodSettings:
  description: ACARSDemod
  properties:
    inputFrequencyOffset:
      type: integer
      format: int64
      description: "Channel frequency offset from the device center frequency in Hz."
    rfBandwidth:
      type: number
      format: float
      description: "RF bandwidth in Hz."
    baudRate:
      type: number
      format: float
      description: "Serial-port baud rate in bits per second."
    frequencyShift:
      type: integer
      description: "Frequency shift in Hz."
    udpEnabled:
      description: "Whether to forward received messages to specified UDP port"
      type: integer
      minimum: 0
      maximum: 1
    udpAddress:
      description: "UDP address to forward received messages to"
      type: string
    udpPort:
      description: "UDP port to forward received messages to"
      type: integer
      minimum: 1
      maximum: 65535
    characterSet:
      type: integer
      description: "Character set setting for Rtty demod."
    suppressCRLF:
      type: integer
      description: "Suppress crlf setting for Rtty demod."
    unshiftOnSpace:
      type: integer
      description: "Enable unshift on space (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    msbFirst:
      type: integer
      description: "Enable msb first (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    spaceHigh:
      type: integer
      description: "Enable space high (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    squelch:
      type: integer
      description: "Squelch threshold in dB."
    logFilename:
      type: string
      description: "Log file name or path."
    logEnabled:
      type: integer
      description: "Enable logging to the configured file (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    scopeConfig:
      $ref: "http://swgserver:8081/api/swagger/include/GLScope.yaml#/GLScope"
      description: "Oscilloscope-display configuration."
    channelMarker:
      $ref: "http://swgserver:8081/api/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

RTTYDemodReport:
  description: ACARSDemod
  properties:
    channelPowerDB:
      description: power received in channel (dB)
      type: number
      format: float
    channelSampleRate:
      type: integer
      description: "Effective sample rate delivered to the channel in samples per second."
