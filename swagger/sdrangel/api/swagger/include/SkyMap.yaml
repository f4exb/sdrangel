SkyMapSettings:
  description: Sky Map
  properties:
    displayNames:
      description: "Display names on the sky map (1 for yes, 0 for no)"
      type: integer
      minimum: 0
      maximum: 1
    displayConstellations:
      description: "Display constellations on the sky map (1 for yes, 0 for no)"
      type: integer
      minimum: 0
      maximum: 1
    displayReticle:
      description: "Display reticle on the sky map (1 for yes, 0 for no)"
      type: integer
      minimum: 0
      maximum: 1
    displayGrid:
      description: "Display grid on the sky map (1 for yes, 0 for no)"
      type: integer
      minimum: 0
      maximum: 1
    displayAntennaFoV:
      description: "Display antenna field-of-view on the sky map (1 for yes, 0 for no)"
      type: integer      
      minimum: 0
      maximum: 1
    map:
      description: "WWT, ESASky or Aladin"
      type: string
    background:
      description: "Name of background image set"
      type: string
    projection:
      type: string
      description: "Projection setting for Sky map."
    source:
      description: "Channel or Feature plugin to get target from"
      type: string
    track:
      description: "Whether to track the specified source plugin"
      type: integer
    latitude:
      description: "Latitude in decimal degrees (North positive) of observation/antenna location"
      type: number
      format: float
      minimum: -90
      maximum: 90
    longitude:
      description: "Longitude in decimal degrees (East positive) of observation/antenna location"
      type: number
      format: float
      minimum: -180
      maximum: 180
    altitude:
      description: "Altitude in metres of observation/antenna location"
      type: number
      format: float
    hpbw:
      description: "Antenna half-power beam width in degrees"
      type: number
      format: float
    useMyPosition:
      description: "Use My Position instead of latitude/longitude settings"
      type: number
      format: float
      minimum: 0
      maximum: 1
    title:
      type: string
      description: "User-visible title."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIFeatureSetIndex:
      type: integer
      description: "Feature-set index used by the reverse API peer."
    reverseAPIFeatureIndex:
      type: integer
      description: "Feature index used by the reverse API peer."
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

SkyMapReport:
  description: Sky Map
  properties:
    dateTime:
      description: "Current date and time being used for sky map"
      type: string
    ra:
      description: "Right ascension of target (In decimal hours, J2000)"
      type: number
      format: float
    dec:
      description: "Declination of target (In decimal degrees, J2000)"
      type: number
      format: float
    latitude:
      description: "Latitude in decimal degrees (North positive) of observation/antenna location"
      type: number
      format: float
      minimum: -90
      maximum: 90
    longitude:
      description: "Longitude in decimal degrees (East positive) of observation/antenna location"
      type: number
      format: float
      minimum: -180
      maximum: 180
    altitude:
      description: "Altitude in metres of observation/antenna location"
      type: number
      format: float
    azimuth:
      description: "The azimuth angle in degrees to the target"
      type: number
      format: float
    elevation:
      description: "The elevation angle in degrees to the target"
      type: number
      format: float
    fov:
      description: "Current field-of-view in degrees"
      type: number
      format: float

SkyMapActions:
  description: Sky Map
  properties:
    find:
      description: "The name of the object or the coordinates to centre the sky map on"
      type: string

SkyMapTarget:
  description: "Sky Map target. Sent by other plugins to skymap.target message queue."
  properties:
    ra:
      description: "Right ascension of target (In decimal hours, J2000)"
      type: number
      format: float
    dec:
      description: "Declination of target (In decimal degrees, J2000)"
      type: number
      format: float
    latitude:
      description: "Latitude in decimal degrees (North positive) of observation/antenna location"
      type: number
      format: float
      minimum: -90
      maximum: 90
    longitude:
      description: "Longitude in decimal degrees (East positive) of observation/antenna location"
      type: number
      format: float
      minimum: -180
      maximum: 180
    altitude:
      description: "Altitude in metres of observation/antenna location"
      type: number
      format: float
    hpbw:
      description: "Antenna half-power beam width in degrees"
      type: number
      format: float
    dateTime:
      description: "Date and time of observation. ISO 8601 extended format: yyyy-MM-ddTHH:mm:ss with Z suffix for UTC. Empty string for current time."
      type: string
