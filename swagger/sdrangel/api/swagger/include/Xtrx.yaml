XtrxMIMOSettings:
  description: XTRX
  properties:
    title:
      type: string
      description: "User-visible title."
    extClock:
      description: Boolean 1 if external clock source else 0
      type: integer
      minimum: 0
      maximum: 1
    extClockFreq:
      description: Frequency (Hz) of external clock source
      type: integer
    gpioDir:
      description: 8 bit GPIO pin direction LSB first 0 input, 1 output
      type: integer
    gpioPins:
      description: 8 bit GPIO pins to write LSB first
      type: integer
    useReverseAPI:
      description: Boolean 1 use 0 do not use reverse API
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      description: IPv4 address
      type: string
    reverseAPIPort:
      description: Network port from 1024 to 65535
      type: integer
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    rxDevSampleRate:
      type: integer
      description: "Receive dev sample rate in samples per second."
    log2HardDecim:
      description: 0 is automatic then 1 to 6 is log2 of hardware decimation
      type: integer
    log2SoftDecim:
      description: log2 of software decimation factor from 0 to 6
      type: integer
    rxCenterFrequency:
      type: integer
      format: int64
      description: "Receive center frequency in Hz."
    dcBlock:
      description: Software DC blocking (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    iqCorrection:
      description: Software IQ imbalance correction (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    ncoEnableRx:
      description: Enable TSP NCO Rx on both channels and mixing (1 for yes, 0 for no)
      type: integer
    ncoFrequencyRx:
      description: Rx frequency shift from LO for both channels
      type: integer
    antennaPathRx:
      type: integer
      minimum: 0
      maximum: 2
      description: >
        Antenna selected (enum value from XTRXMIMOSettings::RxAntenna):
            * 0 - RXANT_LO low range
            * 1 - RXANT_WI wide range
            * 2 - RXANT_HI high range
    iqOrder:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        IQ samples order
          * 0 - Q then I (swapped)
          * 1 - I then Q (straight)
    lpfBWRx0:
      description: LMS analog lowpass filter bandwidth (Hz) for Rx channel 0
      type: integer
    gainRx0:
      description: Optimally distributed gain (dB) for Rx channel 0
      type: integer
    gainModeRx0:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Gain mode (XTRXMIMOSettings::GainMode) for Rx channel 0:
            * 0 - GAIN_AUTO automatic
            * 1 - GAIN_MANUAL manual
    lnaGainRx0:
      description: Manual LNA gain (dB) for Rx channel 0
      type: integer
    tiaGainRx0:
      description: Manual TIA gain (dB) for Rx channel 0
      type: integer
    pgaGainRx0:
      description: Manual PGA gain (dB) for Rx channel 0
      type: integer
    pwrmodeRx0:
      type: integer
      description: "Pwrmode rx0 setting for Xtrx MIMO."
    lpfBWRx1:
      description: LMS analog lowpass filter bandwidth (Hz) for Rx channel 1
      type: integer
    gainRx1:
      description: Optimally distributed gain (dB) for Rx channel 1
      type: integer
    gainModeRx1:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Gain mode (XTRXMIMOSettings::GainMode) for Rx channel 1:
            * 0 - GAIN_AUTO automatic
            * 1 - GAIN_MANUAL manual
    lnaGainRx1:
      description: Manual LNA gain (dB) for Rx channel 1
      type: integer
    tiaGainRx1:
      description: Manual TIA gain (dB) for Rx channel 1
      type: integer
    pgaGainRx1:
      description: Manual PGA gain (dB) for Rx channel 1
      type: integer
    pwrmodeRx1:
      type: integer
      description: "Pwrmode rx1 setting for Xtrx MIMO."
    txDevSampleRate:
      type: integer
      description: "Transmit dev sample rate in samples per second."
    log2HardInterp:
      description: 0 is automatic then 1 to 6 is log2 of hardware interpolation
      type: integer
    log2SoftInterp:
      description: log2 of software interpolation factor from 0 to 6
      type: integer
    txCenterFrequency:
      type: integer
      format: int64
      description: "Transmit center frequency in Hz."
    ncoEnableTx:
      description: Enable TSP NCO Tx on both channels and mixing (1 for yes, 0 for no)
      type: integer
    ncoFrequencyTx:
      description: Tx frequency shift from LO for both channels
      type: integer
    antennaPathTx:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Antenna selected (enum value from XTRXMIMOSettings::TxAntenna):
            * 0 - TXANT_HI high range
            * 1 - TXANT_WI wide range
    lpfBWTx0:
      description: LMS analog lowpass filter bandwidth (Hz) for Tx channel 0
      type: integer
    gainTx0:
      description: Optimally distributed gain (dB) for Tx channel 0
      type: integer
    pwrmodeTx0:
      type: integer
      description: "Pwrmode tx0 setting for Xtrx MIMO."
    lpfBWTx1:
      description: LMS analog lowpass filter bandwidth (Hz) for Tx channel 1
      type: integer
    gainTx1:
      description: Optimally distributed gain (dB) for Tx channel 1
      type: integer
    pwrmodeTx1:
      type: integer
      description: "Pwrmode tx1 setting for Xtrx MIMO."

XtrxMIMOReport:
  description: XTRX
  properties:
    success:
      description: 1 if info was successfully retrieved else 0
      type: integer
    fifoSize:
      type: integer
      description: "FIFO capacity in samples."
    fifoFillRx:
      type: integer
      description: "Current receive FIFO fill level."
    fifoFillTx:
      type: integer
      description: "Current transmit FIFO fill level."
    temperature:
      type: number
      format: float
      description: "Reported device temperature."
    gpsLock:
      description: 1 if GPSDO is locked else 0
      type: integer
    actualInputRate:
      type: integer
      description: "Reported actual input rate."
    actualOutputRate:
      type: integer
      description: "Reported actual output rate."
    clockGenRate:
      type: integer
      description: "Reported clock gen rate."
