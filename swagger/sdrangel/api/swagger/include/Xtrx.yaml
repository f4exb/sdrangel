XtrxInputSettings:
  description: XTRX
  properties:
    title:
      type: string
      description: "User-visible title."
    centerFrequency:
      type: integer
      format: int64
      description: "Device center frequency in Hz."
    devSampleRate:
      type: integer
      description: "Device I/Q sample rate in samples per second before software decimation or interpolation."
    log2HardDecim:
      type: integer
      description: "Base-2 exponent of the hardware decimation factor."
    dcBlock:
      description: Software DC blocking (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    iqCorrection:
      description: Software IQ imbalance correction (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    log2SoftDecim:
      type: integer
      description: "Base-2 exponent of the software decimation factor."
    lpfBW:
      description: LMS analog lowpass filter bandwidth (Hz)
      type: integer
    gain:
      description: Optimally distributed gain (dB)
      type: integer
    ncoEnable:
      description: Enable TSP NCO and mixing (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    ncoFrequency:
      description: Frequency shift from LO
      type: integer
    antennaPath:
      description: Antenna selected (enum value from xtrx_antenna_t)
      type: integer
    gainMode:
      description: Gain mode auto or manual (enum value from GainMode)
      type: integer
    lnaGain:
      description: Manual LNA gain
      type: integer
    tiaGain:
      description: Manual TIA gain
      type: integer
    pgaGain:
      description: Manual PGA gain
      type: integer
    extClock:
      description: Use external clock source (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    extClockFreq:
      description: Frequency (Hz) of external clock source
      type: integer
    pwrmode:
      description: LMS power mode (0 save max to 7 perf max)
      type: integer
    iqOrder:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        IQ samples order
          * 0 - Q then I (swapped)
          * 1 - I then Q (straight)
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."

XtrxInputReport:
  description: XTRX
  properties:
    success:
      description: 1 if info was successfully retrieved else 0
      type: integer
    fifoSize:
      type: integer
      description: "FIFO capacity in samples."
    fifoFill:
      type: integer
      description: "Current FIFO fill level."
    temperature:
      type: number
      format: float
      description: "Reported device temperature."
    gpsLock:
      description: 1 if GPSDO is locked else 0
      type: integer

