PERTesterSettings:
  description: "PER Tester settings"
  properties:
    packetCount:
      type: integer
      description: "Number of packet events or items."
    interval:
      type: number
      format: float
      description: "Interval setting for Per tester."
    start:
      description: "0 - immediately, 1 - on satellite AOS, 2 - on satellite mid pass"
      type: integer
      minimum: 0
      maximum: 2
    satellites:
      description: "Satellite names to start test on"
      type: array
      items:
        type: string
    packet:
      description: "Packet of data to send"
      type: string
    ignoreLeadingBytes:
      type: integer
      description: "Ignore leading bytes setting for Per tester."
    ignoreTrailingBytes:
      type: integer
      description: "Ignore trailing bytes setting for Per tester."
    txUDPAddress:
      description: "UDP address to sent packets to be transmitted to"
      type: string
    txUDPPort:
      description: "UDP port  to sent packets to be transmitted to"
      type: integer
    rxUDPAddress:
      description: "UDP address to receive packets via"
      type: string
    rxUDPPort:
      description: "UDP port to receive packets via"
      type: integer
    title:
      type: string
      description: "User-visible title."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIFeatureSetIndex:
      type: integer
      description: "Feature-set index used by the reverse API peer."
    reverseAPIFeatureIndex:
      type: integer
      description: "Feature index used by the reverse API peer."
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

PERTesterReport:
  description: PERTester
  properties:
    runningState:
      type: integer
      minimum: 0
      maximum: 3
      description: >
        Running state
          * 0 - not started
          * 1 - idle
          * 2 - running
          * 3 - error

PERTesterActions:
  description: PERTester
  properties:
    run:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Set the plugin running state
          * 0 - idle
          * 1 - run
    aos:
      description: "Acquisition of signal"
      type: object
      properties:
        satelliteName:
          description: "Name of the satellite"
          type: string
        aosTime:
          description: "Time of AOS"
          type: string
        losTime:
          description: "Time of LOS"
          type: string
