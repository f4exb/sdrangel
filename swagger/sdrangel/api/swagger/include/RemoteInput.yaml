RemoteInputSettings:
  description: RemoteInput
  properties:
    title:
      type: string
      description: "User-visible title."
    apiAddress:
      type: string
      description: "IPv4 address or host name of the API endpoint."
    apiPort:
      type: integer
      description: "TCP port of the API endpoint."
      minimum: 1
      maximum: 65535
    dataAddress:
      type: string
      description: "IPv4 address or host name used for data traffic."
    dataPort:
      type: integer
      description: "Network port used for data traffic."
      minimum: 1
      maximum: 65535
    multicastAddress:
      type: string
      description: "IP multicast group address."
    multicastJoin:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Join multicast group
        * 0 - leave group
        * 1 - join group
    dcBlock:
      type: integer
      description: "Enable DSP DC-offset correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    iqCorrection:
      type: integer
      description: "Enable I/Q imbalance correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."

RemoteInputReport:
  description: RemoteInput
  properties:
    centerFrequency:
      type: integer
      format: int64
      description: "Device center frequency in Hz."
    sampleRate:
      type: integer
      description: "Sample rate in samples per second."
    bufferRWBalance:
      description: percentage off the mid buffer (positive read leads)
      type: integer
    remoteTimestamp:
      description: string representation of timestamp as sent by the remote instance
      type: string
    minNbBlocks:
      description: Minimum number of blocks retrieved per frame
      type: integer
    maxNbRecovery:
      description: Maximum number of recovery blocks used per frame
      type: integer
