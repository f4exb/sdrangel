Command:
  description: Represents a Command object
  properties:
    group:
      type: string
      description: "Group for Command."
    description:
      type: string
      description: "Human-readable description."
    command:
      type: string
      description: "Command for Command."
    argString:
      type: string
      description: "Arg string for Command."
    key:
      description: Qt::Key
      type: integer
    keyModifiers:
      description: Qt::KeyboardModifiers
      type: integer
    associateKey:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
    release:
      description: boolean
      type: integer
      minimum: 0
      maximum: 1
