RemoteSourceSettings:
  description: "Remote channel source settings"
  properties:
    dataAddress:
      description: "Remote USB data address"
      type: string
    dataPort:
      description: "Remote USB data port"
      type: integer
      minimum: 1
      maximum: 65535
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    log2Interp:
      type: integer
      description: "Base-2 exponent of the software interpolation factor; the output sample rate is multiplied by 2^log2Interp."
    filterChainHash:
      type: integer
      description: "Identifier of the selected half-band filter chain."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    channelMarker:
      $ref: "http://swgserver:8081/api/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

RemoteSourceReport:
  description: "Remote channel source report"
  properties:
    queueLength:
      description: "Data read/write queue length in number of data frames"
      type: integer
    queueSize:
      description: "Data read/write queue size in number of data frames"
      type: integer
    samplesCount:
      description: "Absolute consumed samples count"
      type: integer
    correctableErrorsCount:
      description: "Absolute number of correctable errors"
      type: integer
    uncorrectableErrorsCount:
      description: "Absolute number of uncorrectable errors"
      type: integer
    tvSec:
      description: "Counts timestamp seconds"
      type: integer
    tvUSec:
      description: "Counts timestamp microseconds"
      type: integer
    nbOriginalBlocks:
      description: "Number of original blocks per frame"
      type: integer
    nbFECBlocks:
      description: "Number of FEC blocks per frame"
      type: integer
    centerFreq:
      description: "Stream center frequency setting in kHz"
      type: integer
      format: int64
    sampleRate:
      description: "Stream nominal sample rate in S/s"
      type: integer
    deviceCenterFreq:
      description: "Device center frequency in kHz"
      type: integer
    deviceSampleRate:
      description: "Device baseband sample rate in S/s"
      type: integer
