TraceData:
  description: see GLScopeSettings::TraceData
  properties:
    streamIndex:
      description: Source I/Q stream index
      type: integer
    projectionType:
      description: >
        Projection applied to turn the complex signal into a real trace
          * 0 - real part
          * 1 - imaginary part
          * 2 - magnitude, linear
          * 3 - squared magnitude (power), linear
          * 4 - time derivative of the squared magnitude
          * 5 - squared magnitude in dB
          * 6 - phase
          * 7 - direction of arrival from phase, positive branch
          * 8 - direction of arrival from phase, negative branch
          * 9 - phase derivative, instantaneous frequency
          * 10 - BPSK phase comparator
          * 11 - QPSK phase comparator
          * 12 - 8-PSK phase comparator
          * 13 - 16-PSK phase comparator
      type: integer
      minimum: 0
      maximum: 13
    inputIndex:
      description: Input or feed index this trace is associated with
      type: integer
    amp:
      description: Amplification factor
      type: number
      format: float
    ofs:
      description: Offset factor
      type: number
      format: float
    traceDelay:
      description: Trace delay in number of samples
      type: integer
    traceDelayCoarse:
      description: Coarse delay slider value
      type: integer
    traceDelayFine:
      description: Fine delay slider value
      type: integer
    triggerDisplayLevel:
      description: Displayable trigger display level in -1:+1 scale. Off scale if not displayable.
      type: number
      format: float
    traceColor:
      description: Trace display color. QColor
      type: integer
    traceColorR:
      description: Trace display color - red shortcut
      type: number
      format: float
    traceColorG:
      description: Trace display color - green shortcut
      type: number
      format: float
    traceColorB:
      description: Trace display color - blue shortcut
      type: number
      format: float
    hasTextOverlay:
      description: True if a text overlay has to be displayed. Boolean
      type: integer
    textOverlay:
      description: Text overlay to display
      type: string
    viewTrace:
      description: Trace visibility. Boolean
      type: integer

TriggerData:
  description: see GLScopeSettings::TriggerData
  properties:
    streamIndex:
      description: Source I/Q stream index
      type: integer
    projectionType:
      description: >
        Projection applied to turn the complex signal into a real trace
          * 0 - real part
          * 1 - imaginary part
          * 2 - magnitude, linear
          * 3 - squared magnitude (power), linear
          * 4 - time derivative of the squared magnitude
          * 5 - squared magnitude in dB
          * 6 - phase
          * 7 - direction of arrival from phase, positive branch
          * 8 - direction of arrival from phase, negative branch
          * 9 - phase derivative, instantaneous frequency
          * 10 - BPSK phase comparator
          * 11 - QPSK phase comparator
          * 12 - 8-PSK phase comparator
          * 13 - 16-PSK phase comparator
      type: integer
      minimum: 0
      maximum: 13
    inputIndex:
      description: Input or feed index this trigger is associated with
      type: integer
    triggerLevel:
      description: Level in real units
      type: number
      format: float
    triggerLevelCoarse:
      type: integer
      description: "Trigger level coarse for Trigger data."
    triggerLevelFine:
      type: integer
      description: "Trigger level fine for Trigger data."
    triggerPositiveEdge:
      description: Trigger on the positive edge (else negative). Boolean
      type: integer
    triggerBothEdges:
      description: Trigger on both edges (else only one). Boolean
      type: integer
    triggerHoldoff:
      description: Trigger holdoff in number of samples
      type: integer
    triggerDelay:
      description: Delay before the trigger is kicked off in number of samples (trigger delay)
      type: integer
    triggerDelayMult:
      description: Trigger delay as a multiplier of trace length
      type: number
      format: float
    triggerDelayCoarse:
      type: integer
      description: "Trigger delay coarse for Trigger data."
    triggerDelayFine:
      type: integer
      description: "Trigger delay fine for Trigger data."
    triggerRepeat:
      description: Number of trigger conditions before the final decisive trigger
      type: integer
    triggerColor:
      description: Trigger line display color. QColor
      type: integer
    triggerColorR:
      description: Trigger line display color - red shortcut
      type: number
      format: float
    triggerColorG:
      description: Trigger line display color - green shortcut
      type: number
      format: float
    triggerColorB:
      description: Trigger line display color - blue shortcut
      type: number
      format: float

GLScope:
  description: GLScopeGUI settings
  properties:
    displayMode:
      description: >
        Arrangement of the two traces on the scope
          * 0 - X and Y side by side horizontally
          * 1 - X and Y stacked vertically
          * 2 - X only
          * 3 - Y only
          * 4 - polar, Y against X
      type: integer
      minimum: 0
      maximum: 4
    traceIntensity:
      type: integer
      description: "Trace intensity for Gl scope."
    gridIntensity:
      type: integer
      description: "Grid intensity for Gl scope."
    time:
      type: integer
      description: "Time for Gl scope."
    timeOfs:
      type: integer
      description: "Time ofs for Gl scope."
    traceLenMult:
      type: integer
      description: Trace length multiplier (multiplies 4800 samples)
    trigPre:
      type: integer
      description: "Trig pre for Gl scope."
    tracesData:
      type: array
      description: "List of traces data."
      items:
        $ref: "http://swgserver:8081/api/swagger/include/GLScope.yaml#/TraceData"
    triggersData:
      type: array
      description: "List of triggers data."
      items:
        $ref: "http://swgserver:8081/api/swagger/include/GLScope.yaml#/TriggerData"
