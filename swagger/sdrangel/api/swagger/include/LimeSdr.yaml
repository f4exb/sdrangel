LimeSdrMIMOSettings:
  description: LimeSDR
  properties:
    # General
    title:
      type: string
      description: "User-visible title."
    devSampleRate:
      type: integer
      description: "Device I/Q sample rate in samples per second before software decimation or interpolation."
    gpioDir:
      description: GPIO pin direction LSB first; 0 input, 1 output
      type: integer
      format: int8
    gpioPins:
      description: GPIO pins to write; LSB first
      type: integer
      format: int8
    extClock:
      description: Boolean 1 if external clock source else 0
      type: integer
      minimum: 0
      maximum: 1
    extClockFreq:
      description: Frequency (Hz) of external clock source
      type: integer
    useReverseAPI:
      description: Boolean
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    # Rx general
    rxCenterFrequency:
      type: integer
      format: int64
      description: "Receive center frequency in Hz."
    log2HardDecim:
      type: integer
      description: "Base-2 exponent of the hardware decimation factor."
    log2SoftDecim:
      type: integer
      description: "Base-2 exponent of the software decimation factor."
    dcBlock:
      description: Boolean
      type: integer
      minimum: 0
      maximum: 1
    iqCorrection:
      description: Boolean
      type: integer
      minimum: 0
      maximum: 1
    rxTransverterMode:
      description: Boolean
      type: integer
      minimum: 0
      maximum: 1
    rxTransverterDeltaFrequency:
      type: integer
      format: int64
      description: "Receive frequency translation applied in transverter mode in Hz."
    iqOrder:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        IQ samples order
          * 0 - Q then I (swapped)
          * 1 - I then Q (straight)
    ncoEnableRx:
      description: Boolean 1 to enable TSP NCO and mixing else 0
      type: integer
      minimum: 0
      maximum: 1
    ncoFrequencyRx:
      description: Rx Actual NCO frequency (the resulting frequency with mixing is displayed)
      type: integer
    # Rx channel 0
    lpfBWRx0:
      description: Rx[0] LMS analog lowpass filter bandwidth (Hz)
      type: number
      format: float
    lpfFIREnableRx0:
      description: Boolean 1 to enable Rx[0] LMS digital lowpass FIR filters else 0
      type: integer
      minimum: 0
      maximum: 1
    lpfFIRBWRx0:
      description: Rx[0] LMS digital lowpass FIR filters bandwidth (Hz)
      type: number
      format: float

    gainRx0:
      description: Rx[0] Optimally distributed gain (dB)
      type: integer
    antennaPathRx0:
      description: >
        Rx[0] Antenna connection (PathRxRFE):
          * 0 - None
          * 1 - LNA High
          * 2 - LNA low
          * 3 - LNA Wide
          * 4 - LB TX1
          * 5 - LB TX2
      type: integer
      minimum: 0
      maximum: 5
    gainModeRx0:
      description: >
        Rx[0] Gain mode:
          * 0 - auto
          * 1 - manual
      type: integer
      minimum: 0
      maximum: 1
    lnaGainRx0:
      description: Rx[0] Manual LNA gain
      type: integer
    tiaGainRx0:
      description: Rx[0] Manual TIA gain
      type: integer
    pgaGainRx0:
      description: Rx[0] Manual PGA gain
      type: integer
    # Rx channel 1
    lpfBWRx1:
      description: Rx[1] LMS analog lowpass filter bandwidth (Hz)
      type: number
      format: float
    lpfFIREnableRx1:
      description: Boolean 1 to enable Rx[1] LMS digital lowpass FIR filters else 0
      type: integer
      minimum: 0
      maximum: 1
    lpfFIRBWRx1:
      description: Rx[1] LMS digital lowpass FIR filters bandwidth (Hz)
      type: number
      format: float
    gainRx1:
      description: Rx[1] Optimally distributed gain (dB)
      type: integer
    antennaPathRx1:
      description: >
        Rx[1] Antenna connection (PathRxRFE):
          * 0 - None
          * 1 - LNA High
          * 2 - LNA low
          * 3 - LNA Wide
          * 4 - LB TX1
          * 5 - LB TX2
      type: integer
      minimum: 0
      maximum: 5
    gainModeRx1:
      description: >
        Rx[1] Gain mode:
          * 0 - auto
          * 1 - manual
      type: integer
      minimum: 0
      maximum: 1
    lnaGainRx1:
      description: Rx[1] Manual LNA gain
      type: integer
    tiaGainRx1:
      description: Rx[1] Manual TIA gain
      type: integer
    pgaGainRx1:
      description: Rx[1] Manual PGA gain
      type: integer
    # Tx general
    txCenterFrequency:
      type: integer
      format: int64
      description: "Transmit center frequency in Hz."
    log2HardInterp:
      type: integer
      description: "Base-2 exponent of the hardware interpolation factor."
    log2SoftInterp:
      type: integer
      description: "Base-2 exponent of the software interpolation factor."
    txTransverterMode:
      description: Boolean
      type: integer
      minimum: 0
      maximum: 1
    txTransverterDeltaFrequency:
      type: integer
      format: int64
      description: "Transmit frequency translation applied in transverter mode in Hz."
    ncoEnableTx:
      description: Boolean 1 to enable TSP NCO and mixing else 0
      type: integer
      minimum: 0
      maximum: 1
    ncoFrequencyTx:
      description: Tx Actual NCO frequency (the resulting frequency with mixing is displayed)
      type: integer
    # Tx channel 0
    lpfBWTx0:
      description: Tx[0] LMS analog lowpass filter bandwidth (Hz)
      type: number
      format: float
    lpfFIREnableTx0:
      description: Boolean 1 to enable Tx[0] LMS digital lowpass FIR filters else 0
      type: integer
      minimum: 0
      maximum: 1
    lpfFIRBWTx0:
      description: Tx[0] LMS digital lowpass FIR filters bandwidth (Hz)
      type: number
      format: float
    gainTx0:
      description: Tx[0] Optimally distributed gain (dB)
      type: integer
    antennaPathTx0:
      description: >
        Tx[0] Antenna connection (PathTxRFE):
          * 0 - None
          * 1 - RF connector 1
          * 2 - RF connector 2
      type: integer
      minimum: 0
      maximum: 2
    # Tx channel 1
    lpfBWTx1:
      description: Tx[1] LMS analog lowpass filter bandwidth (Hz)
      type: number
      format: float
    lpfFIREnableTx1:
      description: Boolean 1 to enable Tx[1] LMS digital lowpass FIR filters else 0
      type: integer
      minimum: 0
      maximum: 1
    lpfFIRBWTx1:
      description: Tx[1] LMS digital lowpass FIR filters bandwidth (Hz)
      type: number
      format: float
    gainTx1:
      description: Tx[1] Optimally distributed gain (dB)
      type: integer
    antennaPathTx1:
      description: >
        Tx[1] Antenna connection (PathTxRFE):
          * 0 - None
          * 1 - RF connector 1
          * 2 - RF connector 2
      type: integer
      minimum: 0
      maximum: 2

LimeSdrInputReport:
  description: LimeSDR
  properties:
    success:
      description: 1 if info was successfully retrieved else 0
      type: integer
    streamActive:
      description: 1 if active else 0
      type: integer
      minimum: 0
      maximum: 1
    fifoSize:
      type: integer
      description: "FIFO capacity in samples."
    fifoFill:
      type: integer
      description: "Current FIFO fill level."
    underrunCount:
      type: integer
      description: "Number of stream underrun events."
    overrunCount:
      type: integer
      description: "Number of stream overrun events."
    droppedPacketsCount:
      type: integer
      description: "Number of dropped packets."
    linkRate:
      type: number
      format: float
      description: "Measured streaming link rate."
    hwTimestamp:
      description: Hardware timestamp
      type: integer
      format: int64
    temperature:
      type: number
      format: float
      description: "Reported device temperature."
    gpioDir:
      type: integer
      format: int8
      description: "GPIO direction bit mask, with one bit per pin."
    gpioPins:
      type: integer
      format: int8
      description: "GPIO pin-state bit mask, with one bit per pin."

