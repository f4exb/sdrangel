LimeSdrInputSettings:
  description: LimeSDR
  properties:
    title:
      type: string
      description: "User-visible title."
    centerFrequency:
      type: integer
      format: int64
      description: "Device center frequency in Hz."
    devSampleRate:
      type: integer
      description: "Device I/Q sample rate in samples per second before software decimation or interpolation."
    log2HardDecim:
      type: integer
      description: "Base-2 exponent of the hardware decimation factor."
    dcBlock:
      type: integer
      description: "Enable DSP DC-offset correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    splitFreq:
      type: integer
      description: "Split freq setting for Lime sdr input."
    iqCorrection:
      type: integer
      description: "Enable I/Q imbalance correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    log2SoftDecim:
      type: integer
      description: "Base-2 exponent of the software decimation factor."
    lpfBW:
      type: integer
      description: "Analog low-pass filter bandwidth in Hz."
    lpfFIREnable:
      type: integer
      description: "Enable the digital FIR low-pass filter (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    lpfFIRBW:
      type: integer
      description: "Digital FIR low-pass filter bandwidth in Hz."
    gain:
      type: integer
      description: "Gain setting; units and available values depend on the device or plugin."
    ncoEnable:
      type: integer
      description: "Enable the numerically controlled oscillator (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    ncoFrequency:
      type: integer
      description: "Numerically controlled oscillator frequency in Hz."
    antennaPath:
      type: integer
      description: "Selected RF antenna path."
    gainMode:
      type: integer
      description: "Gain-control mode selection."
    lnaGain:
      type: integer
      description: "Low-noise-amplifier gain setting."
    tiaGain:
      type: integer
      description: "TIA gain setting for Lime sdr input."
    pgaGain:
      type: integer
      description: "PGA gain setting for Lime sdr input."
    extClock:
      type: integer
      description: "Use an external reference clock (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    extClockFreq:
      type: integer
      description: "External reference-clock frequency in Hz."
    transverterMode:
      type: integer
      description: "Enable transverter frequency translation (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    transverterDeltaFrequency:
      type: integer
      format: int64
      description: "Frequency translation applied in transverter mode in Hz."
    iqOrder:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        IQ samples order
          * 0 - Q then I (swapped)
          * 1 - I then Q (straight)
    gpioDir:
      type: integer
      format: int8
      description: "GPIO direction bit mask, with one bit per pin."
    gpioPins:
      type: integer
      format: int8
      description: "GPIO pin-state bit mask, with one bit per pin."
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."

