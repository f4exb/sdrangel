VORDemodSettings:
  description: VORDemod
  properties:
    inputFrequencyOffset:
      type: integer
      format: int64
      description: "Channel frequency offset from the device center frequency in Hz."
    navId:
      description: VOR unique identifier when set by VOR localizer feature
      type: integer
    squelch:
      description: power squelch threshold in decibels
      type: number
      format: float
    volume:
      type: number
      format: float
      description: "Audio volume multiplier."
    audioMute:
      type: integer
      description: "Mute audio output (1 muted, 0 unmuted)."
      minimum: 0
      maximum: 1
    identBandpassEnable:
      type: integer
      description: "Ident bandpass enable setting for Vor demod."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    audioDeviceName:
      type: string
      description: "Name of the audio device to use."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    identThreshold:
      description: Morse code ident threshold (linear SNR)
      type: integer
    channelMarker:
      $ref: "http://swgserver:8081/api/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

VORDemodReport:
  description: VORDemod
  properties:
    channelPowerDB:
      description: power received in channel (dB)
      type: number
      format: float
    squelch:
      description: squelch status (1 if open else 0)
      type: integer
    audioSampleRate:
      type: integer
      description: "Audio sample rate in samples per second."
    volume:
      type: number
      format: float
      description: "Audio volume multiplier."
    navId:
      description: VOR unique identifier when set by VOR localizer feature
      type: integer
    radial:
      description: current detected radial (degrees)
      type: number
      format: float
    refMag:
      description: current reference signal magnitude (dB)
      type: number
      format: float
    varMag:
      description: current variable signal magnitude (dB)
      type: number
      format: float
    validRadial:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Radial validity estimation
          * 0 - Radial is invalid
          * 1 - Radial is valid
    validRefMag:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Reference signal magnitude validity
          * 0 - Magnitude below threshold
          * 1 - Magnitude above threshold
    validVarMag:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Variable signal magnitude validity
          * 0 - Magnitude below threshold
          * 1 - Magnitude above threshold
    morseIdent:
      description: current identification morse code transcript
      type: string
