PlutoSdrInputSettings:
  description: PlutoSDR
  properties:
    title:
      type: string
      description: "User-visible title."
    centerFrequency:
      type: integer
      format: int64
      description: "Device center frequency in Hz."
    devSampleRate:
      type: integer
      description: "Device I/Q sample rate in samples per second before software decimation or interpolation."
    LOppmTenths:
      type: integer
      description: "Local-oscillator correction in tenths of a part per million."
    lpfFIREnable:
      description: Low pass FIR filter enable (1 if enabled else 0)
      type: integer
      minimum: 0
      maximum: 1
    lpfFIRBW:
      description: digital lowpass FIR filter bandwidth (Hz)
      type: integer
    lpfFIRlog2Decim:
      description: digital lowpass FIR filter log2 of decimation factor (0..2)
      type: integer
      minimum: 0
      maximum: 2
    lpfFIRGain:
      description: digital lowpass FIR filter gain (dB)
      type: integer
    fcPos:
      description: 0=Infra 1=Supra 2=Center
      type: integer
      minimum: 0
      maximum: 2
    dcBlock:
      type: integer
      description: "Enable DSP DC-offset correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    iqCorrection:
      type: integer
      description: "Enable I/Q imbalance correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    hwBBDCBlock:
      type: integer
      description: "Enable hw bbdc block (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    hwRFDCBlock:
      type: integer
      description: "Enable hw rfdc block (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    hwIQCorrection:
      type: integer
      description: "Enable hw i/q correction (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    log2Decim:
      type: integer
      description: "Base-2 exponent of the software decimation factor; the output sample rate is divided by 2^log2Decim."
    lpfBW:
      description: Analog lowpass filter bandwidth (Hz)
      type: integer
    gain:
      description: Hardware gain
      type: integer
    antennaPath:
      type: integer
      description: "Selected RF antenna path."
    gainMode:
      type: integer
      description: "Gain-control mode selection."
    transverterMode:
      type: integer
      description: "Enable transverter frequency translation (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    transverterDeltaFrequency:
      type: integer
      format: int64
      description: "Frequency translation applied in transverter mode in Hz."
    iqOrder:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        IQ samples order
          * 0 - Q then I (swapped)
          * 1 - I then Q (straight)
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."

