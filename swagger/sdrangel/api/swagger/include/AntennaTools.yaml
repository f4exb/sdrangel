AntennaToolsSettings:
  description: Antenna Tools
  properties:
    dipoleFrequencyMHz:
      type: number
      format: float
      description: "Dipole frequency in MHz."
    dipoleEndEffectFactor:
      type: number
      format: float
      description: "Dipole end effect factor setting for Antenna tools."
    dishFrequencyMHz:
      type: number
      format: float
      description: "Dish frequency in MHz."
    dishDiameter:
      type: number
      format: float
      description: "Dish diameter setting for Antenna tools."
    dishDepth:
      type: number
      format: float
      description: "Dish depth setting for Antenna tools."
    dishEfficiency:
      type: integer
      description: "Dish efficiency setting for Antenna tools."
    title:
      type: string
      description: "User-visible title."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIFeatureSetIndex:
      type: integer
      description: "Feature-set index used by the reverse API peer."
    reverseAPIFeatureIndex:
      type: integer
      description: "Feature index used by the reverse API peer."
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."
