FileSourceSettings:
  description: FileSource
  properties:
    fileName:
      description: The name (path) of the file being read
      type: string
    loop:
      description: 1 if playing in a loop else 0
      type: integer
    log2Interp:
      type: integer
      description: "Base-2 exponent of the software interpolation factor; the output sample rate is multiplied by 2^log2Interp."
    filterChainHash:
      type: integer
      description: "Identifier of the selected half-band filter chain."
    gainDB:
      type: integer
      description: "Gain dB in dB."
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    channelMarker:
      $ref: "http://swgserver:8081/api/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

FileSourceReport:
  description: FileSource
  properties:
    fileName:
      type: string
      description: "File name or path."
    fileSampleRate:
      description: Record sample rate in S/s
      type: integer
    fileSampleSize:
      description: Record sample size in number of bits
      type: integer
    absoluteTime:
      description: Absolute record time string representation
      type: string
    elapsedTime:
      description: Elapsed time since beginning string representation
      type: string
    durationTime:
      description: Duration time string representation
      type: string
    sampleRate:
      description: Channel sample rate in S/s
      type: integer
    channelPowerDB:
      description: power transmitted in channel (dB)
      type: number
      format: float

FileSourceActions:
  description: FileSource
  properties:
    play:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Play or Pause stream
          * 0 - Pause
          * 1 - Play
    seekMillis:
      description: Move play cursor to this thousands of total time from the start
      type: integer
