ADSBDemodSettings:
  description: ADSBDemod
  properties:
    inputFrequencyOffset:
      description: channel center frequency shift from baseband center in Hz
      type: integer
      format: int64
    rfBandwidth:
      description: channel RF bandwidth in Hz
      type: number
      format: float
    correlationThreshold:
      type: number
      format: float
      description: "Minimum correlation score required to accept a frame preamble."
    samplesPerBit:
      type: integer
      description: "Number of input samples used to represent each bit."
    demodModeS:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Demodulate all mode S frames or just ADS-B
          * 0 - just ADS-B
          * 1 - All mode S
    interpolatorPhaseSteps:
      type: integer
      description: Number of phase steps in channel interpolator
    interpolatorTapsPerPhase:
      type: number
      format: float
      description: Number of taps per phase in channel interpolator
    removeTimeout:
      type: integer
      description: "Seconds without a frame after which an aircraft is removed from the display."
    feedEnabled:
      type: integer
      description: "Enable forwarding of received data to the configured feed (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    exportClientEnabled:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Send data to server
          * 0 - Do not send data
          * 1 - Send data
    exportClientHost:
      description: Host to send data to
      type: string
    exportClientPort:
      type: integer
      description: "Export client port."
      minimum: 1
      maximum: 65535
    exportClientFormat:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Format of sent data
          * 0 - Beast binary
          * 1 - Beast hex
    exportServerEnabled:
      type: integer
      description: "Enable the data-export server (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    exportServerPort:
      type: integer
      description: "Export server port."
      minimum: 1
      maximum: 65535
    importEnabled:
      type: integer
      description: "Enable importing data from the configured service (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    importHost:
      type: string
      description: "Import host setting for ADS-B demod."
    importUsername:
      type: string
      description: OpenSky OAuth2 client ID.
    importPassword:
      type: string
      description: OpenSky OAuth2 client secret.
    importParameters:
      type: string
      description: "Import parameters setting for ADS-B demod."
    importPeriod:
      type: number
      format: float
      description: "How often to import aircraft from the configured web service, in seconds."
    importMinLatitude:
      type: string
      description: "Import min latitude setting for ADS-B demod."
    importMaxLatitude:
      type: string
      description: "Import max latitude setting for ADS-B demod."
    importMinLongitude:
      type: string
      description: "Import min longitude setting for ADS-B demod."
    importMaxLongitude:
      type: string
      description: "Import max longitude setting for ADS-B demod."
    logFilename:
      type: string
      description: "Log file name or path."
    logEnabled:
      type: integer
      description: "Enable logging to the configured file (1 enabled, 0 disabled)."
      minimum: 0
      maximum: 1
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    channelMarker:
      $ref: "http://swgserver:8081/api/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

ADSBDemodReport:
  description: ADSBDemod
  properties:
    channelPowerDB:
      description: power received in channel (dB)
      type: number
      format: float
    channelSampleRate:
      type: integer
      description: "Effective sample rate delivered to the channel in samples per second."
    targetName:
      type: string
      description: "Name of the selected or tracked target."
    targetAzimuth:
      type: number
      format: float
      description: "Target azimuth in degrees clockwise from north."
    targetElevation:
      type: number
      format: float
      description: "Target elevation in degrees above the horizon."
    targetRange:
      type: number
      format: float
      description: "Distance to the selected or tracked target."
    aircraftState:
      type: array
      description: "Current states of aircraft tracked by the ADS-B demodulator."
      items:
        $ref: "http://swgserver:8081/api/swagger/include/ADSBDemod.yaml#/ADSBDemodAircraftState"
    demodStats:
      $ref: "http://swgserver:8081/api/swagger/include/ADSBDemod.yaml#/ADSBDemodStats"
      description: "Demodulator frame and error statistics since the last reset."

ADSBDemodStats:
  description: ADS-B demodulator statistics
  properties:
    correlatorMatches:
      type: integer
      format: int64
      description: "Total number of correlator matches."
    adsbFrames:
      type: integer
      format: int64
      description: "ADS-B frames with a correct CRC."
    modesFrames:
      type: integer
      format: int64
      description: "Non-ADS-B Mode-S frames with a correct CRC."
    preambleFails:
      type: integer
      format: int64
      description: "Frames rejected for preamble errors."
    crcFails:
      type: integer
      format: int64
      description: "Frames with an incorrect CRC."
    typeFails:
      type: integer
      format: int64
      description: "Frames with an unknown DF type so the CRC cannot be checked."
    invalidFails:
      type: integer
      format: int64
      description: "Frames with reserved bits set."
    icaoFails:
      type: integer
      format: int64
      description: "Frames with a reserved ICAO address."

ADSBDemodAircraftState:
  properties:
    icao:
      description: "24-bit hex ICAO identifier"
      type: string
    callsign:
      description: "Callsign (E.g. BAW123)"
      type: string
    latitude:
      description: "Latitude of aircraft in degrees"
      type: number
      format: float
      minimum: -90
      maximum: 90
    longitude:
      description: "Longitude of aircraft in degrees"
      type: number
      format: float
      minimum: -180
      maximum: 180
    altitude:
      description: "Altitude of aircraft in feet"
      type: integer
    groundSpeed:
      description: "Groundspeed of aircraft in knots"
      type: integer
    flight:
      description: "Guess at the flight number"
      type: string
    pressureAltitude:
      description: "Pressure altitude in feet"
      type: integer
    heading:
      description: "Heading in degrees magnetic"
      type: number
      format: float
    track:
      description: "Track in degrees true"
      type: number
      format: float
    verticalRate:
      description: "Vertical climb rate in feet per minute"
      type: integer
    emitterCategory:
      description: "Aircraft emitter category"
      type: string
    status:
      description: "Aircraft status"
      type: string
    squawk:
      description: "Mode-A squawk code"
      type: integer
    ident:
      description: "Special position identification (IDENT) active"
      type: integer
      minimum: 0
      maximum: 1
    onSurface:
      description: "Aircraft is on the surface"
      type: integer
      minimum: 0
      maximum: 1
    selectedAltitude:
      description: "Selected altitude in feet"
      type: integer
    selectedHeading:
      description: "Selected heading in degrees"
      type: integer
    trueAirspeed:
      description: "True airspeed in knots"
      type: integer
    indicatedAirspeed:
      description: "Indicated airspeed in knots"
      type: integer
    mach:
      description: "Mach number"
      type: number
      format: float
    roll:
      description: "Roll angle in degrees"
      type: number
      format: float
    turnRate:
      description: "Turn rate in degrees per second"
      type: number
      format: float
    range:
      description: "Distance from station to aircraft"
      type: number
      format: float
    azimuth:
      description: "Azimuth from station to aircraft in degrees"
      type: number
      format: float
    elevation:
      description: "Elevation from station to aircraft in degrees"
      type: number
      format: float
    adsbFrames:
      description: "Number of ADS-B frames received from this aircraft"
      type: integer
    modesFrames:
      description: "Number of non-ADS-B Mode-S frames received from this aircraft"
      type: integer
    minCorrelation:
      description: "Minimum preamble correlation in dB"
      type: number
      format: float
    maxCorrelation:
      description: "Maximum preamble correlation in dB"
      type: number
      format: float
    correlation:
      description: "Latest preamble correlation in dB"
      type: number
      format: float
