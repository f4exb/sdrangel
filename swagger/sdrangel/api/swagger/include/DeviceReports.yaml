DeviceReport:
  description: Base device report. Only the device report corresponding to the device specified in the deviceHwType is or should be present.
  discriminator: deviceHwType
  required:
    - deviceHwType
    - direction
  properties:
    deviceHwType:
      description: Device hardware type code
      type: string
    direction:
      description: 0 for Rx only, 1 for Tx only or 2 for any number and direction (default 0)
      type: integer
    airspyReport:
      $ref: "http://swgserver:8081/api/swagger/include/Airspy.yaml#/AirspyReport"
      description: "Airspy report data for Device."
    airspyHFReport:
      $ref: "http://swgserver:8081/api/swagger/include/AirspyHF.yaml#/AirspyHFReport"
      description: "Airspy hf report data for Device."
    androidSDRDriverInputReport:
      $ref: "http://swgserver:8081/api/swagger/include/AndroidSDRDriverInput.yaml#/AndroidSDRDriverInputReport"
      description: "Android sdr driver input report data for Device."
    bladeRF2InputReport:
