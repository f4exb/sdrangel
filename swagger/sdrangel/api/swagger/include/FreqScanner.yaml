FreqScannerSettings:
  description: FreqScanner
  properties:
    channelBandwidth:
      description: >
        Bandwidth in Hz of each scanned channel.
      type: integer
    channelShift:
      description: >
        Frequency shift in Hz applied to the tuned channel from the scanned frequency,
        for modes such as SSB or CW where the signal sits on one side of centre.
      type: integer
    channelFrequencyOffset:
      description: >
        Minimum frequency shift in Hz of the tuned channel from the centre of
        reception, used to keep it clear of a DC spike.
      type: integer
    threshold:
      type: number
      format: float
      description: >
        Power threshold in dB above which a scanned frequency counts as active.
    frequencies:
      type: array
      description: "List of frequencies."
      items:
        $ref: "http://swgserver:8081/api/swagger/include/FreqScanner.yaml#/FreqScannerFrequency"
    channel:
      type: string
      description: >
        Channel that is tuned to the active frequency, as a device set and channel
        index, for example "R1:0" for channel 0 of receive device set 1.
    scanTime:
      type: number
      format: float
      description: >
        Time in seconds that each power measurement is averaged over.
    retransmitTime:
      type: number
      format: float
      description: >
        Time in seconds to wait after the power on the active frequency falls below
        the threshold before scanning restarts. In multiplex mode this is instead the
        time spent listening to each frequency.
    tuneTime:
      type: number
      format: float
      description: >
        Time in milliseconds to wait after retuning the device before measuring, to allow
        for PLL settling and device to host transfer latency.
    priority:
      type: integer
      description: >
        Which frequency becomes active when several are above the threshold
          * 0 - the one with the highest power
          * 1 - the one earliest in the frequency list
    measurement:
      type: integer
      description: >
        How channel power is measured from the FFT bins
          * 0 - peak, the highest bin
          * 1 - total, the sum of every bin
    mode:
      type: integer
      description: >
        Run mode
          * 0 - single, scan every frequency once and stop
          * 1 - continuous, rescan when the active frequency goes quiet
          * 2 - scan only, measure repeatedly without ever tuning the channel
          * 3 - multiplex, step through the frequencies listening to each in turn
    rgbColor:
      type: integer
      description: "Display color encoded as an RGB integer."
    title:
      type: string
      description: "User-visible title."
    streamIndex:
      description: MIMO channel. Not relevant when connected to SI (single Rx).
      type: integer
    useReverseAPI:
      description: Synchronize with reverse API (1 for yes, 0 for no)
      type: integer
      minimum: 0
      maximum: 1
    reverseAPIAddress:
      type: string
      description: "IPv4 address or host name of the reverse API peer."
    reverseAPIPort:
      type: integer
      description: "TCP port of the reverse API peer."
      minimum: 1
      maximum: 65535
    reverseAPIDeviceIndex:
      type: integer
      description: "Device-set index used by the reverse API peer."
    reverseAPIChannelIndex:
      type: integer
      description: "Channel index used by the reverse API peer."
    channelMarker:
      $ref: "http://swgserver:8081/api/swagger/include/ChannelMarker.yaml#/ChannelMarker"
      description: "Channel-marker display configuration."
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
      description: "Saved expanded or collapsed state of the GUI sections."

FreqScannerReport:
  description: FreqScanner
  properties:
    channelSampleRate:
      type: integer
      description: "Effective sample rate delivered to the channel in samples per second."
    scanState:
      description: (IDLE=0, START_SCAN=1, SCANNING=2, WAIT_FOR_END_TX=3, WAIT_FOR_RETRANSMISSION=4)
      type: integer
    channelState:
      type: array
      description: "List of channel state."
      items:
        $ref: "http://swgserver:8081/api/swagger/include/FreqScanner.yaml#/FreqScannerChannelState"

FreqScannerChannelState:
  properties:
    frequency:
      description: "Channel centre frequency in Hz"
      type: integer
    power:
      description: "Channel power in dB"
      type: number
      format: float

FreqScannerFrequency:
  properties:
    frequency:
      type: integer
      format: int64
      description: >
        Frequency to scan, in Hz.
    enabled:
      type: integer
      description: >
        Whether this frequency takes part in the scan (1 to scan it, 0 to skip it).
    notes:
      type: string
      description: >
        Free text note about this frequency, such as the station or service name.
    channel:
      type: string
      description: >
        Overrides the scanner-wide channel for this frequency only, as a device set and
        channel index such as "R1:0". Empty to use the scanner's own channel setting.
    channelBandwidth:
      type: string
      description: >
        Overrides the scanner-wide channel bandwidth in Hz for this frequency only.
        Empty to use the scanner's own setting.
    threshold:
      type: string
      description: >
        Overrides the scanner-wide power threshold in dB for this frequency only.
        Empty to use the scanner's own setting.
    squelch:
      type: string
      description: >
        Squelch threshold in dB to apply to the tuned channel when this frequency becomes
        active. Empty to leave the channel's own squelch alone.

FreqScannerActions:
  description: "Frequency Scanner actions"
  properties:
    run:
      type: integer
      minimum: 0
      maximum: 1
      description: >
        Set the plugin running state
          * 0 - idle
          * 1 - run
